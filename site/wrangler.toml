# The landing page (public/, Workers static assets), POST /api/waitlist, and Connect with Notion (src/notion.js).
# Deploy: cd site && npx wrangler@4 deploy   (CI: .github/workflows/site.yml on changes under site/)
name = "www"   # https://www.jobpilotto.top; also https://www.jobpilotto.workers.dev, which never changes (installed apps call it; the account's workers.dev subdomain is "jobpilotto")
main = "src/index.js"
compatibility_date = "2026-09-01"

# Hosts: jobadabra.top (19 Oct 2026, the new main address) and jobpilotto.top are aliases of this worker; workers.dev stays on (installed apps and old engine tags call it, forever); jobpilotto.top is an alias on the same worker
# (the bare name redirects to www: a Cloudflare Redirect Rule on the zone for static pages, src/hosts.js for the rest). Replaceable: another domain is two more lines here.
workers_dev = true
routes = [
  {pattern = "www.jobpilotto.top", custom_domain = true},
  {pattern = "jobpilotto.top", custom_domain = true},
  {pattern = "www.jobadabra.top", custom_domain = true},
  {pattern = "jobadabra.top", custom_domain = true},
]

[ai]
binding = "AI"

# Our e-mail sender (src/mail.js): Cloudflare Email Sending from jobpilotto.top (the domain is onboarded under Compute > Email Service > Email Sending).
# MAIL = "on" sends; anything else sends nothing (the kill switch). Bounce/complaint events reach queue() through a Queues event subscription (see src/mail-unsub.js).
[[send_email]]
name = "EMAIL"

[assets]
directory = "./public"
binding = "ASSETS"
# The worker runs first for the pages, so the old host can redirect them (src/hosts.js legacyPageRedirect); every other path is served as before.
run_worker_first = ["/", "/changelog", "/compare", "/friends", "/intelligence", "/platforms", "/pricing", "/privacy", "/ready-live", "/terms", "/*.html"]

# Pro early-access sign-ups.
[[kv_namespaces]]
binding = "WAITLIST"
id = "a871d4644b614266b5bfa7f1b5e811c1"

# Connect with Notion (Notion public connection "Job Pilotto"). The secret: npx wrangler@4 secret put NOTION_CLIENT_SECRET
# The session tokens live 10 minutes in the WAITLIST namespace under "notion:<hash>".
# One-click setup: the connection's settings (notion.so/profile/integrations → Job Pilotto → Basic information →
# Notion URL for optional template) hold https://adaptable-bit-846.notion.site/Job-Pilotto-3e862be8fd868143b431df70d505ed7c,
# so Notion's consent page offers "Use a template provided by the developer" and the token carries duplicated_template_id.
[vars]
# Staged rollout of learned recipes, wording and page meanings (site/src/canary-reach.js). OFF for now (owner, 9 Oct 2026): with few installs a
# learned item reaches every install at once, still validated and rolled back on failure. Set to "on" again once the user base is larger.
LEARNING_CANARY = "off"
# /admin/ai-cost counts from this day (site/src/jobcost.js): every product key was replaced on 8 Oct 2026 (~13:15 UTC), measuring starts that day.
AI_COST_SINCE = "2026-10-08"
GITHUB_REPO = "GarryOne/job-pilotto"
# Sentry errors to the separate "Job Pilotto Sentry" Telegram bot (src/sentry-alert.js); needs the secrets SENTRY_TELEGRAM_TOKEN and SENTRY_TELEGRAM_CHAT. "off" = kill switch.
SENTRY_TELEGRAM = "on"
# Free AI (src/free-ai.js): Workers AI for every install; limits in code, the daily lines here. FREE_AI = "off" is the kill switch.
# The account whose Workers AI usage the daily allowance reads (site/src/free-ai-usage.js); the read token is the Worker secret CF_ANALYTICS_TOKEN (Account Analytics: Read).
CF_ACCOUNT_ID = "f192582d62c440f34f9ca7997558cee3"
# Free AI limits. EARLY-ADOPTER values (owner, 16 Oct 2026: "in the first period, we can be more generous"): per install 50 calls/min, $0.50/day, $5/month;
# global $5/day alert, $10/day stop, $200/month stop with an alert at $100 (owner, 16 Oct 2026: default-on hosted Always on for trials hits the old $100 at ~200 new installs a month). With traction go back to the TIGHT set (also the code defaults in site/src/free-ai.js):
# per install 30 calls/min, $0.30/day, $3/month; global $3/day alert, $10/day stop, $60/month stop, alert at $40. A config change only: edit these vars.
FREE_AI_TRIAL_USD = "2"   # the lifetime budget of one trial install (owner, 16 Oct 2026: "$2 per free user"); Pro credit is a separate lane and never counts here
FREE_AI_INSTALL_MINUTE_CALLS = "50"
FREE_AI_INSTALL_DAY_USD = "0.50"
FREE_AI_INSTALL_MONTH_USD = "5"
FREE_AI_ALERT_USD = "5"
FREE_AI_STOP_USD = "10"
FREE_AI_MONTH_ALERT_USD = "100"
FREE_AI_MONTH_STOP_USD = "200"
# The Workers Free plan's 10,000 neurons a day no longer applies: the account is on Workers Paid (owner, 16 Oct 2026). Spend is guarded by the $ lines above. Remove this line to go back to the free-plan stop.
FREE_AI_NEURONS = "off"
MARKETING_MAIL = "off"  # promotional mail (Pro launch, tips): only the owner turns it "on" (src/mail.js)
TRIAL_REMINDERS = "off"  # "N applications left" / "trial ends in 3 days": a Pro push, off (src/mail-lifecycle.js)
# The Pro plan (src/pro.js, spec docs/superpowers/specs/2026-10-16-pro-plan.md): "off" = nothing visible, "test" = Stripe test mode only, "live" = the owner flips it.
MAIL = "off"       # "on" once the sending domain is onboarded (src/mail.js)
PRO_PLAN = "off"
PRO_PRICE_USD = "29"      # shown in the app and on the site (VAT included)
PRO_LAUNCH_USD = "19"     # the early-adopter launch price; "" ends it
# Payment prices (public ids; the provider's dashboard, test mode first). Secrets (Worker): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET. STRIPE_TAX = "on" once the owner turns Stripe Tax on. Webhook URL: https://www.jobpilotto.top/api/pro/webhook
STRIPE_PRICE_PRO = ""
STRIPE_PRICE_TOPUP5 = ""
STRIPE_PRICE_TOPUP10 = ""
STRIPE_PRICE_TOPUP20 = ""
# Hosted Always on (src/hosted.js, spec docs/superpowers/specs/2026-10-16-hosted-always-on.md): "off" = every route answers 404, "on" = the owner flips it after the end-to-end test.
HOSTED_ALWAYS_ON = "off"
HOSTED_MAX_RUNS_DAY = "2000"         # global cap of hosted runs a day (src/hosted-tick.js); trial runs are capped first by HOSTED_TRIAL_MAX_RUNS_DAY
HOSTED_TRIAL_MAX_RUNS_DAY = "1500"
HOSTED_RUN_MICRO = "11000"   # compute debited per finished run, micro-USD: 2x the $0.0055 measured in a container (owner, 17 Oct 2026: "$0.011, keep 2x")
# Ready to send, phase 1 (src/ready.js, spec docs/superpowers/specs/2026-10-17-ready-to-send.md): "off" = every route answers 404. Secret READY_OWNER = the owner's install id (only that install reaches a route).
READY_TO_SEND = "on"
READY_NIGHT_MAX_USD = "1"   # a night's container + AI cost stops the batch here (owner, 17 Oct 2026: a cap per night)
STRONG_ON = "off"   # "on" once the Workers Paid plan is on: kits/CVs/insights then use the stronger model
LICENSE_PUBLIC_KEY = "cfYdshTDuVKHsd89v28_UbZieTTEpId-sKptFb1vu40"   # the owner's public key (desktop/lib/license.js)   # form reports that recur are queued for the private triage (secrets REPORT_TOKEN)
NOTION_CLIENT_ID = "3e9d872b-594c-8104-bce6-0037f95cea29"  # public; the secret is a Worker secret
# Connect with LinkedIn (LinkedIn app "Job Pilotto Sign-in", id 264977227; product: Sign In with LinkedIn using OpenID Connect). Public id; the secret is a
# Worker secret: security find-generic-password -a job-pilotto -s job-pilotto.linkedin.client_secret -w | npx wrangler@4 secret put LINKEDIN_CLIENT_SECRET
# Redirect URLs registered in the LinkedIn app: https://www.jobpilotto.top/api/linkedin/callback and the workers.dev one.
LINKEDIN_CLIENT_ID = "77cda0c4oymws4"

# INDEX_GATE: removed on 2 Oct 2026, so the token is enforced. During the rollout, INDEX_GATE = "soft" let installs without an index token keep
# downloading (counted as index-open on /telemetry); set it back to "soft" only to re-open the list temporarily.
# The central employer index (src/employers.js): GET /api/index for every app, PUT from the private central scout
# (GarryOne/job-pilotto-internal) with the Worker secret INDEX_PUBLISH_KEY (Keychain job-pilotto.site.index_publish_key). Stored in WAITLIST as "index:employers".

# Website stats (src/stats.js): page views, Download clicks, the private /stats page. Tables: migrations/ (apply: npx wrangler@4 d1 migrations apply www-stats --remote).
# Secrets: STATS_KEY (opens /stats; Keychain job-pilotto.site.stats_key) and STATS_SALT (hashes visitors).
# "Report this form" (docs/superpowers/specs/2026-10-15-report-this-form.md §4): the private bucket for encrypted reports (created 15 Oct 2026, 30-day expiry rule `expire-30d`).
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "form-reports"

# The Lab's fill videos (src/lab-video.js): one per pool row from CI's run, 14 days (the code drops older ones on each upload), owner-only. The deploy (site.yml) creates the bucket when missing.
[[r2_buckets]]
binding = "LAB_FILLS"
bucket_name = "lab-fills"

# Hosted Always on (src/hosted-state.js, hosted-tick.js): the person's encrypted state, and the Queue the cron tick fills; the runner Worker (hosted-runner/) consumes it and starts the container.
# Secret: HOSTED_KEK (Worker secret; the key of every account's state is derived from it). Created 16 Oct 2026: bucket hosted-state, queue hosted-runs.
[[r2_buckets]]
binding = "HOSTED_STATE"
bucket_name = "hosted-state"

[[queues.producers]]
binding = "HOSTED_QUEUE"
queue = "hosted-runs"

# Ready to send (src/ready-tick.js, ready-morning.js; spec docs/superpowers/specs/2026-10-17-ready-to-send.md): the Queue the cron tick fills, and the service binding to the runner Worker (ready-runner/) that consumes it and holds
# the night's container. Merge this only after the Queue `ready-runs` and the Worker `www-ready-runner` exist on the account (the owner's yes, 17 Oct 2026); everything stays off until READY_TO_SEND = "on" and READY_OWNER is set.
[[queues.producers]]
binding = "READY_QUEUE"
queue = "ready-runs"

[[services]]
binding = "READY_RUNNER"
service = "www-ready-runner"

[[d1_databases]]
binding = "STATS"
database_name = "www-stats"
database_id = "61f8d0f7-82c2-4afe-a6e5-508aaaf2cfa0"
migrations_dir = "migrations"

# Daily at 05:30 UTC: app reports (src/telemetry.js) older than 90 days are dropped, and the top problems of the last
# day are queued (D1 triage_queue) for the private repo's triage to pull (one issue per problem).
[triggers]
crons = ["30 5 * * *", "*/5 * * * *"]   # daily, and every 5 minutes for the Sentry alerts (src/sentry-alert.js). The learning judges also run when fill data arrives (src/index.js judgeSoon): the account has no cron triggers left

# Workers Logs (11 Oct 2026: the D1 limit was hit and nothing recorded who called what): one invocation log per request, every request (about 5k a day).
# Kept here so a deploy never switches them off; src/index.js adds one JSON line per D1-touching request with its rows (src/d1-meter.js).
[observability]
enabled = true
head_sampling_rate = 1
