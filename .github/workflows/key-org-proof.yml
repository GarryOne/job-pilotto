name: Proof · Which org the e2e AI keys belong to
# A $0 check (owner, 18 Oct 2026): the e2e strategy suite failed with "credit balance too low" (Anthropic) and "insufficient_quota" (OpenAI) while both consoles
# showed credit, so the question is which org each CI secret really belongs to. Calls only the free model-list endpoints; prints the status and the organization
# header, never a key. Runs on a PR that edits this file, or by hand once it is on main.
on:
  pull_request:
    paths:
      - '.github/workflows/key-org-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Org of each e2e key
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
      E2E_OPENAI_KEY: ${{ secrets.E2E_OPENAI_KEY }}
    steps:
      - name: Anthropic key (models list and token count, both free)
        run: |
          if [ -z "$E2E_ANTHROPIC_KEY" ]; then echo "E2E_ANTHROPIC_KEY is not set"; exit 0; fi
          code=$(curl -sS -m 30 -D /tmp/a.h -o /tmp/a.b -w '%{http_code}' https://api.anthropic.com/v1/models \
            -H "x-api-key: $E2E_ANTHROPIC_KEY" -H 'anthropic-version: 2023-06-01')
          echo "models: HTTP $code"
          grep -iE '^(anthropic-organization-id|anthropic-workspace-id|request-id):' /tmp/a.h || echo "(no organization header)"
          code=$(curl -sS -m 30 -D /tmp/c.h -o /tmp/c.b -w '%{http_code}' https://api.anthropic.com/v1/messages/count_tokens \
            -H "x-api-key: $E2E_ANTHROPIC_KEY" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' \
            -d '{"model":"claude-haiku-5-5","messages":[{"role":"user","content":"hi"}]}')
          echo "count_tokens: HTTP $code"
          python3 -c "import json;e=json.load(open('/tmp/c.b')).get('error',{});print(e.get('type'),'|',e.get('message'))" 2>/dev/null || true
      - name: OpenAI key (models list, free)
        run: |
          if [ -z "$E2E_OPENAI_KEY" ]; then echo "E2E_OPENAI_KEY is not set"; exit 0; fi
          code=$(curl -sS -m 30 -D /tmp/o.h -o /tmp/o.b -w '%{http_code}' https://api.openai.com/v1/models -H "Authorization: Bearer $E2E_OPENAI_KEY")
          echo "models: HTTP $code"
          grep -iE '^(openai-organization|openai-project|x-request-id):' /tmp/o.h || echo "(no organization header)"
