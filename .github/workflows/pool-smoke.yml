# The applying pool's smoke on a GitHub runner, started BY HAND (owner, 12 Oct 2026: this changes the 11 Oct rule "the pool runs locally only, never in CI";
# start simple, grow it over time, report to the coordinator before growing it), or called by pool-proof.yml for ONE row a PR names (its live proof, v2).
# Never a schedule or push trigger (e2e/test/pool-ci-triggers.test.mjs).
# - Rows: the pool list in the repo (desktop/e2e/smoke-sites.json: every row since 12 Oct 2026; postings are public pages, the owner's details never enter a run).
# - Floors unchanged: the fake applicant, HELD (never Submit, no account or consent button, no password, no captcha), the privacy tripwire on, nothing uploaded
#   (lib/applying-report.mjs refuses CI) but the two CI records below, with the narrow REPLAYS_PUBLISH_KEY: "proven live", and the ladder moves the rows' pages
#   confirmed (desktop/e2e/pool-moves.mjs: fixed values per page shape, marked source 'ci' so they never pose as a user's; spec 2026-10-12-one-next-move.md).
# - AI: the app's own API engine on the Tests key (E2E_ANTHROPIC_KEY, the Tests workspace's $20 limit), through the harness's metering proxy (lib/live-row.mjs).
#   Hard caps per run, here: MAX_ROWS rows and MAX_USD dollars (the run stops between rows once its spend reaches it). Its own key, so its cost shows apart:
#   LIVE_POOL_ANTHROPIC_KEY by hand, PR_PROOF_ANTHROPIC_KEY on a PR (lib/engine.mjs liveKeyName), else the Tests key; the summary names the one used. Every run reports its spend to /admin/ai-cost (pool-live, or pr-live-proof on a PR).
# - Site limit: CI's own ledger per UTC day, at most 2 visits per host across ALL CI runs (main and every PR), a host that showed a block page rests the day;
#   a by-hand run may use only 1 of the 2: the last is kept for a PR's live proof (owner, 12 Oct 2026).
#   Each run uploads a small state artifact (its ledger and rows); the next run reads them all (GitHub's cache is per branch: a PR's visits would be unseen).
#   CI visits are NOT in the Mac's ledger: a host can get 3 (Mac) + 2 (CI) visits on a day both run.
# - Data-center IPs meet more bot walls: such a row is "blocked (CI IP)" in the summary, never a failure, never retried (no Electron leg on CI).
# - Each row that REALLY ran sends one "proven live" record (lib/pool-proven.mjs, REPLAYS_PUBLISH_KEY) that /admin/applying's Fixed tab joins to the fix.
#   Red when NO row ran ("NOT RUN: <why>, next visit possible <when>" leads the summary and a PR gets it as a comment: 12 Oct 2026, a 1-minute green ran nothing),
#   for a row that did not finish (a harness error), the tripwire, a refused AI, or a row reaching less than its last CI run on main or on this
#   PR (lib/pool-ci-state.mjs); never for a bot wall, a refusal or a gone posting.
# Result: the job summary table and the artifact (the day report, smoke.log, evidence/<day>/<row>/: end.png, step-*.png, app.log, run.log, evidence.md).
# Captures: every row's journey (scrubbed pages, styles, AI answers, app.log, build) as pool-captures-<run>, 30 days (owner, 13 Oct 2026; spec
# 2026-10-13-capture-once-measure-many.md); `npm run captures -- pull` keeps them on the Mac, `npm run measure` re-runs a build on them with no site visit.
name: CI · Pool smoke (by hand)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Rows: words of a row name, several rows joined by | (empty: the bot-tolerant default list)'
        type: string
        default: ''
      share:
        description: 'How many of those rows this run (at most MAX_ROWS)'
        type: number
        default: 1
  workflow_call:   # pool-proof.yml: one row a PR names, on the PR's own build
    inputs:
      only:
        type: string
        default: ''
      share:
        type: number
        default: 1
      applicant:   # the test applicant (e2e/lib/applicant-seed.mjs): a PR proof runs the grown one; by hand: thin
        type: string
        default: 'thin'

permissions:
  contents: read
  actions: read   # the earlier CI runs' state artifacts (site ledger, last results)
  pull-requests: write   # a PR proof whose row did not run says so on the PR

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # up to 60 to wait its turn (pool-ci-wait.mjs), then the rows
    # No concurrency group: GitHub keeps one pending run per group and cancels the older one (12 Oct 2026: Ocado's dispatch was cancelled by FNAC's).
    # The queue step below waits for every earlier pool run instead: one at a time, oldest first, none dropped.
    env:
      MAX_ROWS: 3          # the hard row cap (owner, 12 Oct 2026: start with 1-3 rows)
      MAX_USD: '0.50'      # the hard AI dollar cap per run
      # Public rows with no bot wall in the Mac's runs of 10-12 Oct 2026 (SmartRecruiters showed one every time: not in the default).
      DEFAULT_ROWS: 'Lever: single page|Personio form in German|Recruitee: one-page form'
      ONLY: ${{ inputs.only }}
      SHARE: ${{ inputs.share }}
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}               # the Tests key: the fallback while a live run's own key is not set
      LIVE_POOL_ANTHROPIC_KEY: ${{ secrets.LIVE_POOL_ANTHROPIC_KEY }}   # a pool run by hand (owner, 12 Oct 2026: each live run's cost apart)
      PR_PROOF_ANTHROPIC_KEY: ${{ secrets.PR_PROOF_ANTHROPIC_KEY }}     # a PR's live proof; lib/engine.mjs liveKeyName picks by JOB_PILOTTO_VISIT_KIND
      JP_NO_REPORT: '1'                # no applying report from CI (the code refuses it anyway); the proven records and ladder moves go with their own narrow key
      JP_APPLICANT: ${{ inputs.applicant || 'thin' }}   # thin by hand, grown on a PR proof unless its body says "live-applicant: thin"
      JOB_PILOTTO_HEAVY: '0'           # the heavy lock is a Mac's machine-wide queue; this runner is its own machine
      JOB_PILOTTO_SESSION: pool-smoke CI run ${{ github.run_id }}
      JOB_PILOTTO_SITE_LIMIT: '2'
      JOB_PILOTTO_VISIT_KIND: ${{ github.event_name == 'pull_request' && 'proof' || 'hand' }}   # each visit says its kind (lib/site-ledger.mjs)
      JOB_PILOTTO_SITE_RESERVE: '1'   # a by-hand run leaves a host's last visit of the day to a PR proof (owner, 12 Oct 2026)
      JP_NET_RECORD_DIR: ${{ github.workspace }}/net-records   # each row's network record (lib/net-record.mjs): uploaded encrypted below, never in the plain captures
      JOB_PILOTTO_SITE_LEDGER_DIR: ${{ github.workspace }}/pool-smoke-out/site-ledger
      SMOKE_PAIRED: '0'
      SMOKE_REPORTS: ${{ github.workspace }}/pool-smoke-out/smoke-reports
      SMOKE_CANDIDATES: ${{ github.workspace }}/pool-smoke-out/replay-candidates
      SMOKE_CAPTURES: ${{ github.workspace }}/pool-smoke-out/captures   # every row's whole journey (lib/capture-library.mjs): npm run measure re-runs a build on it offline
      SMOKE_SITES: ${{ github.workspace }}/pool-smoke-out/no-mac-list.json   # never present: the Mac's own rows stay on the Mac
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Python packages the engine needs (the app's store)
        run: pip install --quiet -r requirements.txt
      - name: Chromium for the real extension, and a virtual display
        working-directory: desktop/e2e
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y -qq xvfb >/dev/null
      - name: Wait for the earlier pool runs (one at a time, oldest first, none dropped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/e2e/pool-ci-wait.mjs
      - name: Earlier CI runs (main and every PR) -> today's site ledger, each row's last CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pool-smoke-out/states pool-smoke-out/site-ledger
          since=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for workflow in pool-smoke.yml pool-proof.yml; do
            gh run list --workflow "$workflow" --limit 40 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$since\") | .databaseId" || true
          done | sort -rn | uniq | grep -vx "$GITHUB_RUN_ID" | head -40 | while read -r id; do
            gh run download "$id" --name "pool-smoke-state-$id" --dir "pool-smoke-out/states/$id" >/dev/null 2>&1 || true
          done
          node desktop/e2e/pool-ci-state.mjs prepare pool-smoke-out/states pool-smoke-out/baseline.json
      - name: Run the pool rows (held, fake applicant, never Submit)
        working-directory: desktop/e2e
        run: |
          set -o pipefail
          mkdir -p "$SMOKE_REPORTS"
          rows=${SHARE:-1}
          if ! [ "$rows" -ge 1 ] 2>/dev/null; then rows=1; fi
          if [ "$rows" -gt "$MAX_ROWS" ]; then rows=$MAX_ROWS; fi
          only=${ONLY:-$DEFAULT_ROWS}
          echo "pool-smoke: rows matching \"$only\", at most $rows, AI cap \$$MAX_USD; CI's site limit $JOB_PILOTTO_SITE_LIMIT a host a day"
          SMOKE_MAX_ROWS=$rows SMOKE_MAX_USD=$MAX_USD xvfb-run -a --server-args='-screen 0 1440x900x24' node smoke.mjs --only "$only" 2>&1 | tee "$GITHUB_WORKSPACE/pool-smoke-out/smoke.log"
      - name: Encrypt the network records (the public key is in the repo; the private key only in the owner's Keychain)
        if: always()
        run: |
          [ -d net-records ] && [ -n "$(ls -A net-records)" ] || { echo "no network record"; exit 0; }
          mkdir -p net-out && tar czf "$RUNNER_TEMP/net.tgz" net-records && rm -rf net-records
          openssl rand -out "$RUNNER_TEMP/k" 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/net.tgz" -out net-out/net.tgz.enc -pass "file:$RUNNER_TEMP/k"
          openssl pkeyutl -encrypt -pubin -inkey desktop/e2e/net-record.pub.pem -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k" -out net-out/k.enc
          rm -f "$RUNNER_TEMP/k" "$RUNNER_TEMP/net.tgz"
      - name: The encrypted network records (14 days)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: net-records-${{ github.run_id }}
          path: net-out/
          retention-days: 14
          if-no-files-found: ignore
      - name: Hand this run's state to the next runs (its ledger and rows)
        if: always()
        run: node desktop/e2e/pool-ci-state.mjs save "$SMOKE_REPORTS" pool-smoke-out/state/state.json
      - name: This run's state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pool-smoke-state-${{ github.run_id }}
          path: pool-smoke-out/state/state.json
          retention-days: 14
          if-no-files-found: warn
      - name: Job summary (red when no row ran, a row did not finish, the tripwire, a refused AI, a fall below its last CI run)
        if: always()
        working-directory: desktop/e2e
        env:
          NOT_RUN_FILE: ${{ runner.temp }}/not-run.txt   # a run where no row ran: its NOT RUN line (lib/pool-ci.mjs), never a green pass
        run: |
          set -o pipefail
          node pool-ci-summary.mjs "$SMOKE_REPORTS" "$GITHUB_WORKSPACE/pool-smoke-out/baseline.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Send a "proven live" record for each row that really ran (the Fixed tab), and the ladder moves the rows' pages confirmed (source ci)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}   # the narrow key: it writes only the replays, these records, test-source ladder moves and the rows' endings
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[].commit.message | split("\n")[0] | @json' > "$RUNNER_TEMP/subjects" || true
          fi
          node desktop/e2e/pool-proven.mjs "$SMOKE_REPORTS" "$RUNNER_TEMP/subjects"
          node desktop/e2e/pool-moves.mjs "$SMOKE_REPORTS" | tee -a "$GITHUB_STEP_SUMMARY"   # the moves per row: the one-next-move spec's phase-1 proof
          node desktop/e2e/pool-endings.mjs "$SMOKE_REPORTS"   # each row's ending: main's feed /admin/applying's Resolution tile (phase 1a)
      - name: Report the run's AI spend to /admin/ai-cost (never fails the job)
        if: always()
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          AI_COST_JOB: ${{ github.event_name == 'pull_request' && 'pr-live-proof' || 'pool-live' }}
        run: node desktop/e2e/pool-ai-cost.mjs "$SMOKE_REPORTS" "$RUNNER_TEMP/pool-ai-cost.json" && node desktop/e2e/ai-cost-report.mjs --job "$AI_COST_JOB" --file "$RUNNER_TEMP/pool-ai-cost.json" || true
      - name: Tell the PR when its row did not run (when to run it again)
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NOT_RUN_FILE: ${{ runner.temp }}/not-run.txt
        run: |
          [ -s "$NOT_RUN_FILE" ] || exit 0
          # shellcheck disable=SC2016  # the backticks are Markdown code in the comment, not a shell expansion
          printf '%s\n\nRun it again when the visit is possible: `gh run rerun %s`, or remove and add the `live-proof` label. Run: %s\n' "$(cat "$NOT_RUN_FILE")" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/not-run-comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/not-run-comment.md" || echo "pool-smoke: could not comment on the PR"
      - name: Every row's capture (capture once, measure many)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pool-captures-${{ github.run_id }}
          path: pool-smoke-out/captures/
          retention-days: 30
          if-no-files-found: ignore
      - name: The day report, the log and each row's evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pool-smoke-${{ github.run_id }}
          path: |
            pool-smoke-out/smoke.log
            pool-smoke-out/smoke-reports/
          retention-days: 14
          if-no-files-found: warn
