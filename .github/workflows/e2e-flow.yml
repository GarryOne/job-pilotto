name: CI · Flow e2e (apply + applycv, optional)
# A pull request that can break the applying flow runs the two suites that apply on fixture forms with the real extension (owner, 13 Oct 2026: optional now; required once it
# has proven itself on the SQLite store). The pick decides (tools/affected-jobs.py e2e-flow: the extension, the flow files, the suites' own files), then e2e.yml runs the suites
# in this PR's own group: a newer push cancels only this PR's older run, never the release gate's or the schedule's (their groups are e2e-<suite>). Fake applicant data only.
on:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-flow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  pick:
    name: flow e2e needed?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.needed.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # the merge commit and the main it merges into: what this pull request changes
      - id: needed
        name: Can this change break the apply suites?
        run: bash tools/ci-needed.sh e2e-flow

  e2e:
    name: flow e2e
    needs: pick
    if: needs.pick.outputs.run == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      gate_tag: ''
      release_run: true   # no "Windows follows" dispatch and no promotion from a pull request
      pr_suites: apply,applycv
    secrets: inherit
