name: CI · End-to-end on Windows

# The Mac is the product's main platform (e2e.yml); Windows users get the same app, and a Windows-only break (paths, quoting, the installer's
# environment) was invisible there. One job per suite, like e2e.yml. By hand: the `suites` input (empty = all), `fixed: true` = the fixed path (E2E_SEED=0).
# 4 Oct 2026, parity with the Mac: the Mac run (e2e.yml, job "Windows follows") starts this one when it tested something, with its commit, the same
# suites and the same AI review (plan-windows.mjs). A commit Windows already tested is not run again. On a release gate's build it is the Windows beta gate (approve-windows).
run-name: ${{ inputs.sha && format('Windows {0}', inputs.sha) || 'CI · End-to-end on Windows' }}
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suites to run on Windows, comma-separated (empty = all)'
        required: false
      fixed:
        description: 'The fixed path (E2E_SEED=0, as the release gate) instead of a seeded one'
        type: boolean
        default: false
      mac_run:
        description: 'Set by e2e.yml: the Mac run to follow (its suites)'
        required: false
      sha:
        description: 'Set by e2e.yml: the commit to test'
        required: false
      review:
        description: 'Set by e2e.yml: 1 = the AI screenshot review, as on the Mac run'
        required: false
      full:
        description: 'Set by e2e.yml: 1 = the paid AI judge steps, as on the Mac run'
        required: false
      tag:
        description: 'Set by e2e.yml on a release gate: the build to approve for Windows beta testers when every Windows suite passes'
        required: false

permissions:
  contents: read

# One Windows run at a time, whole: two Mac runs close together started two Windows runs whose jobs cancelled each other in the shared
# per-suite groups (runs 37170683571 and 37171347525, 4 Oct 2026). A newer waiting run replaces an older waiting one: Windows tests the latest.
concurrency:
  group: e2e-windows
  cancel-in-progress: false


jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
      review: ${{ steps.pick.outputs.review }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: What to run (the Mac run's suites and AI review, or the ones named by hand)
        id: pick
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ONLY: ${{ inputs.suites }}
          MAC_RUN: ${{ inputs.mac_run }}
          SHA: ${{ inputs.sha }}
          REVIEW: ${{ inputs.review }}
        run: node plan-windows.mjs 2>> "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"

  suite:
    name: ${{ matrix.suite }} (Windows)
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash   # the suites' commands use bash syntax; pwsh would mangle quoting
    concurrency:
      # The suite owns one Notion page: never together with the same suite on the Mac (e2e.yml uses the same group). A NEW pending job cancels an
      # older pending one in the group, so start a by-hand Windows run only when no e2e.yml job of that suite is still queued.
      group: e2e-${{ matrix.suite }}
      cancel-in-progress: false
    env:
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
      E2E_NOTION_TOKEN: ${{ secrets.E2E_NOTION_TOKEN }}
      E2E_NOTION_TOKEN_JOBS: ${{ secrets.E2E_NOTION_TOKEN_JOBS }}
      E2E_NOTION_TOKEN_INTERVIEWS: ${{ secrets.E2E_NOTION_TOKEN_INTERVIEWS }}
      E2E_NOTION_TOKEN_SETTINGS: ${{ secrets.E2E_NOTION_TOKEN_SETTINGS }}
      E2E_NOTION_TOKEN_PERSONAS: ${{ secrets.E2E_NOTION_TOKEN_PERSONAS }}
      E2E_NOTION_TOKEN_EMPLOYERS: ${{ secrets.E2E_NOTION_TOKEN_EMPLOYERS }}
      E2E_NOTION_TOKEN_CALENDAR: ${{ secrets.E2E_NOTION_TOKEN_CALENDAR }}
      E2E_NOTION_TOKEN_FOCUS: ${{ secrets.E2E_NOTION_TOKEN_FOCUS }}
      E2E_NOTION_TOKEN_FOCUSDISMISS: ${{ secrets.E2E_NOTION_TOKEN_FOCUSDISMISS }}
      E2E_NOTION_TOKEN_APPLY: ${{ secrets.E2E_NOTION_TOKEN_APPLY }}
      E2E_NOTION_TOKEN_APPLYCV: ${{ secrets.E2E_NOTION_TOKEN_APPLYCV }}
      E2E_NOTION_TOKEN_ACTIVITY: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITY }}
      E2E_NOTION_TOKEN_ACTIVITYFAILURES: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITYFAILURES }}
      E2E_NOTION_TOKEN_STRATEGY: ${{ secrets.E2E_NOTION_TOKEN_STRATEGY }}
      E2E_NOTION_TOKEN_QUALITY: ${{ secrets.E2E_NOTION_TOKEN_QUALITY }}
      E2E_NOTION_TOKEN_INTERACTIONS: ${{ secrets.E2E_NOTION_TOKEN_INTERACTIONS }}
      E2E_NOTION_TOKEN_WANDER: ${{ secrets.E2E_NOTION_TOKEN_WANDER }}
      E2E_FULL: ${{ inputs.full }}   # the paid AI judge steps, as on the Mac run it follows (a nightly gate or a run by hand)
      E2E_SEED: ${{ inputs.fixed && '0' || inputs.mac_run || github.run_id }}   # after a Mac run: the Mac's own seed, the same path on both   # printed and saved in seed.json: E2E_SEED=<n> node suite.mjs <suite> replays it
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts-windows/${{ matrix.suite }}
      E2E_BLOB_DIR: ${{ github.workspace }}/blob-report   # the suite's part of the run's HTML report (the report job merges them)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}   # the commit the Mac run tested
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record which commit this run tested (ui-findings.yml names it in every issue)
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          printf '%s %s\n' "${{ github.ref_name }}" "$(git rev-parse HEAD)" > "$E2E_ARTIFACTS/tested.txt"
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Chromium for the extension (the apply suite loads the real Chrome extension in it)
        if: matrix.suite == 'apply' || matrix.suite == 'applycv'
        working-directory: desktop/e2e
        run: npx playwright-core install chromium
      - name: Python packages the engine needs
        run: pip install --quiet -r requirements.txt
      - name: Run the ${{ matrix.suite }} suite on Windows
        working-directory: desktop/e2e
        timeout-minutes: 12   # the suite stops itself at its 7-minute budget, and by force 3 min later (suite.mjs)
        run: |
          if [ ! -f "suites/${{ matrix.suite }}.mjs" ]; then echo "The ${{ matrix.suite }} suite does not exist in this build: skipped." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node suite.mjs ${{ matrix.suite }}
      - name: The apply suite again in Microsoft Edge (the Windows default; preinstalled on the runner)
        if: matrix.suite == 'apply'
        working-directory: desktop/e2e
        timeout-minutes: 30
        env:
          E2E_BROWSER: msedge
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts-windows/apply-edge   # its own folder: the Chromium run's evidence stays
        run: node suite.mjs apply
      - name: Earlier AI reviews (an unchanged screenshot is not asked again)
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.plan.outputs.review == '1'
        uses: actions/cache/restore@v5
        with:
          path: desktop/e2e/.review-cache
          key: ai-review-windows-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-review-windows-${{ matrix.suite }}-
      - name: AI review of the screenshots
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.plan.outputs.review == '1'   # only when the Mac run had it (the UI or its tests changed, or a finding waits)
        working-directory: desktop/e2e
        timeout-minutes: 15   # the batch waits up to 6 min, then asks what is left directly
        run: node review-ui.mjs
      - name: Keep the AI reviews for the next run
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.plan.outputs.review == '1' && hashFiles('desktop/e2e/.review-cache/*.json') != ''
        uses: actions/cache/save@v5
        with:
          path: desktop/e2e/.review-cache
          key: ai-review-windows-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: The suite's part of the HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-windows-${{ matrix.suite }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 3
      # For the owner's /admin/e2e page (site/src/e2e.js): the steps and a failed suite's trace, uncompressed so the site reads them without unzipping.
      - name: Steps and trace for /admin/e2e
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-view-windows-${{ matrix.suite }}
          path: |
            e2e-artifacts-windows/${{ matrix.suite }}/steps.json
            e2e-artifacts-windows/${{ matrix.suite }}/trace-*.zip
          compression-level: 0
          if-no-files-found: ignore
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-windows-${{ matrix.suite }}
          path: e2e-artifacts-windows/${{ matrix.suite }}
          if-no-files-found: ignore

  # One Playwright HTML report for the run (6 Oct 2026): every suite wrote a blob (desktop/e2e/report/playwright.config.mjs); merged here, uploaded as e2e-report
  # (uncompressed: the owner's site serves its files straight from the artifact, site/src/e2e.js) and linked on the run's Summary page.
  report:
    name: Windows HTML report
    needs: [plan, suite]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: desktop/e2e
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          pattern: blob-*
          path: blob-reports
          merge-multiple: true
      - name: Merge the suites into one HTML report
        id: merge
        working-directory: desktop/e2e
        run: |
          if ! ls "$GITHUB_WORKSPACE"/blob-reports/*.zip > /dev/null 2>&1; then echo "No suite wrote a report (a build older than the HTML report): none for this run." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          npm ci || npm install
          PLAYWRIGHT_HTML_OUTPUT_DIR="$GITHUB_WORKSPACE/e2e-report" PLAYWRIGHT_HTML_OPEN=never npx playwright merge-reports --reporter html "$GITHUB_WORKSPACE/blob-reports"
          echo "made=1" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: steps.merge.outputs.made == '1'
        with:
          name: e2e-report
          path: e2e-report
          compression-level: 0
      - name: The link on the run's Summary page
        if: steps.merge.outputs.made == '1'
        run: echo "## 📊 [Open the HTML report](https://www.jobpilotto.workers.dev/admin/e2e/run/${{ github.run_id }}/report) · every suite, its steps with a screenshot each, the failure and its trace (admins)" >> "$GITHUB_STEP_SUMMARY"

  # Windows beta approval (owner, 6 Oct 2026): every Windows suite green on a release gate's build, no real high-severity finding and the shared release checks
  # (tools/release-checks.sh) add "Beta-approved (Windows):" to that release. Each platform is approved on its own (desktop/lib/updater.js approvedFor): one
  # release, one version; Windows never waits for the Mac/Linux suites, nor Mac for Windows.
  approve-windows:
    needs: [plan, suite]
    if: success() && inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # gh release edit
      actions: read     # this run's artifacts, build.yml's verdict on the commit
      issues: write     # the release scripts file an issue when something blocks a release (tests/test_release_permissions.py); block-check.mjs reads the UI-loop issues
    concurrency:
      group: release-promote   # one writer of a release's notes at a time: the Mac/Linux promote edits the same body
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      REF: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: No real high-severity finding in this Windows run (the same rule as the Mac/Linux promote)
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-artifacts-windows-*' --dir ../../e2e-artifacts || echo "no artifacts to read"
          mkdir -p ../../e2e-artifacts
          status=0
          node block-check.mjs --artifacts ../../e2e-artifacts > block.txt || status=$?
          cat block.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then echo "$TAG is not offered on Windows: a real high-severity finding in its Windows run." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - name: The shared release checks (unit suites green on the commit; soak on, the Notion schema additive over stable)
        env:
          JOB_PILOTTO_SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        run: tools/release-checks.sh "$TAG" "$REF" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Approve the build for Windows beta testers
        run: tools/beta-approve.sh --windows "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
