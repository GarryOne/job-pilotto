      - name: Earlier AI reviews (an unchanged screenshot is not asked again)
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.changes.outputs.review == '1'
        uses: actions/cache/restore@v5
        with:
          path: desktop/e2e/.review-cache
          key: ai-review-windows-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-review-windows-${{ matrix.suite }}-
      - name: AI review of the screenshots
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.changes.outputs.review == '1'   # only when the Mac run had it (the UI or its tests changed, or a finding waits)
        working-directory: desktop/e2e
        timeout-minutes: 15   # the batch waits up to 6 min, then asks what is left directly
        run: node review-ui.mjs
      # Its cost on /ai-cost, as the Mac lane reports it (7 Oct 2026: the Windows review, Sonnet with screenshots, was the one e2e AI cost never reported).
      - name: Report the AI review's cost to /ai-cost
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.changes.outputs.review == '1' && hashFiles('e2e-artifacts-windows/**/ai-review-usage.json') != ''
        continue-on-error: true   # a report never decides a run
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: |
          node -e 'const fs=require("fs"); const u=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); fs.writeFileSync(process.argv[2], JSON.stringify({job: "review", usd: Number(u.usd)||0, turns: Number(u.calls)||0, at: new Date().toISOString(), limit: false}))' "$E2E_ARTIFACTS/ai-review-usage.json" "$RUNNER_TEMP/ai-cost.json"
          node desktop/e2e/ai-cost-report.mjs --job e2e-screenshot-review --suffix "windows-${{ matrix.suite }}" --file "$RUNNER_TEMP/ai-cost.json"
      - name: Keep the AI reviews for the next run
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.changes.outputs.review == '1' && hashFiles('desktop/e2e/.review-cache/*.json') != ''
        uses: actions/cache/save@v5
        with:
          path: desktop/e2e/.review-cache
          key: ai-review-windows-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: The suite's part of the HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-windows-${{ matrix.suite }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 3
      # For the owner's /admin/e2e page (site/src/e2e.js): the steps and a failed suite's trace, uncompressed so the site reads them without unzipping.
      - name: Steps and trace for /admin/e2e
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-view-windows-${{ matrix.suite }}
          path: |
            e2e-artifacts-windows/${{ matrix.suite }}/steps.json
            e2e-artifacts-windows/${{ matrix.suite }}/trace-*.zip
          compression-level: 0
          if-no-files-found: ignore
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-windows-${{ matrix.suite }}
          path: e2e-artifacts-windows/${{ matrix.suite }}
          if-no-files-found: ignore

  # RELEASE: the lane's HTML report (always), then, only when every E2E suite of the lane passed: no real high-severity finding, the shared release checks, and the
  # "Beta-approved:" line that offers the build to Mac beta testers (desktop/lib/updater.js). Red = not released on Mac.
  # GATE STAGE, Windows packaging (owner, 10 Oct 2026): the slow checks of the installed app that the e2e cannot see because it runs from source (the transcription add-on's
  # pip install and PyAV, the installer updating the app over itself, the in-app terminal). Only when e2e follows; a "Build only" run never pays for them.
  packaging-windows:
    name: Packaging · Windows
    needs: [changes, windows]
    if: needs.windows.result == 'success' && needs.changes.outputs.gate == 'true' && needs.changes.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          name: windows-build
          path: desktop/dist
      - name: Packaging checks on the installed app (add-on, PyAV, update in place, in-app terminal)
        working-directory: desktop
        run: node scripts/windows-smoke.mjs "dist/Job-Pilotto-${VERSION}-x64.exe" smoke-packaging packaging

  release-mac:
    name: Release · Mac beta
    needs: [changes, test-mac]
    if: always() && needs.changes.outputs.gate == 'true' && needs.test-mac.result != 'skipped' && needs.test-mac.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # the approval line (release-stable.sh when the soak is off)
      actions: read     # this run's artifacts, build.yml's verdict on the commit
      issues: write     # block-check.mjs reads the UI-loop issues; the release scripts rewrite the pinned Release channels issue
    concurrency:
      group: release-promote   # one writer of a release's notes at a time: both lanes edit the same body
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: desktop-v${{ needs.changes.outputs.version }}
      REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The E2E suites' HTML report (also when one failed)
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'blob-*' --dir blob-reports || true
          mkdir -p blob-reports flat
          find blob-reports -mindepth 1 -maxdepth 1 -name 'blob-windows-*' -exec rm -rf {} +
          find blob-reports -name '*.zip' -exec cp {} flat/ \;
          if ls flat/*.zip >/dev/null 2>&1; then
            PLAYWRIGHT_HTML_OUTPUT_DIR="$GITHUB_WORKSPACE/e2e-report" PLAYWRIGHT_HTML_OPEN=never npx playwright merge-reports -c report/merge.config.mjs --reporter html flat
            echo "## 📊 [Open the Mac HTML report](https://www.jobpilotto.workers.dev/admin/e2e/run/${{ github.run_id }}/report) · every suite, its steps with a screenshot each, the failure and its trace (admins)" >> "$GITHUB_STEP_SUMMARY"
          else echo "No suite wrote a report." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v6
        if: hashFiles('e2e-report/index.html') != ''
        with:
          name: e2e-report   # site/src/e2e.js serves it
          path: e2e-report
          compression-level: 0
      - name: Not released on Mac, an E2E suite failed
        if: needs.test-mac.result != 'success'
        run: |
          echo "### ❌ $TAG is not offered to Mac beta testers: an E2E suite failed (see the report above)." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: No real high-severity finding in the Mac suites
        working-directory: desktop/e2e
        run: |
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-artifacts-*' --dir ../../e2e-artifacts || echo "no artifacts to read"
          mkdir -p ../../e2e-artifacts
          find ../../e2e-artifacts -mindepth 1 -maxdepth 1 -name 'e2e-artifacts-windows-*' -exec rm -rf {} +
          status=0
          node block-check.mjs --artifacts ../../e2e-artifacts > block.txt || status=$?
          cat block.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then echo "$TAG is not offered on Mac: a real high-severity finding in its end-to-end suites." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - name: The shared release checks (unit suites green on the commit; soak on, the Notion schema additive over stable)
        env:
          JOB_PILOTTO_SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        run: tools/release-checks.sh "$TAG" "$REF" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release it to Mac beta testers
        env:
          E2E_ALREADY_GREEN: '1'   # every Mac suite passed on this commit, in this run
          SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        run: |
          if [ "$SOAK" = on ]; then
            tools/beta-approve.sh "$TAG"
            echo "Beta-approved: $TAG (unit suites and every end-to-end suite passed on its commit). It becomes stable through canary-promote.yml: more end-to-end runs, no blocking finding, then healthy beta use." >> "$GITHUB_STEP_SUMMARY"
          else
            tools/release-stable.sh "$TAG"
            echo "Stable: $TAG (every suite passed on its commit)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # RELEASE: the lane's HTML report (always), then, only when every E2E suite of the lane passed: no real high-severity finding, the shared release checks, and the
  # "Beta-approved (Windows):" line that offers the build to Windows beta testers (desktop/lib/updater.js). Red = not released on Windows.
  release-windows:
    name: Release · Windows beta
    needs: [changes, test-windows, packaging-windows]
    if: always() && needs.changes.outputs.gate == 'true' && needs.test-windows.result != 'skipped' && needs.test-windows.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # the approval line (release-stable.sh when the soak is off)
      actions: read     # this run's artifacts, build.yml's verdict on the commit
      issues: write     # block-check.mjs reads the UI-loop issues; the release scripts rewrite the pinned Release channels issue
    concurrency:
      group: release-promote   # one writer of a release's notes at a time: both lanes edit the same body
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: desktop-v${{ needs.changes.outputs.version }}
      REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The E2E suites' HTML report (also when one failed)
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'blob-*' --dir blob-reports || true
          mkdir -p blob-reports flat
          find blob-reports -mindepth 1 -maxdepth 1 -name 'blob-*' ! -name 'blob-windows-*' -exec rm -rf {} +
          find blob-reports -name '*.zip' -exec cp {} flat/ \;
          if ls flat/*.zip >/dev/null 2>&1; then
            PLAYWRIGHT_HTML_OUTPUT_DIR="$GITHUB_WORKSPACE/e2e-report" PLAYWRIGHT_HTML_OPEN=never npx playwright merge-reports -c report/merge.config.mjs --reporter html flat
            echo "## 📊 [Open the Windows HTML report](https://www.jobpilotto.workers.dev/admin/e2e/run/${{ github.run_id }}/report?os=windows) · every suite, its steps with a screenshot each, the failure and its trace (admins)" >> "$GITHUB_STEP_SUMMARY"
          else echo "No suite wrote a report." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v6
        if: hashFiles('e2e-report/index.html') != ''
        with:
          name: e2e-report-windows   # site/src/e2e.js serves it
          path: e2e-report
          compression-level: 0
      - name: Not released on Windows, an E2E suite failed
        if: needs.test-windows.result != 'success'
        run: |
          echo "### ❌ $TAG is not offered to Windows beta testers: an E2E suite failed (see the report above)." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Not released on Windows, a packaging check failed
        if: needs.packaging-windows.result != 'success'
        run: |
          echo "### ❌ $TAG is not offered to Windows beta testers: Packaging · Windows (add-on, update in place, in-app terminal) did not pass." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: No real high-severity finding in the Windows suites
        working-directory: desktop/e2e
        run: |
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-artifacts-*' --dir ../../e2e-artifacts || echo "no artifacts to read"
          mkdir -p ../../e2e-artifacts
          find ../../e2e-artifacts -mindepth 1 -maxdepth 1 -name 'e2e-artifacts-*' ! -name 'e2e-artifacts-windows-*' -exec rm -rf {} +
          status=0
          node block-check.mjs --artifacts ../../e2e-artifacts > block.txt || status=$?
          cat block.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then echo "$TAG is not offered on Windows: a real high-severity finding in its end-to-end suites." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - name: The shared release checks (unit suites green on the commit; soak on, the Notion schema additive over stable)
        env:
          JOB_PILOTTO_SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        run: tools/release-checks.sh "$TAG" "$REF" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release it to Windows beta testers
        env:
          E2E_ALREADY_GREEN: '1'   # every Windows suite passed on this commit, in this run
          SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        run: |
          tools/beta-approve.sh --windows "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

  # Keep the release list short: stable releases stay, plus the newest 3 test builds (tools/prune-releases.sh) and each platform's newest beta. After both lanes, so
  # tonight's approvals are already written when it decides what to keep.
  prune:
    name: Clean up old builds
    needs: [changes, build, windows, packaging-windows, test-mac, test-windows, release-mac, release-windows]
    if: always() && needs.changes.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # delete the older test builds, retitle releases
      issues: write     # the pinned Release channels issue
    steps:
      - uses: actions/checkout@v5
      - name: A release neither build published (both failed) is removed; its tag stays and its number is not reused
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v${{ needs.changes.outputs.version }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then gh release delete "$TAG" --yes; echo "::warning::$TAG: no build finished; its draft is removed."; fi
      - name: Remove older test builds (their tags stay)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/prune-releases.sh 3
      - name: Release titles and the pinned Release channels issue (a new build is listed at once, not at the next soak run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync_release_labels.py || echo "labels not refreshed"   # best effort, never fails a build
