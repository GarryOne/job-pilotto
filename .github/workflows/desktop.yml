name: Release · Desktop app

# Builds the Mac app (Apple Silicon .dmg + .zip, bundled Python and pipeline) and publishes it as a
# GitHub Release: nightly at 04:00 Zurich (only when something that goes into the app changed on main since the last release) or on
# demand (gh workflow run desktop.yml, always builds). The release starts as a
# draft; the Windows job adds the x64 installer (.exe, unsigned: SmartScreen asks "Run anyway") and then
# publishes it as a pre-release (a build: offered to nobody until the gate approves it for beta). Friends' apps and the website follow the latest *stable* release: one
# promoted with tools/release-stable.sh (then its .exe and .dmg are what "latest" serves).
on:
  # Nightly, and by hand (gh workflow run desktop.yml). Not on every push: with several pushes an hour, a release per push
  # was mostly noise and a macOS + Windows build each (2 Oct 2026). A night with nothing new for the app builds nothing.
  schedule:
    # 04:00 in Zurich all year: cron is UTC and Zurich is UTC+2 in summer, UTC+1 in winter, so both hours are scheduled and the step below lets only the one that falls
    # at 04:xx or 05:xx Zurich time go on (GitHub starts scheduled runs late, sometimes by an hour or more). If both pass, the second finds nothing new to build.
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write      # create the release
  id-token: write      # build provenance: GitHub signs "this file was built from this commit by this workflow"
  attestations: write  # (verify: gh attestation verify <file> -R GarryOne/job-pilotto)
  actions: write       # start a fresh build of main when this one can't be released (see Release)

# A release runs to the end (Mac, then the Windows installer), so the latest release always has both
# downloads the website links to; a newer run waits, and only the newest waiting one runs.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # Nightly runs only: did anything that goes into the app change since the newest release? (A manual run always builds.)
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Anything new for the app?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(TZ=Europe/Zurich date +%H)
          if [ "$hour" != 04 ] && [ "$hour" != 05 ]; then echo "It is $hour:xx in Zurich: not this schedule's turn (04:00 Zurich is the other one)."; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          tag=$(gh release list -L 1 --exclude-drafts --json tagName -q '.[0].tagName' || true)
          sha=$([ -n "$tag" ] && git rev-list -n 1 "$tag" 2>/dev/null || true)
          # The tests of the app (desktop/test, desktop/e2e) are not in the app: a night when only they changed builds nothing.
          paths=(desktop src config templates tools extension worker/src requirements.txt requirements-transcribe.txt
                 docs/notion-profile-template.md docs/job-pilotto-guide.md .github/workflows/desktop.yml ':!desktop/e2e' ':!desktop/test')
          if [ -n "$sha" ] && git diff --quiet "$sha" HEAD -- "${paths[@]}"; then
            echo "Nothing new for the app since ${tag}: no build tonight."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes since ${tag:-the start}: building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-14   # Apple Silicon
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags: the release notes list changes since the last build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5   # only runs the pipeline tests; the app bundles its own Python
        with:
          python-version: '3.12'
      - name: Pipeline tests
        run: python -m unittest discover -s tests
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: App tests
        working-directory: desktop
        run: npm test
      - name: Add the shared Google app client
        env:
          CLIENT: ${{ secrets.GOOGLE_SHARED_CLIENT_JSON }}
        run: |
          if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > config/google_oauth_client.json
          else echo "::notice::GOOGLE_SHARED_CLIENT_JSON is not set; the app will ask users for their own Google app."; fi
      - name: Build AudioTee (the call's audio, Core Audio taps)
        working-directory: desktop
        run: scripts/audiotee.sh && test -x build/bin/audiotee
      - name: Bundle Python
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/stage.mjs --app && scripts/python.sh
      - name: Version
        id: version
        working-directory: desktop
        # package.json holds the target (0.5.0): each build is the next patch, 0.5.1, 0.5.2 … The channel (build, beta, stable) says how proven it is, not the version.
        run: |
          version=$(scripts/next-version.sh)
          npm version "$version" --no-git-tag-version --allow-same-version >/dev/null
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: desktop
        env:
          # The release certificate (scripts/sign.cjs): every build carries the same self-made signature.
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          npm run build -- -c.buildVersion="${{ github.run_number }}"   # CFBundleVersion = the release build number
          codesign -dvv dist/mac-arm64/*.app 2>&1 | grep -q "Authority=Job Pilotto Self-Signed" \
            || { echo "::error::The app isn't signed with the release certificate"; exit 1; }
      - name: Build provenance (anyone can verify the download was built here, from this commit)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: desktop/dist/Job-Pilotto-*-arm64.*
      - name: Release
        id: release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub refuses (HTTP 403) to let this run's token tag a commit whose workflow files differ from main's.
          # When workflows changed on main during the build, a fresh build of main releases instead.
          git fetch -q origin main
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- .github/workflows; then
            echo "::warning::Workflows changed on main during this build: not released; a new build of main starts."
            gh workflow run desktop.yml --ref main
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          tag="desktop-v${version}"
          # Stable names too, so a download link can always point at the latest build.
          cp "dist/Job-Pilotto-${version}-arm64.dmg" dist/Job-Pilotto-mac-arm64.dmg
          cp "dist/Job-Pilotto-${version}-arm64.zip" dist/Job-Pilotto-mac-arm64.zip
          { echo "**Version ${version}**"; echo; scripts/release-notes.sh "$GITHUB_SHA"; echo
            echo "Built by GitHub Actions from ${GITHUB_SHA::7}. Check a download: \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`"
          } > release-notes.md
          if ! gh release create "$tag" dist/Job-Pilotto-*.dmg dist/Job-Pilotto-*.zip \
            --title "$(scripts/release-title.sh "$version")" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --draft 2> release-error.txt; then   # published by the windows job once the .exe is there (or by mac-only if it fails)
            cat release-error.txt >&2
            # The same 403 when workflows changed on main in the seconds after the check above: hand over to a fresh
            # build of main instead of failing. Only when main has moved, so a real 403 on main itself still fails.
            git fetch -q origin main
            if grep -q 'HTTP 403' release-error.txt && [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true   # a half-made draft, if any
              echo "::warning::Release refused (403) after main moved: not released; a new build of main starts."
              gh workflow run desktop.yml --ref main
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"

  windows:
    needs: build   # the release exists and has its version
    if: needs.build.outputs.released == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5   # only reads the Python release list; the app bundles its own Python
        with:
          python-version: '3.12'
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: App tests (on Windows)
        working-directory: desktop
        run: npm test
      - name: Add the shared Google app client
        env:
          CLIENT: ${{ secrets.GOOGLE_SHARED_CLIENT_JSON }}
        run: if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > config/google_oauth_client.json; fi
      - name: Bundle Python
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON_ARCH: x86_64-pc-windows-msvc
        run: node scripts/stage.mjs --app && scripts/python.sh
      - name: Build
        working-directory: desktop
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          npm run build:win -- -c.buildVersion="${{ github.run_number }}"
      - name: Smoke test the installed app (install, bundled Python, Credential Manager, three screens)
        working-directory: desktop
        run: node scripts/windows-smoke.mjs "dist/Job-Pilotto-${VERSION}-x64.exe" smoke
      - name: Build provenance (anyone can verify the download was built here, from this commit)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: desktop/dist/Job-Pilotto-*-x64.exe
      - name: Keep the Windows screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screens-${{ needs.build.outputs.version }}
          path: desktop/smoke
          if-no-files-found: ignore
          retention-days: 14
      - name: Add to the release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A stable name too, so a download link can always point at the latest build.
          cp "dist/Job-Pilotto-${VERSION}-x64.exe" dist/Job-Pilotto-windows-x64.exe
          gh release upload "desktop-v${VERSION}" "dist/Job-Pilotto-${VERSION}-x64.exe" dist/Job-Pilotto-windows-x64.exe
          gh release edit "desktop-v${VERSION}" --draft=false --prerelease

  # The Windows build failed: publish the Mac release anyway, carrying over the last working Windows installer
  # so the website's Windows link (latest release) keeps working until a Windows build passes again.
  mac-only:
    needs: [build, windows]
    if: always() && needs.build.result == 'success' && needs.build.outputs.released == 'true' && needs.windows.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish without the Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            -q '[.[] | select(.draft | not) | select(any(.assets[]; .name == "Job-Pilotto-windows-x64.exe"))][0].tag_name')
          if [ -n "$prev" ]; then
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" -p Job-Pilotto-windows-x64.exe -D previous
            gh release upload "desktop-v${VERSION}" --repo "$GITHUB_REPOSITORY" previous/Job-Pilotto-windows-x64.exe
            echo "::warning::Windows build failed; desktop-v${VERSION} carries the Windows installer from ${prev}."
          else
            echo "::warning::Windows build failed and no earlier release has a Windows installer."
          fi
          gh release edit "desktop-v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

  # Keep the release list short: stable releases stay, plus the newest 3 test builds (tools/prune-releases.sh).
  prune:
    needs: [build, windows, mac-only]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # delete the older test builds, retitle releases
      issues: write     # the pinned Release channels issue
    steps:
      - uses: actions/checkout@v4
      - name: Remove older test builds (their tags stay)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/prune-releases.sh 3
      - name: Release titles and the pinned Release channels issue (a new build is listed at once, not at the next soak run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync_release_labels.py || echo "labels not refreshed"   # best effort, never fails a build
