name: desktop

# Builds the Mac app (Apple Silicon .dmg + .zip, bundled Python and pipeline) and publishes it as a
# GitHub Release, only when something that goes into the app changed on main.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'config/**'
      - 'tools/**'
      - 'extension/**'
      - 'worker/src/**'
      - 'requirements.txt'
      - 'docs/notion-profile-template.md'
      - 'docs/job-pilotto-guide.md'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write   # create the release

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5   # only runs the pipeline tests; the app bundles its own Python
        with:
          python-version: '3.12'
      - name: Pipeline tests
        run: python -m unittest discover -s tests
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: App tests
        working-directory: desktop
        run: npm test
      - name: Add the shared Google app client
        env:
          CLIENT: ${{ secrets.GOOGLE_SHARED_CLIENT_JSON }}
        run: |
          if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > config/google_oauth_client.json
          else echo "::notice::GOOGLE_SHARED_CLIENT_JSON is not set; the app will ask users for their own Google app."; fi
      - name: Bundle Python
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/stage.mjs --app && scripts/python.sh
      - name: Build
        working-directory: desktop
        run: npm run build
      - name: Release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="desktop-v${version}-${{ github.run_number }}"
          # Stable names too, so a download link can always point at the latest build.
          cp "dist/Job-Pilotto-${version}-arm64.dmg" dist/Job-Pilotto-mac-arm64.dmg
          cp "dist/Job-Pilotto-${version}-arm64.zip" dist/Job-Pilotto-mac-arm64.zip
          gh release create "$tag" dist/Job-Pilotto-*.dmg dist/Job-Pilotto-*.zip \
            --title "Job Pilotto ${version} (build ${{ github.run_number }})" \
            --notes "Mac app for Apple Silicon, built from ${GITHUB_SHA::7}. Not signed by Apple yet: the first time, right-click the app → Open → Open." \
            --target "$GITHUB_SHA"
