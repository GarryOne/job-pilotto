name: desktop

# Builds the Mac app (Apple Silicon .dmg + .zip, bundled Python and pipeline) and publishes it as a
# GitHub Release, only when something that goes into the app changed on main. The Windows job then adds
# an x64 installer (.exe, unsigned: SmartScreen asks "Run anyway") to the same release.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'config/**'
      - 'tools/**'
      - 'extension/**'
      - 'worker/src/**'
      - 'requirements.txt'
      - 'requirements-transcribe.txt'
      - 'docs/notion-profile-template.md'
      - 'docs/job-pilotto-guide.md'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write   # create the release

# A release runs to the end (Mac, then the Windows installer), so the latest release always has both
# downloads the website links to; newer pushes wait, and only the newest waiting one runs.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags: the release notes list changes since the last build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5   # only runs the pipeline tests; the app bundles its own Python
        with:
          python-version: '3.12'
      - name: Pipeline tests
        run: python -m unittest discover -s tests
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: App tests
        working-directory: desktop
        run: npm test
      - name: Add the shared Google app client
        env:
          CLIENT: ${{ secrets.GOOGLE_SHARED_CLIENT_JSON }}
        run: |
          if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > config/google_oauth_client.json
          else echo "::notice::GOOGLE_SHARED_CLIENT_JSON is not set; the app will ask users for their own Google app."; fi
      - name: Build AudioTee (the call's audio, Core Audio taps)
        working-directory: desktop
        run: scripts/audiotee.sh && test -x build/bin/audiotee
      - name: Bundle Python
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/stage.mjs --app && scripts/python.sh
      - name: Version
        id: version
        working-directory: desktop
        # package.json holds the target and phase (e.g. 0.2.0-alpha); each release gets the next number.
        run: |
          version=$(scripts/next-version.sh)
          npm version "$version" --no-git-tag-version --allow-same-version >/dev/null
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: desktop
        run: npm run build -- -c.buildVersion="${{ github.run_number }}"   # CFBundleVersion = the release build number
      - name: Release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="desktop-v${version}"
          # Stable names too, so a download link can always point at the latest build.
          cp "dist/Job-Pilotto-${version}-arm64.dmg" dist/Job-Pilotto-mac-arm64.dmg
          cp "dist/Job-Pilotto-${version}-arm64.zip" dist/Job-Pilotto-mac-arm64.zip
          scripts/release-notes.sh "$GITHUB_SHA" > release-notes.md
          gh release create "$tag" dist/Job-Pilotto-*.dmg dist/Job-Pilotto-*.zip \
            --title "Job Pilotto ${version}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"

  windows:
    needs: build   # the release exists and has its version
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5   # only reads the Python release list; the app bundles its own Python
        with:
          python-version: '3.12'
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: App tests (on Windows; reported, not blocking yet)
        working-directory: desktop
        continue-on-error: true
        run: npm test
      - name: Add the shared Google app client
        env:
          CLIENT: ${{ secrets.GOOGLE_SHARED_CLIENT_JSON }}
        run: if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > config/google_oauth_client.json; fi
      - name: Bundle Python
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON_ARCH: x86_64-pc-windows-msvc
        run: node scripts/stage.mjs --app && scripts/python.sh
      - name: Build
        working-directory: desktop
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          npm run build:win -- -c.buildVersion="${{ github.run_number }}"
      - name: Add to the release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A stable name too, so a download link can always point at the latest build.
          cp "dist/Job-Pilotto-${VERSION}-x64.exe" dist/Job-Pilotto-windows-x64.exe
          gh release upload "desktop-v${VERSION}" "dist/Job-Pilotto-${VERSION}-x64.exe" dist/Job-Pilotto-windows-x64.exe
