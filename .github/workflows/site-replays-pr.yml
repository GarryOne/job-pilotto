permissions:
  contents: read
  actions: read   # the pool runs' encrypted records, the baseline run's results
  pull-requests: read   # this PR's own replay-accepted label and Replay-accept comments (replay-accepts.mjs --pr)

concurrency:
  group: replay-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # a newer push replaces the run

jobs:
  pick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.pick.outputs.groups }}
      count: ${{ steps.pick.outputs.count }}
      names: ${{ steps.pick.outputs.names }}
    steps:
      - uses: actions/checkout@v5
      - name: The PR paths list everything this workflow loads
        run: node tools/replay-files.mjs --check site-replays-pr.yml
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The rows (from the last green scheduled replay)
        id: pick
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(bash replay-baseline.sh "$RUNNER_TEMP/baseline")"
          node replay-pick.mjs "$base" --pinned replay-faithful.json > "$RUNNER_TEMP/pick.json"
          jq -r .line "$RUNNER_TEMP/pick.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "groups=$(jq -c .groups "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.groups | length' "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"
          echo "names=$(jq -c .names "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"

  replay:
    needs: pick
    if: needs.pick.outputs.count != '0'
    runs-on: ubuntu-24.04   # Linux: the same verdict as the Mac on every row that is same as live (the main run's Linux shards keep measuring it)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.pick.outputs.groups) }}
    env:
      JOB_PILOTTO_HEAVY: '0'   # the heavy lock is a Mac's machine-wide queue; this runner is its own machine
    steps:
      - name: The record key is set
        id: key
        env:
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
        run: |
          if [ -z "$NET_RECORD_KEY" ]; then echo "replay-pr: key not set (NET_RECORD_KEY): nothing replayed" | tee -a "$GITHUB_STEP_SUMMARY"; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == '1'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.ok == '1'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/e2e/package-lock.json
      - uses: actions/setup-python@v6
        if: steps.key.outputs.ok == '1'
        with:
          python-version: '3.12'
      - name: Install the app, the tests and the browser
        if: steps.key.outputs.ok == '1'
        run: |
          (cd desktop && npm ci) && (cd desktop/e2e && (npm ci || npm install))
          pip install --quiet -r requirements.txt
          (cd desktop/e2e && npx playwright-core install --with-deps chromium)
      - name: The pool's newest records, decrypted on the runner only
        if: steps.key.outputs.ok == '1'
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
          NET_RECORDS_READ_TOKEN: ${{ secrets.NET_RECORDS_READ_TOKEN }}   # read-only, job-pilotto-internal only (the Mac's records)
        run: bash net-records-fetch.sh "$GITHUB_WORKSPACE/records"
      - name: Replay this runner's rows with the PR's build
        if: steps.key.outputs.ok == '1'
        working-directory: desktop/e2e
        env:
          JP_REPLAY_ONLY: ${{ matrix.group }}
        run: node replay-records.mjs "$GITHUB_WORKSPACE/records" "$GITHUB_WORKSPACE/replay-out"
      # A flaky check passes on its 2nd try (owner's standing rule): this runner's PINNED rows that came out not same as live are replayed once more, here, with the same records. The gate
      # counts a row that passes only on the retry as "noise (passed on retry)", shown in the summary, never silent (replay-gate.mjs); the scheduled runs count it per row and flag a row at 3 in 7 days.
      - name: Replay once more the pinned rows that were not same
        if: steps.key.outputs.ok == '1'
        working-directory: desktop/e2e
        run: |
          node replay-unsame.mjs "$GITHUB_WORKSPACE/replay-out/step4" replay-faithful.json > "$RUNNER_TEMP/retry.txt"
          if [ -s "$RUNNER_TEMP/retry.txt" ]; then
            echo "retry: $(tr '\n' ',' < "$RUNNER_TEMP/retry.txt")" | tee -a "$GITHUB_STEP_SUMMARY"
            JP_REPLAY_ONLY="$(cat "$RUNNER_TEMP/retry.txt")" node replay-records.mjs "$GITHUB_WORKSPACE/records" "$GITHUB_WORKSPACE/replay-retry" > /dev/null || true
          fi
      - name: This runner's retried rows (for the verdict)
        if: always() && steps.key.outputs.ok == '1'
        uses: actions/upload-artifact@v6
        with:
          name: replay-pr-retry-${{ github.run_id }}-${{ strategy.job-index }}
          path: replay-retry/step4/*.json
          retention-days: 7
          if-no-files-found: ignore
      # The late-answer pass (answers delayed 4 s) runs on the scheduled runs only (site-replays.yml, owner 15 Oct 2026: "edge-case or costly checks will be caught hours later on the scheduled runs").
      - name: This runner's rows (for the verdict; no record, no key)
        if: always() && steps.key.outputs.ok == '1'
        uses: actions/upload-artifact@v6
        with:
          name: replay-pr-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            replay-out/step4/*.json
            replay-out/replays/*/end.png
            replay-out/replays/*/replay.json
            replay-out/replays/*/app.log
          retention-days: 7
          if-no-files-found: ignore

  verdict:
    name: site replays gate
    needs: [pick, replay]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: No baseline yet
        if: needs.pick.outputs.count == '0'
        env:
          PICK: ${{ needs.pick.result }}
        run: |
          [ "$PICK" = success ] || { echo "::error::the pick job did not finish ($PICK)"; exit 1; }
          echo "replay gate: no baseline with rows 100% same as live yet: passes (a by-hand replay on main makes one)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        if: needs.pick.outputs.count != '0'
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        if: needs.pick.outputs.count != '0'
        with:
          pattern: replay-pr-${{ github.run_id }}-*
          path: ${{ runner.temp }}/shards
      - uses: actions/download-artifact@v7   # the retried rows, when a pinned row came out not same
        if: needs.pick.outputs.count != '0'
        continue-on-error: true
        with:
          pattern: replay-pr-retry-${{ github.run_id }}-*
          path: ${{ runner.temp }}/retry-shards
      - name: Judge the rows against the last green scheduled run (red when worse or unfinished)
        if: needs.pick.outputs.count != '0'
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY: ${{ needs.replay.result }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          PICKED: ${{ needs.pick.outputs.names }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # The owner's accept on THIS PR (label replay-accepted + comment "Replay-accept: ..."), read live: a re-run of this job (site-replays-accept.yml re-runs it on a label or comment) sees it.
          node replay-accepts.mjs - "$RUNNER_TEMP/accepts.json" --pr "$PR" || echo '{"entries":[]}' > "$RUNNER_TEMP/accepts.json"
          mkdir -p "$RUNNER_TEMP/step4" "$RUNNER_TEMP/retry4" && find "$RUNNER_TEMP/shards" -path '*step4/*.json' -exec cp {} "$RUNNER_TEMP/step4/" \;
          find "$RUNNER_TEMP/retry-shards" -name '*.json' -exec cp {} "$RUNNER_TEMP/retry4/" \; 2>/dev/null || true
          base="$(bash replay-baseline.sh "$RUNNER_TEMP/baseline")"
          # the ratchet: the pinned file is the baseline; the base branch's copy keeps a row this PR unpinned held until a Replay-accept names it
          git fetch --depth=1 origin "$BASE_REF" && git show "origin/$BASE_REF:desktop/e2e/replay-faithful.json" > "$RUNNER_TEMP/base-pins.json" 2>/dev/null || echo '{"rows":{}}' > "$RUNNER_TEMP/base-pins.json"
          # the rows the pick replayed: a pinned row it did not pick is "not replayed on PRs", never worse (the scheduled runs check it)
          printf '%s' "$PICKED" | jq -r '.[]' > "$RUNNER_TEMP/picked.txt"
          set +e
          node replay-gate.mjs "$RUNNER_TEMP/step4" "$base" "$RUNNER_TEMP/results.json" --accepts "$RUNNER_TEMP/accepts.json" --pinned replay-faithful.json --base-pinned "$RUNNER_TEMP/base-pins.json" --picked "$RUNNER_TEMP/picked.txt" --retry "$RUNNER_TEMP/retry4" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/gate-summary.md"; code=${PIPESTATUS[0]}
          set -e
          [ "$REPLAY" = success ] || { echo "::error::a replay runner did not finish ($REPLAY): the gate cannot pass" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          if [ "$code" != 0 ] && grep -q 'replay-refill.yml' "$RUNNER_TEMP/gate-summary.md"; then echo "::error::next step for the rows whose answers are stale: gh workflow run replay-refill.yml -f pr=$PR  (by hand, on the owner's go)"; fi
          [ "$code" = 0 ] || { echo "::error::a pinned row is no longer same as live (see the summary). If intended: label this PR replay-accepted and comment 'Replay-accept: <row> — <reason>' (the summary has the line): the gate re-judges by itself, and the nightly takes the new baseline after the merge"; exit 1; }
