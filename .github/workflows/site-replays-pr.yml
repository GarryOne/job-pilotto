# The replay's quick PR gate (owner, 14 Oct 2026: "on the PR we can keep only 10, most relevant, or the most quick ... as a quick safety gate. Then the full 50 rows
# will run on a schedule"; "parallelize them as much as possible, to get them in 2-3 mins"). A PR that changes the apply flow's code replays at most 10 pool rows offline
# (desktop/e2e/replay-pick.mjs: the rows 100% same as live in the last green scheduled run, quickest, one per site first) on up to 5 macOS runners at once, then judges
# them against that run (replay-gate.mjs: a counted row whose outcome fell is worse). It starts only when a PR changes the apply flow's code or the replay machinery its steps start (GitHub's `paths:`,
# owner 14 Oct 2026: "only if we touched the apply flow logic code"; "rely fully on gh workflow paths"; later the same day: replay-machinery PRs too): red when a counted row got worse or a runner did not finish.
# An intended drop is accepted on the PR itself (owner, 14 Oct 2026): label `replay-accepted` + a comment `Replay-accept: <row> — <reason>` (the summary prints the line); site-replays-accept.yml then re-runs
# only the failed verdict job (and "all checks green"), which reads the label and comments live, so the gate re-judges the same replays in seconds at $0. Not a required check any more: a workflow `paths:` skips never reports. A second, late-answer pass delays every kept answer 4 s and fails no row but says which lost Claude's answers (lib/lost-answers.mjs). $0: no AI key, no site visit (the records and the live run's kept answers). The full pool: site-replays.yml on its schedule. Guard: e2e/test/replay-pick.test.mjs.
name: CI · Site replays · PR (10 rows)

on:
  pull_request:
    paths:   # the apply flow's code and the replay machinery its steps start: tools/replay-files.mjs workflowFiles (desktop/test/replay-workflow-paths.test.js)
      - '.github/workflows/site-replays-pr.yml'
      - 'desktop/cv/template.js'
      - 'desktop/e2e/fixtures/cv.json'
      - 'desktop/e2e/lib/ai-meter.mjs'
      - 'desktop/e2e/lib/ai-proxy.mjs'
      - 'desktop/e2e/lib/app-front.mjs'
      - 'desktop/e2e/lib/app-log.mjs'
      - 'desktop/e2e/lib/app.mjs'
      - 'desktop/e2e/lib/applicant-seed.mjs'
      - 'desktop/e2e/lib/apply-fixtures.mjs'
      - 'desktop/e2e/lib/capture-journey.mjs'
      - 'desktop/e2e/lib/capture-page.mjs'
      - 'desktop/e2e/lib/chrome-lean.mjs'
      - 'desktop/e2e/lib/cookie-layer-left.mjs'
      - 'desktop/e2e/lib/deciding.mjs'
      - 'desktop/e2e/lib/end-shot.mjs'
      - 'desktop/e2e/lib/engine.mjs'
      - 'desktop/e2e/lib/evidence-bundle.mjs'
      - 'desktop/e2e/lib/evidence-clean.mjs'
      - 'desktop/e2e/lib/extension.mjs'
      - 'desktop/e2e/lib/fill-memo.mjs'
      - 'desktop/e2e/lib/forms.mjs'
      - 'desktop/e2e/lib/journey.mjs'
      - 'desktop/e2e/lib/live-readings.mjs'
      - 'desktop/e2e/lib/live-row.mjs'
      - 'desktop/e2e/lib/live-still.mjs'
      - 'desktop/e2e/lib/lost-answers.mjs'
      - 'desktop/e2e/lib/net-record.mjs'
      - 'desktop/e2e/lib/notion.mjs'
      - 'desktop/e2e/lib/offline-app-child.mjs'
      - 'desktop/e2e/lib/offline-app-commands.mjs'
      - 'desktop/e2e/lib/offline-app.mjs'
      - 'desktop/e2e/lib/offline-guard.mjs'
      - 'desktop/e2e/lib/own-asks.mjs'
      - 'desktop/e2e/lib/owner-guard-env.mjs'
      - 'desktop/e2e/lib/pool-eligibility.mjs'
      - 'desktop/e2e/lib/privacy-tripwire.mjs'
      - 'desktop/e2e/lib/python.mjs'
      - 'desktop/e2e/lib/real-claude.mjs'
      - 'desktop/e2e/lib/real-extension.mjs'
      - 'desktop/e2e/lib/recorded-false-readings.mjs'
      - 'desktop/e2e/lib/replay-candidate.mjs'
      - 'desktop/e2e/lib/replay-date.mjs'
      - 'desktop/e2e/lib/replay-field-diff.mjs'
      - 'desktop/e2e/lib/replay-truth.mjs'
      - 'desktop/e2e/lib/run-logs.mjs'
      - 'desktop/e2e/lib/scrollbar.mjs'
      - 'desktop/e2e/lib/seed-data.mjs'
      - 'desktop/e2e/lib/seeded-random.mjs'
      - 'desktop/e2e/lib/site-ledger.mjs'
      - 'desktop/e2e/lib/smoke.mjs'
      - 'desktop/e2e/lib/staged-worker.mjs'
      - 'desktop/e2e/lib/step-shots.mjs'
      - 'desktop/e2e/lib/store-call.mjs'
      - 'desktop/e2e/lib/test-accounts.mjs'
      - 'desktop/e2e/lib/vision.mjs'
      - 'desktop/e2e/lib/worker-console.mjs'
      - 'desktop/e2e/lib/wrong-values.mjs'
      - 'desktop/e2e/net-records-fetch.sh'
      - 'desktop/e2e/replay-accepts.mjs'
      - 'desktop/e2e/replay-baseline.sh'
      - 'desktop/e2e/replay-deferred.json'
      - 'desktop/e2e/replay-gate.mjs'
      - 'desktop/e2e/replay-late.mjs'
      - 'desktop/e2e/replay-net.mjs'
      - 'desktop/e2e/replay-pick.mjs'
      - 'desktop/e2e/replay-records.mjs'
      - 'desktop/e2e/smoke-sites.json'
      - 'desktop/lib/**'
      - 'desktop/renderer/run-status.js'
      - 'desktop/renderer/run-warnings.js'
      - 'desktop/renderer/store-name.js'
      - 'desktop/scripts/extension-stamp.mjs'
      - 'extension/**'
      - 'worker/src/ai-prices.js'
      - 'worker/src/ai.js'
      - 'worker/src/answer-facts.js'
      - 'worker/src/answer-missing.js'
      - 'worker/src/cv-facts.js'
      - 'worker/src/extension-log.js'
      - 'worker/src/extension-run-record.js'
      - 'worker/src/extension.js'
      - 'worker/src/owner-guard.js'

permissions:
  contents: read
  actions: read   # the pool runs' encrypted records, the baseline run's results
  pull-requests: read   # this PR's own replay-accepted label and Replay-accept comments (replay-accepts.mjs --pr)

concurrency:
  group: replay-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # a newer push replaces the run: the macOS runners are few (5 at once)

jobs:
  pick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.pick.outputs.groups }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - name: The PR paths list everything this workflow loads
        run: node tools/replay-files.mjs --check site-replays-pr.yml
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The rows (from the last green scheduled replay)
        id: pick
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(bash replay-baseline.sh "$RUNNER_TEMP/baseline")"
          node replay-pick.mjs "$base" > "$RUNNER_TEMP/pick.json"
          jq -r .line "$RUNNER_TEMP/pick.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "groups=$(jq -c .groups "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.groups | length' "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"

  replay:
    needs: pick
    if: needs.pick.outputs.count != '0'
    runs-on: macos-latest   # the records are made on the owner's Mac: the same fonts and scrollbar as the live page
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.pick.outputs.groups) }}
    env:
      JOB_PILOTTO_HEAVY: '0'   # the heavy lock is a Mac's machine-wide queue; this runner is its own machine
    steps:
      - name: The record key is set
        id: key
        env:
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
        run: |
          if [ -z "$NET_RECORD_KEY" ]; then echo "replay-pr: key not set (NET_RECORD_KEY): nothing replayed" | tee -a "$GITHUB_STEP_SUMMARY"; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == '1'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.ok == '1'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/e2e/package-lock.json
      - uses: actions/setup-python@v6
        if: steps.key.outputs.ok == '1'
        with:
          python-version: '3.12'
      - name: Install the app, the tests and the browser
        if: steps.key.outputs.ok == '1'
        run: |
          (cd desktop && npm ci) && (cd desktop/e2e && (npm ci || npm install))
          pip install --quiet -r requirements.txt
          (cd desktop/e2e && npx playwright-core install chromium)
      - name: The pool's newest records, decrypted on the runner only
        if: steps.key.outputs.ok == '1'
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
          NET_RECORDS_READ_TOKEN: ${{ secrets.NET_RECORDS_READ_TOKEN }}   # read-only, job-pilotto-internal only (the Mac's records)
        run: bash net-records-fetch.sh "$GITHUB_WORKSPACE/records"
      - name: Replay this runner's rows with the PR's build
        if: steps.key.outputs.ok == '1'
        working-directory: desktop/e2e
        env:
          JP_REPLAY_ONLY: ${{ matrix.group }}
        run: node replay-records.mjs "$GITHUB_WORKSPACE/records" "$GITHUB_WORKSPACE/replay-out"
      # The late-answer pass (owner, 14 Oct 2026, after 5afa5a8 lost Claude's answers only when they came after the fill started): the same rows again with every
      # kept answer delayed 4 s; judged only by "no answer lost" (lib/lost-answers.mjs), never against live. Report only.
      - name: Late-answer pass (answers delayed 4 s)
        if: steps.key.outputs.ok == '1'
        working-directory: desktop/e2e
        env:
          JP_REPLAY_ONLY: ${{ matrix.group }}
          JOB_PILOTTO_MODEL_MEMO_LATENCY_PAD_MS: '4000'
        run: |
          node replay-records.mjs "$GITHUB_WORKSPACE/records" "$GITHUB_WORKSPACE/replay-late" > /dev/null || true
          node replay-late.mjs "$GITHUB_WORKSPACE/replay-late/replays" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: This runner's rows (for the verdict; no record, no key)
        if: always() && steps.key.outputs.ok == '1'
        uses: actions/upload-artifact@v6
        with:
          name: replay-pr-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            replay-out/step4/*.json
            replay-out/replays/*/end.png
            replay-out/replays/*/replay.json
            replay-out/replays/*/app.log
            replay-late/replays/*/app.log
            replay-late/replays/*/end.png
          retention-days: 7
          if-no-files-found: ignore

  verdict:
    name: site replays gate
    needs: [pick, replay]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: No baseline yet
        if: needs.pick.outputs.count == '0'
        env:
          PICK: ${{ needs.pick.result }}
        run: |
          [ "$PICK" = success ] || { echo "::error::the pick job did not finish ($PICK)"; exit 1; }
          echo "replay gate: no baseline with rows 100% same as live yet: passes (a by-hand replay on main makes one)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        if: needs.pick.outputs.count != '0'
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        if: needs.pick.outputs.count != '0'
        with:
          pattern: replay-pr-${{ github.run_id }}-*
          path: ${{ runner.temp }}/shards
      - name: Judge the rows against the last green scheduled run (red when worse or unfinished)
        if: needs.pick.outputs.count != '0'
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY: ${{ needs.replay.result }}
          PR: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # The owner's accept on THIS PR (label replay-accepted + comment "Replay-accept: ..."), read live: a re-run of this job (site-replays-accept.yml re-runs it on a label or comment) sees it.
          node replay-accepts.mjs - "$RUNNER_TEMP/accepts.json" --pr "$PR" || echo '{"entries":[]}' > "$RUNNER_TEMP/accepts.json"
          mkdir -p "$RUNNER_TEMP/step4" && find "$RUNNER_TEMP/shards" -path '*step4/*.json' -exec cp {} "$RUNNER_TEMP/step4/" \;
          base="$(bash replay-baseline.sh "$RUNNER_TEMP/baseline")"
          set +e
          node replay-gate.mjs "$RUNNER_TEMP/step4" "$base" "$RUNNER_TEMP/results.json" --accepts "$RUNNER_TEMP/accepts.json" | tee -a "$GITHUB_STEP_SUMMARY"; code=${PIPESTATUS[0]}
          set -e
          [ "$REPLAY" = success ] || { echo "::error::a replay runner did not finish ($REPLAY): the gate cannot pass" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ "$code" = 0 ] || { echo "::error::a counted row got worse than the last green scheduled replay (see the summary). If intended: label this PR replay-accepted and comment 'Replay-accept: <row> — <reason>' (the summary has the line): the gate re-judges by itself, and the nightly takes the new baseline after the merge"; exit 1; }
