      - 'desktop/e2e/lib/offline-app-child.mjs'
      - 'desktop/e2e/lib/offline-app-commands.mjs'
      - 'desktop/e2e/lib/offline-app.mjs'
      - 'desktop/e2e/lib/offline-guard.mjs'
