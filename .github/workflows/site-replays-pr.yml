# The replay's quick PR gate (owner, 14 Oct 2026: "on the PR we can keep only 10, most relevant, or the most quick ... as a quick safety gate. Then the full 50 rows
# will run on a schedule"; "parallelize them as much as possible, to get them in 2-3 mins"). A PR that changes the apply flow's code replays at most 10 pool rows offline
# (desktop/e2e/replay-pick.mjs: the rows 100% same as live in the last green scheduled run, quickest, one per site first) on up to 5 macOS runners at once, then judges
# them against that run (replay-gate.mjs: a counted row whose outcome fell is worse). It starts only when a PR changes extension/ or desktop/lib/ (GitHub's `paths:`,
# owner 14 Oct 2026: "only if we touched the apply flow logic code"; "rely fully on gh workflow paths"): red when a counted row got worse or a runner did not finish.
# Not a required check any more: a workflow `paths:` skips never reports. A second, late-answer pass delays every kept answer 4 s and fails no row but says which lost Claude's answers (lib/lost-answers.mjs). $0: no AI key, no site visit (the records and the live run's kept answers). The full pool: site-replays.yml on its schedule. Guard: e2e/test/replay-pick.test.mjs.
name: CI · Site replays · PR (10 rows)

on:
  pull_request:
    paths:
      - 'extension/**'
      - 'desktop/lib/**'

permissions:
  contents: read
  actions: read   # the pool runs' encrypted records, the baseline run's results

concurrency:
  group: replay-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # a newer push replaces the run: the macOS runners are few (5 at once)

jobs:
  pick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.pick.outputs.groups }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The rows (from the last green scheduled replay)
        id: pick
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(bash replay-baseline.sh "$RUNNER_TEMP/baseline")"
          node replay-pick.mjs "$base" > "$RUNNER_TEMP/pick.json"
          jq -r .line "$RUNNER_TEMP/pick.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "groups=$(jq -c .groups "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.groups | length' "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"

  replay:
    needs: pick
    if: needs.pick.outputs.count != '0'
    runs-on: macos-latest   # the records are made on the owner's Mac: the same fonts and scrollbar as the live page
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.pick.outputs.groups) }}
    env:
      JOB_PILOTTO_HEAVY: '0'   # the heavy lock is a Mac's machine-wide queue; this runner is its own machine
    steps:
      - name: The record key is set
        id: key
        env:
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
        run: |
          if [ -z "$NET_RECORD_KEY" ]; then echo "replay-pr: key not set (NET_RECORD_KEY): nothing replayed" | tee -a "$GITHUB_STEP_SUMMARY"; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == '1'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.ok == '1'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/e2e/package-lock.json
      - uses: actions/setup-python@v6
        if: steps.key.outputs.ok == '1'
        with:
          python-version: '3.12'
      - name: Install the app, the tests and the browser
        if: steps.key.outputs.ok == '1'
        run: |
          (cd desktop && npm ci) && (cd desktop/e2e && (npm ci || npm install))
          pip install --quiet -r requirements.txt
          (cd desktop/e2e && npx playwright-core install chromium)
      - name: The pool's newest records, decrypted on the runner only
        if: steps.key.outputs.ok == '1'
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
          NET_RECORDS_READ_TOKEN: ${{ secrets.NET_RECORDS_READ_TOKEN }}   # read-only, job-pilotto-internal only (the Mac's records)
        run: bash net-records-fetch.sh "$GITHUB_WORKSPACE/records"
      - name: Replay this runner's rows with the PR's build
        if: steps.key.outputs.ok == '1'
        working-directory: desktop/e2e
        env:
          JP_REPLAY_ONLY: ${{ matrix.group }}
        run: node replay-records.mjs "$GITHUB_WORKSPACE/records" "$GITHUB_WORKSPACE/replay-out"
      # The late-answer pass (owner, 14 Oct 2026, after 5afa5a8 lost Claude's answers only when they came after the fill started): the same rows again with every
      # kept answer delayed 4 s; judged only by "no answer lost" (lib/lost-answers.mjs), never against live. Report only.
      - name: Late-answer pass (answers delayed 4 s)
        if: steps.key.outputs.ok == '1'
        working-directory: desktop/e2e
        env:
          JP_REPLAY_ONLY: ${{ matrix.group }}
          JOB_PILOTTO_MODEL_MEMO_LATENCY_PAD_MS: '4000'
        run: |
          node replay-records.mjs "$GITHUB_WORKSPACE/records" "$GITHUB_WORKSPACE/replay-late" > /dev/null || true
          node replay-late.mjs "$GITHUB_WORKSPACE/replay-late/replays" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: This runner's rows (for the verdict; no record, no key)
        if: always() && steps.key.outputs.ok == '1'
        uses: actions/upload-artifact@v6
        with:
          name: replay-pr-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            replay-out/step4/*.json
            replay-out/replays/*/end.png
            replay-out/replays/*/replay.json
            replay-out/replays/*/app.log
            replay-late/replays/*/app.log
            replay-late/replays/*/end.png
          retention-days: 7
          if-no-files-found: ignore

  verdict:
    name: replay gate
    needs: [pick, replay]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: No baseline yet
        if: needs.pick.outputs.count == '0'
        env:
          PICK: ${{ needs.pick.result }}
        run: |
          [ "$PICK" = success ] || { echo "::error::the pick job did not finish ($PICK)"; exit 1; }
          echo "replay gate: no baseline with rows 100% same as live yet: passes (a by-hand replay on main makes one)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        if: needs.pick.outputs.count != '0'
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        if: needs.pick.outputs.count != '0'
        with:
          pattern: replay-pr-${{ github.run_id }}-*
          path: ${{ runner.temp }}/shards
      - name: Judge the rows against the last green scheduled run (red when worse or unfinished)
        if: needs.pick.outputs.count != '0'
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY: ${{ needs.replay.result }}
        run: |
          mkdir -p "$RUNNER_TEMP/step4" && find "$RUNNER_TEMP/shards" -path '*step4/*.json' -exec cp {} "$RUNNER_TEMP/step4/" \;
          base="$(bash replay-baseline.sh "$RUNNER_TEMP/baseline")"
          set +e
          node replay-gate.mjs "$RUNNER_TEMP/step4" "$base" "$RUNNER_TEMP/results.json" | tee -a "$GITHUB_STEP_SUMMARY"; code=${PIPESTATUS[0]}
          set -e
          [ "$REPLAY" = success ] || { echo "::error::a replay runner did not finish ($REPLAY): the gate cannot pass" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ "$code" = 0 ] || { echo "::error::a counted row got worse than the last green scheduled replay (see the summary). If intended: after the merge, label this PR replay-accepted and comment 'Replay-accept: <reason>', so the nightly gate accepts it"; exit 1; }
