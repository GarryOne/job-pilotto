# The live proof on a PR (owner, 12 Oct 2026, v2 of the CI pool): ONE public pool row runs on the PR's own build, through pool-smoke.yml (the same floors, caps,
# CI-wide site ledger and summary). To be REQUIRED (owner, 12 Oct 2026: every PR check required): so it is never red for a reason outside the PR (below).
# - As the GROWN test applicant (owner, 12 Oct 2026), unless the PR body says "live-applicant: thin"; its last CI run is compared only with the same applicant.
# - Which row (desktop/e2e/lib/pool-proof.mjs): a "live-row: <row words>" line in the PR body, else the first "Pool-row: <row>" line in the PR's commits.
#   Only on the "live-proof" label since 13 Oct 2026 (owner: "let's disable that", the automatic runs' spend); it then needs a row named.
# - Every PR it runs for gets the "live-proof" label (added by the pick job), so label:live-proof lists every PR with a CI live run.
# - A row not in the repo's pool list, a fork's PR (no secrets) or no row named: one neutral line in the "pick" job's summary, nothing runs.
# - Red only for a harness error, the tripwire, a refused AI, or the row reaching less than its last CI run on main or on this PR. A bot wall on the CI IP,
#   a refusal, a gone posting or a host out of CI visits today is never red.
# - A row whose site cannot be visited today (CI's ledger: out of visits, or resting after a block page) is SKIPPED before it starts: the pick job prepares the
#   ledger as the run does and asks the run's own rule (desktop/e2e/lib/pool-proof-visit.mjs); no row, so the proof job is skipped (a skipped required check never
#   blocks a merge) and the NOT RUN line, with when to retry, goes to the PR as a comment (owner, 12 Oct 2026: every PR check required).
name: CI · Pool row live proof (PR)

on:
  pull_request:
    types: [labeled]   # on demand only since 13 Oct 2026 (owner: "let's disable that"): the "live-proof" label, never on open or push

permissions:
  contents: read
  pull-requests: write   # the pick job labels its PR "live-proof" when it names a row
  actions: read

jobs:
  pick:
    if: github.event.label.name == 'live-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      row: ${{ steps.pick.outputs.row }}
      applicant: ${{ steps.pick.outputs.applicant }}
    env:
      JOB_PILOTTO_SITE_LIMIT: '2'          # as pool-smoke.yml: CI's limit per host per UTC day
      JOB_PILOTTO_VISIT_KIND: proof        # a PR proof may use the visit a by-hand run leaves
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Which pool row this PR names (before the site check)
        id: named
        env:
          JP_PICK_QUIET: '1'   # the summary line is the second pass's
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[].commit.message | @json' > "$RUNNER_TEMP/messages" || true
          node desktop/e2e/pool-proof-pick.mjs "$RUNNER_TEMP/messages"
      - name: Earlier CI runs -> today's site ledger (as the run prepares it), only when a row is named
        if: steps.named.outputs.row != ''
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_PILOTTO_SITE_LEDGER_DIR: ${{ runner.temp }}/site-ledger
        run: |
          mkdir -p "$RUNNER_TEMP/states" "$JOB_PILOTTO_SITE_LEDGER_DIR"
          since=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for workflow in pool-smoke.yml pool-proof.yml; do
            gh run list --workflow "$workflow" --limit 40 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$since\") | .databaseId" || true
          done | sort -rn | uniq | grep -vx "$GITHUB_RUN_ID" | head -40 | while read -r id; do
            gh run download "$id" --name "pool-smoke-state-$id" --dir "$RUNNER_TEMP/states/$id" >/dev/null 2>&1 || true
          done
          node desktop/e2e/pool-ci-state.mjs prepare "$RUNNER_TEMP/states" "$RUNNER_TEMP/baseline.json"
      - name: Which pool row this PR proves live
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          JOB_PILOTTO_SITE_LEDGER_DIR: ${{ steps.named.outputs.row != '' && format('{0}/site-ledger', runner.temp) || '' }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[].commit.message | @json' > "$RUNNER_TEMP/messages" || true
          node desktop/e2e/pool-proof-pick.mjs "$RUNNER_TEMP/messages"
      - name: Tell the PR its proof is skipped today (its site cannot be visited) and when to run it again
        if: steps.pick.outputs.skipped != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SKIPPED: ${{ steps.pick.outputs.skipped }}
        run: |
          # shellcheck disable=SC2016  # the backticks are Markdown code in the comment, not a shell expansion
          printf '%s\n\nThe live proof is skipped, not red: the reason is outside this PR. Run it again when the visit is possible: remove and add the `live-proof` label, or push again.\n' "$SKIPPED" > "$RUNNER_TEMP/skipped.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/skipped.md" || echo "pool-proof: could not comment on the PR"
      # Owner, 12 Oct 2026: every PR with a CI live run carries the label, whatever started it ("label:live-proof" lists them). A label the run's own token adds
      # starts no new run (GitHub's rule), so the row is never run twice.
      - name: Label the PR live-proof (it gets a live run)
        if: steps.pick.outputs.row != '' && !contains(github.event.pull_request.labels.*.name, 'live-proof')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=live-proof' --silent || echo "pool-proof: could not add the live-proof label (the run goes on)"
  proof:
    needs: pick
    if: needs.pick.outputs.row != ''
    uses: ./.github/workflows/pool-smoke.yml
    with:
      only: ${{ needs.pick.outputs.row }}
      share: 1
      applicant: ${{ needs.pick.outputs.applicant }}
    secrets: inherit
