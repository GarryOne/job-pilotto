name: CI · Changelog publish
# The What's new page publishes itself (owner, 18 Oct 2026): every stable release and every build the beta gate approved gets an entry, drafted by Haiku in plain words (new features / improvements / bug fixes),
# checked by site/src/changelog.js and published to https://www.jobpilotto.top/changelog (PUT /changelog/data, SELFHEAL_PUBLISH_KEY). No commit, no PR. A failed draft is not published and is retried at the next run.
# Runs when a release run ends, hourly at :23 as the backup (a promotion to stable has its own run), or by hand: `gh workflow run changelog-publish.yml`.
on:
  workflow_run:
    workflows: ['Release · Build, test, beta']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Also draft versions older than the newest one on the page, and the 0.0.1 start entry (one-time; the owner approves the cost first: node tools/changelog-publish.mjs --plan --backfill)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: changelog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DIGEST_ANTHROPIC_KEY: ${{ secrets.DIGEST_ANTHROPIC_KEY }}
      SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
      BACKFILL: ${{ inputs.backfill }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the commits between two release tags
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Draft and publish the new versions
        run: node tools/changelog-publish.mjs ${BACKFILL:+$([ "$BACKFILL" = true ] && echo --backfill)} --cost "$RUNNER_TEMP/cost.json" 2>&1 | tee "$RUNNER_TEMP/changelog.log"
      - name: Report the AI cost
        if: always()
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: if [ -s "$RUNNER_TEMP/cost.json" ]; then node desktop/e2e/ai-cost-report.mjs --job changelog-publish --file "$RUNNER_TEMP/cost.json"; else echo "no AI call this run"; fi
      - name: Summary
        if: always()
        run: |
          { echo '### Changelog publish'; echo '```'; cat "$RUNNER_TEMP/changelog.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
