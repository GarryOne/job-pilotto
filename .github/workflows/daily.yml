name: Daily job discovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scheduled sends only when new jobs exist; run and today always send'
        type: choice
        options: [scheduled, run, today]
        default: scheduled
  schedule:
    # GitHub Actions schedules use UTC.
    - cron: '30 */4 * * *'

permissions:
  contents: read
  actions: write

# Runs share one SQLite state file; never let two overlap.
concurrency:
  group: sre-watch-state
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Cache entries are immutable, so each run saves a new key and the next
      # run restores the most recent one by prefix.
      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: |
            data/canonical.sqlite
            data/jobs.sqlite
          key: sre-watch-db-${{ github.run_id }}
          restore-keys: sre-watch-db-
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Discover Swiss software employers
        run: python discover.py --pages 2 --max-companies 80
      - name: Generate canonical digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'scheduled' }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python daily.py --send --limit 25 --mode "$MODE"
          else
            python daily.py --limit 25 --mode "$MODE"
          fi
      - name: Save job database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/canonical.sqlite
            data/jobs.sqlite
          key: sre-watch-db-${{ github.run_id }}
      - name: Upload daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sre-watch-${{ github.run_number }}
          path: |
            reports/
            data/canonical.sqlite
          if-no-files-found: warn
