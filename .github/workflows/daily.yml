name: Daily job discovery
run-name: ${{ inputs.mode || 'scheduled' }}${{ inputs.job && format(' {0}', inputs.job) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scheduled sends only when new jobs exist; run and today always send; apply marks a job applied'
        type: choice
        options: [scheduled, run, today, apply, more]
        default: scheduled
      job:
        description: 'job code from /apply_<code> (apply mode only)'
        required: false
      page:
        description: 'page number from a Next button (more mode only)'
        required: false
      seed:
        description: 'ranking seed from a Next button (more mode only)'
        required: false
  schedule:
    # GitHub Actions schedules use UTC.
    - cron: '30 */4 * * *'

permissions:
  contents: read
  actions: write

# Runs share one SQLite state file; never let two overlap. Apply and more runs
# only read it, so they get their own group and a queued run can't displace them.
concurrency:
  group: ${{ (inputs.mode == 'apply' || inputs.mode == 'more') && format('read-{0}', github.run_id) || 'sre-watch-state' }}
  cancel-in-progress: false

env:
  MODE: ${{ inputs.mode || 'scheduled' }}
  NOTION_APPLICATIONS_DB: f56b68942d3b43cbb85a7b1ebfe2df1b

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Cache entries are immutable, so each run saves a new key and the next
      # run restores the most recent one by prefix.
      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: |
            data/canonical.sqlite
            data/jobs.sqlite
          key: sre-watch-db-${{ github.run_id }}
          restore-keys: sre-watch-db-
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Discover Swiss software employers
        if: env.MODE == 'scheduled' || env.MODE == 'run'
        run: python discover.py --pages 2 --max-companies 80
      - name: Generate canonical digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # AI stage 1 stays off until this repository variable names a model,
          # so no API credits are spent by accident.
          SRE_WATCH_ENRICH_MODEL: ${{ vars.SRE_WATCH_ENRICH_MODEL }}
          JOB: ${{ inputs.job }}
          PAGE: ${{ inputs.page }}
          SEED: ${{ inputs.seed }}
        run: |
          send=""
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then send="--send"; fi
          enrich=""
          if [ -n "$SRE_WATCH_ENRICH_MODEL" ] && { [ "$MODE" = scheduled ] || [ "$MODE" = run ]; }; then
            pip install --quiet -r requirements.txt
            enrich="--enrich-max 100"
          fi
          python daily.py $send --mode "$MODE" ${JOB:+--job "$JOB"} ${PAGE:+--page "$PAGE"} ${SEED:+--seed "$SEED"} $enrich
      - name: Report failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ SRE Watch ${MODE} run failed: ${RUN_URL}" > /dev/null
      - name: Save job database
        if: always() && env.MODE != 'apply' && env.MODE != 'more'
        uses: actions/cache/save@v4
        with:
          path: |
            data/canonical.sqlite
            data/jobs.sqlite
          key: sre-watch-db-${{ github.run_id }}
      - name: Upload daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sre-watch-${{ github.run_number }}
          path: |
            reports/
            data/canonical.sqlite
          if-no-files-found: warn
