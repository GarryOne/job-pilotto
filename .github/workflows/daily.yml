name: Daily job discovery
run-name: ${{ inputs.mode || 'scheduled' }}${{ inputs.job && format(' {0}', inputs.job) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scheduled sends only when new jobs exist; run and today always send; apply marks a job applied; prepare drafts its application kit; insight sends an insight now; weekly sends the weekly report now; interview analyses a transcript sent to the bot; add tracks an application made elsewhere'
        type: choice
        options: [scheduled, run, today, apply, more, prepare, insight, weekly, interview, add]
        default: scheduled
      job:
        description: 'job code from /apply_<code> (apply and prepare modes), or a job URL (add mode)'
        required: false
      action:
        description: 'apply mode: applied, saved or dismissed'
        required: false
        default: applied
      page:
        description: 'page number from a Next button (more mode only)'
        required: false
      seed:
        description: 'ranking seed from a Next button (more mode only)'
        required: false
      file:
        description: 'interview mode: Telegram file id of the transcript'
        required: false
      note:
        description: 'interview mode: caption, or /interview <label> plus notes; add mode: application date'
        required: false
  schedule:
    # GitHub Actions schedules use UTC.
    - cron: '30 */4 * * *'

permissions:
  contents: read
  actions: write

# Runs share one SQLite state file; never let two overlap. Apply, more,
# prepare and insight runs only read it, so they get their own group and a queued run can't displace them.
concurrency:
  group: ${{ (inputs.mode == 'apply' || inputs.mode == 'more' || inputs.mode == 'prepare' || inputs.mode == 'insight' || inputs.mode == 'weekly' || inputs.mode == 'interview' || inputs.mode == 'add') && format('read-{0}', github.run_id) || 'job-pilotto-state' }}
  cancel-in-progress: false

env:
  MODE: ${{ inputs.mode || 'scheduled' }}
  NOTION_APPLICATIONS_DB: f56b68942d3b43cbb85a7b1ebfe2df1b

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Cache entries are immutable, so each run saves a new key and the next
      # run restores the most recent one by prefix. Changing the prefix starts from
      # an empty database (happened in the SRE Watch -> Job Pilotto rename); tracked
      # jobs still resolve through Notion (daily.tracked_job), but seen/new history
      # and scores restart.
      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.sqlite
          key: job-pilotto-db-${{ github.run_id }}
          restore-keys: job-pilotto-db-
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Discover Swiss software employers
        if: env.MODE == 'scheduled' || env.MODE == 'run'
        run: python -m src discover --pages 2 --max-companies 80
      - name: Generate canonical digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Google Jobs via SerpApi (one paid search per scheduled/run crawl); off while unset.
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          # AI stage 1 stays off until this repository variable names a model,
          # so no API credits are spent by accident.
          JOB_PILOTTO_ENRICH_MODEL: ${{ vars.JOB_PILOTTO_ENRICH_MODEL }}
          # AI stage 2 (fit scoring) is switched on the same way by its own variable.
          JOB_PILOTTO_SCORE_MODEL: ${{ vars.JOB_PILOTTO_SCORE_MODEL }}
          # Application kits run only when asked (📝 Prepare); optional model override.
          JOB_PILOTTO_KIT_MODEL: ${{ vars.JOB_PILOTTO_KIT_MODEL || 'claude-sonnet-5' }}
          # Your digest's display name; the tool's own name stays generic (Job Pilotto).
          DIGEST_BRAND_NAME: ${{ vars.DIGEST_BRAND_NAME }}
          # Auto-draft kits for the best new matches each run; 0/unset = off (📝 Prepare still works manually).
          JOB_PILOTTO_AUTO_KIT_MAX: ${{ vars.JOB_PILOTTO_AUTO_KIT_MAX }}
          JOB_PILOTTO_AUTO_KIT_MIN_SCORE: ${{ vars.JOB_PILOTTO_AUTO_KIT_MIN_SCORE }}
          # Daily insight (first scheduled run after 04:00 UTC); off until this names a model.
          JOB_PILOTTO_INSIGHT_MODEL: ${{ vars.JOB_PILOTTO_INSIGHT_MODEL }}
          # Lets apply/add runs start the Gmail check 5 minutes later (mail.yml).
          GITHUB_TOKEN: ${{ github.token }}
          # AI budget guard and the daily health check (optional Admin key: exact spend from Anthropic).
          JOB_PILOTTO_MONTHLY_BUDGET_USD: ${{ vars.JOB_PILOTTO_MONTHLY_BUDGET_USD }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          JOB_PILOTTO_GOOGLE_AUTH_AT: ${{ vars.JOB_PILOTTO_GOOGLE_AUTH_AT }}
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
          ACTION: ${{ inputs.action || 'applied' }}
          PAGE: ${{ inputs.page }}
          SEED: ${{ inputs.seed }}
          FILE: ${{ inputs.file }}
          NOTE: ${{ inputs.note }}
        run: |
          send=""
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then send="--send"; fi
          ai=""
          if [ -n "$JOB_PILOTTO_ENRICH_MODEL$JOB_PILOTTO_SCORE_MODEL$JOB_PILOTTO_AUTO_KIT_MAX$JOB_PILOTTO_INSIGHT_MODEL" ] || [ "$MODE" = prepare ] || [ "$MODE" = insight ] || [ "$MODE" = weekly ] || [ "$MODE" = interview ]; then pip install --quiet -r requirements.txt; fi
          # Stage 1 runs before stage 2 in every mode that scores, so scores always see the facts.
          if [ -n "$JOB_PILOTTO_ENRICH_MODEL" ] && { [ "$MODE" = scheduled ] || [ "$MODE" = run ] || [ "$MODE" = today ]; }; then
            ai="$ai --enrich-max 100"
          fi
          if [ -n "$JOB_PILOTTO_SCORE_MODEL" ] && { [ "$MODE" = scheduled ] || [ "$MODE" = run ] || [ "$MODE" = today ]; }; then
            ai="$ai --score-max 60"
          fi
          if [ -n "$JOB_PILOTTO_AUTO_KIT_MAX" ] && { [ "$MODE" = scheduled ] || [ "$MODE" = run ] || [ "$MODE" = today ]; }; then
            ai="$ai --auto-kit-max $JOB_PILOTTO_AUTO_KIT_MAX ${JOB_PILOTTO_AUTO_KIT_MIN_SCORE:+--auto-kit-min-score $JOB_PILOTTO_AUTO_KIT_MIN_SCORE}"
          fi
          if [ -n "$JOB_PILOTTO_INSIGHT_MODEL" ] && [ "$MODE" = scheduled ]; then ai="$ai --insight"; fi
          python -m src daily $send --mode "$MODE" ${JOB:+--job "$JOB" --action "$ACTION"} ${PAGE:+--page "$PAGE"} ${SEED:+--seed "$SEED"} ${FILE:+--file "$FILE"} ${NOTE:+--note "$NOTE"} $ai
      - name: Report failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Job Pilotto ${MODE} run failed: ${RUN_URL}" > /dev/null
      - name: Save job database
        if: always() && env.MODE != 'apply' && env.MODE != 'more' && env.MODE != 'prepare' && env.MODE != 'insight' && env.MODE != 'weekly' && env.MODE != 'interview' && env.MODE != 'add'
        uses: actions/cache/save@v4
        with:
          path: data/jobs.sqlite
          key: job-pilotto-db-${{ github.run_id }}
      - name: Backup job database
        # Separate from the cache above: a cache entry can be evicted (GitHub prunes under
        # storage pressure or after ~7 days unused) without warning. An artifact isn't subject to
        # that — it just expires on its own fixed schedule — so this is real insurance against
        # losing jobs.sqlite between scheduled runs, not a duplicate of the cache step. The file
        # is a disposable crawl/scoring cache either way (see README) — nothing here is the
        # durable record; that's Notion.
        if: always() && env.MODE != 'apply' && env.MODE != 'more' && env.MODE != 'prepare' && env.MODE != 'insight' && env.MODE != 'weekly' && env.MODE != 'interview' && env.MODE != 'add'
        uses: actions/upload-artifact@v4
        with:
          name: job-pilotto-jobs-db
          path: data/jobs.sqlite
          retention-days: 90
          if-no-files-found: warn
      - name: Upload daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-pilotto-${{ github.run_number }}
          path: |
            reports/
            data/jobs.sqlite
          if-no-files-found: warn
