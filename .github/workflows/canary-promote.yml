name: Release · Canary auto-promote

# RETIRED as the release path (2 Oct 2026): the nightly pipeline promotes (e2e.yml: the build at 04:00 Zurich -> every e2e suite on its commit -> `promote`), with no 48 h wait.
# This workflow no longer runs on a schedule. By hand it still prints what the old canary rule would decide (tools/canary_promote.py, also used by the app's test-build trial
# and by tools/prune-releases.sh): make the newest pre-release stable once it has been out 48 h, CI is green, no new problem was reported for it, and app reports prove it was
# used and healthy (secret JOB_PILOTTO_TELEMETRY_KEY; missing → wait). With the repository variable JOB_PILOTTO_AUTO_PROMOTE `on` a manual non-dry run would still promote.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the decision'
        type: boolean
        default: true

permissions:
  contents: write   # gh release edit (promote)
  issues: read
  actions: read

concurrency:
  group: canary-promote   # not desktop-release: a waiting run there would replace a waiting build
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decide (and promote when switched on)
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_PILOTTO_TELEMETRY_KEY: ${{ secrets.JOB_PILOTTO_TELEMETRY_KEY }}
          SWITCH: ${{ vars.JOB_PILOTTO_AUTO_PROMOTE }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$SWITCH" != "on" ]; then
            args+=(--dry-run); note="Auto-promote is off (repository variable JOB_PILOTTO_AUTO_PROMOTE is not \`on\`): decision only."
          elif [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run); note="Dry run (manual start): decision only."
          else
            note="Auto-promote is on."
          fi
          status=0
          out=$(python3 tools/canary_promote.py "${args[@]}" 2>&1) || status=$?
          echo "$out"
          { echo "### Canary auto-promote"; echo; echo "$note"; echo; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
