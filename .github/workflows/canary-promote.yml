name: Release · Canary auto-promote

# Daily: make the newest pre-release stable once it has been out 48 h, CI is green on its commit and no new app
# problem (telemetry / fill-failure issue) was reported for it: tools/canary_promote.py, which then runs
# tools/release-stable.sh. Off until the owner sets the repository variable JOB_PILOTTO_AUTO_PROMOTE to `on`;
# while off (or with dry_run) it only writes the decision to the job summary.
on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the decision'
        type: boolean
        default: true

permissions:
  contents: write   # gh release edit (promote)
  issues: read
  actions: read

concurrency:
  group: canary-promote   # not desktop-release: a waiting run there would replace a waiting build
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decide (and promote when switched on)
        env:
          GH_TOKEN: ${{ github.token }}
          SWITCH: ${{ vars.JOB_PILOTTO_AUTO_PROMOTE }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$SWITCH" != "on" ]; then
            args+=(--dry-run); note="Auto-promote is off (repository variable JOB_PILOTTO_AUTO_PROMOTE is not \`on\`): decision only."
          elif [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run); note="Dry run (manual start): decision only."
          else
            note="Auto-promote is on."
          fi
          status=0
          out=$(python3 tools/canary_promote.py "${args[@]}" 2>&1) || status=$?
          echo "$out"
          { echo "### Canary auto-promote"; echo; echo "$note"; echo; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
