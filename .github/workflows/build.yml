name: CI · Tests

# Every test suite on every push to main (the backstop: red main, tools/red-main.sh; the release gates read this workflow's verdict on a commit). A pull request
# runs each area's workflow by itself, when GitHub's `paths:` says it changed (tests-python.yml, tests-worker.yml, tests-site.yml, tests-desktop.yml).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    uses: ./.github/workflows/tests-python.yml
  worker:
    uses: ./.github/workflows/tests-worker.yml
  site:
    uses: ./.github/workflows/tests-site.yml
  desktop:
    uses: ./.github/workflows/tests-desktop.yml
