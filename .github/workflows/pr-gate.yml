name: CI · Pull request
# The pure checks a change must pass before it merges (owner, 12 Oct 2026: landing through pull requests with auto-merge, tools/ship.sh). The suites are CI · Tests (build.yml) and the
# recorded-page replays (recorded-pages.yml), which also run on pull requests. Required on main: python, worker, site, desktop (both), the 4 replay shards, "pr gates", "flow-fresh", "harness tests 1", "harness tests 2", "cases fail before the fix" (tools/pr-settings.sh has the list).
# Every job here always starts (a required workflow that never starts blocks the PR forever); "cases fail before the fix" ends in seconds when the PR brings no recorded case.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: pr gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The same script the local push runs (tools/pre-push-check.sh, its fast pure checks): commit subjects, a fix names its test, file size, recorded cases (holes 1+2),
      # the rung trailer, e2e issue links, stale expectations. CI_GATES=1: no red-main look, no AI place check, no local-run proof of new e2e steps.
      - name: The fast pure checks
        run: |
          git fetch -q origin main
          jq -n --arg cwd "$PWD" '{tool_input: {command: "CI_GATES=1 git push origin pr"}, cwd: $cwd}' | bash tools/pre-push-check.sh

  # The e2e harness's own unit tests (owner, 12 Oct 2026): they ran only in the scheduled e2e plan job, which broke silently for ~11 h (ERR_MODULE_NOT_FOUND
  # after 3394c2e) while every suite was skipped. Here they gate the change that would break them. The same steps as e2e.yml's plan job
  # (test/recorded-ci-deps.test.mjs checks every job that runs them installs the app's own packages).
  harness:
    name: harness tests ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]   # the tests take ~105 s on one runner (one test alone is 48 s): two shards, each ~55 s; required as "harness tests 1" and "harness tests 2"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # the merge commit and the main it merges into: what this pull request changes
      # A pull request runs this job's steps only when it can break them (tools/ci-needed.sh: the push hook's pick, per job); the job always reports. A push to main runs everything.
      - id: needed
        name: Can this change break the harness tests?
        run: bash tools/ci-needed.sh harness
      - if: steps.needed.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - if: steps.needed.outputs.run == 'true'
        name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - if: steps.needed.outputs.run == 'true'
        name: Install the app's own packages
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
      - if: steps.needed.outputs.run == 'true'
        name: Stage the app's shared files
        working-directory: desktop
        run: node scripts/stage.mjs --files-only
      - if: steps.needed.outputs.run == 'true'
        name: A headless browser for the tests' own tests
        working-directory: desktop/e2e
        run: npx playwright install --with-deps chromium --only-shell
      - if: steps.needed.outputs.run == 'true'
        name: The tests' own tests (layout check, review parser, triage rules, which suites run)
        working-directory: desktop/e2e
        run: node --test --test-reporter=spec --test-shard=${{ matrix.shard }}/2 ${{ steps.needed.outputs.tests || 'test/*.test.mjs' }}   # only the tests this PR can break, when the pick names them (tools/ci-needed.sh)   # the flags go before the files (npm test -- <flags> puts them after, where node ignores them)

  flow-fresh:
    name: flow-fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The open PR is the claim on the applying flow's files (tools/flow-fresh.mjs): red when main changed, since this PR's base, a flow file it also changes.
      # tools/ship.sh rebases and pushes again by itself on this failure.
      - name: Main has not changed a flow file this change also changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          node tools/flow-fresh.mjs --base origin/main --head "${{ github.event.pull_request.head.sha }}" --others

  cases-fail-before-fix:
    # Was "hole 3" (renamed 12 Oct 2026, owner: "a better name"): every recorded case this PR adds or changes must FAIL on the PR's base (and pass on its head: the replay shards).
    name: cases fail before the fix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the PR head, not the merge commit
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Decide first, from git alone (seconds): a PR that brings no case installs and replays nothing (12 Oct 2026: #501's label-only edit to 74 cases took 503 s here).
      # A case.json edit to label keys only is no case (tools/recorded-cases.mjs LABEL_KEYS); a "Recorded-pins" case is not replayed; a refused pin fails here at once.
      - name: Which recorded cases this PR brings
        id: which
        run: |
          git fetch -q origin main
          cases="$(node tools/recorded-fails-on-old.mjs --base origin/main --list)"
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
          if [ -z "$cases" ]; then echo "cases fail before the fix: this PR brings no recorded case: nothing to replay"; else echo "to replay on the old code: $cases"; fi
      - name: A browser for the replay
        if: steps.which.outputs.cases != ''
        run: |
          (cd desktop/e2e && npm ci)
          (cd desktop && npm ci --omit=dev --ignore-scripts)
          (cd desktop/e2e && npx playwright install --with-deps chromium)   # full Chromium: the replay loads the real extension
      - name: Each fails on the code before the fix
        if: steps.which.outputs.cases != ''
        env:
          JOB_PILOTTO_HEAVY: '0'   # the Mac's one-at-a-time lock means nothing on a runner of its own
        run: node tools/recorded-fails-on-old.mjs --base origin/main
