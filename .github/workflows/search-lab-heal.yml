name: CI · Lab Job Search · heal stale tapes
# The Lab's automatic heal (owner, 18 Oct 2026, sketch https://claude.ai/artifact/RUbTJRzDbwKoKPrUZNu3vC): once a day, an offline replay of every tape ($0) finds the first one that no longer covers the build (a search
# change asks for requests nobody recorded); that one candidate is recorded again live on the API engine (its OWN key LAB_HEAL_ANTHROPIC_KEY in the Tests org, own workspace and cap), and the new tape replaces the old one
# ONLY when two offline replays of it agree and are not stale ("keep the old green until 2 replays agree"). Capped at 6 heals a week (about $0.92 each, measured: under the owner's $6 a week).
# Starts OFF: the scheduled run does nothing until the repository variable LAB_HEAL_ON is "true". By hand with a candidate: heals that one regardless of the cap. Never on a PR.
# PARKED for good (owner, 19 Oct 2026: the check is real users' results + Random draws): no schedule, by hand only.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Candidate to record again (driver, music, finance, sre, cluj, chisinau); empty = the first stale one, within the weekly cap'
        type: string
        default: ''
      ref:
        description: 'Branch or commit whose search code is recorded and replayed (empty = main). A proof of a search change before it merges.'
        type: string
        default: ''
      publish:
        description: 'Publish the new tape when two replays agree (untick to only prove it: record, check, no publish)'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # reads the week's earlier heals, starts the replay that posts the healed numbers

concurrency:   # scheduled or by hand: its own group per run, never cancelled (tests/test_main_runs_finish.py)
  group: search-lab-heal-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pick:
    if: github.event_name == 'workflow_dispatch' || vars.LAB_HEAL_ON == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # the six replays run together, a tape on the API engine at its recorded pace
    outputs:
      candidate: ${{ steps.choose.outputs.candidate }}
    env:
      GH_TOKEN: ${{ github.token }}
      NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm ci && node scripts/stage.mjs
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old read token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: job-pilotto-internal
      - name: Which tape no longer covers this build (offline replays, no AI)
        id: choose
        env:
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}
          ASKED: ${{ inputs.candidate }}
        run: |
          set -o pipefail
          if [ -n "$ASKED" ]; then echo "candidate=$ASKED" >> "$GITHUB_OUTPUT"; echo "heal-pick: asked by hand for $ASKED"
          else node tools/persona-search/heal.mjs pick 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; fi

  heal:
    needs: pick
    if: needs.pick.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 75   # the recording (a search stops by itself at its own time budget) and then two replays at the recorded pace, together
    env:
      GH_TOKEN: ${{ github.token }}
      NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
      CANDIDATE: ${{ needs.pick.outputs.candidate }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm ci && node scripts/stage.mjs
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old read token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: job-pilotto-internal
      - name: The candidate's CV and its current tape (for the draft only)
        env:
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}
        run: |
          python3 tools/persona-search/personas.py "$RUNNER_TEMP/out"
          node tools/persona-search/tape-store.mjs fetch "$CANDIDATE" "$RUNNER_TEMP/old"
      - name: Search live, record the new tape (API engine, one press)
        env:
          LAB_HEAL_ANTHROPIC_KEY: ${{ secrets.LAB_HEAL_ANTHROPIC_KEY }}
        run: |
          set -o pipefail
          node tools/persona-search/run.mjs "$CANDIDATE" "$RUNNER_TEMP/out" --presses 1 --tag heal --fresh --engine api --draft "$RUNNER_TEMP/old/draft.json" --tape "$RUNNER_TEMP/new" --record 2>&1 | tee "$RUNNER_TEMP/heal.log"
      - name: What it used (AI calls and tokens, web pages)
        if: always()
        run: |
          set -o pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          folder = os.path.join(os.environ['RUNNER_TEMP'], 'new')
          rows = [json.loads(line) for line in open(os.path.join(folder, 'ai.jsonl'))] if os.path.exists(os.path.join(folder, 'ai.jsonl')) else []
          total = {}
          for row in rows:
              for key, value in (row.get('usage') or {}).items():
                  if isinstance(value, int): total[key] = total.get(key, 0) + value
          web = sum(1 for _ in open(os.path.join(folder, 'web.jsonl'))) if os.path.exists(os.path.join(folder, 'web.jsonl')) else 0
          print(f"heal {os.environ['CANDIDATE']}: {len(rows)} AI calls, tokens {total}, {web} web pages")
          PY
      - name: Keep the old tape unless two replays of the new one agree
        env:
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}
        run: |
          set -o pipefail   # a failed verify must stop the job: the next step publishes
          cp "$RUNNER_TEMP/old/draft.json" "$RUNNER_TEMP/new/draft.json"
          echo '{"engine": "api", "wait_scale": 1}' > "$RUNNER_TEMP/new/replay.json"   # how every replay of this tape runs (tools/persona-search/run.mjs): its own engine, the recorded pace
          mkdir -p "$RUNNER_TEMP/verify"
          node tools/persona-search/heal.mjs verify "$CANDIDATE" "$RUNNER_TEMP/new" "$RUNNER_TEMP/verify" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the new tape (it is then the newest of that candidate)
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_WRITE_TOKEN }}
        run: node tools/persona-search/tape-store.mjs publish "$CANDIDATE" "$RUNNER_TEMP/new" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Replay it now, so the Lab page shows the healed row
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: gh workflow run search-lab.yml --ref main
      - name: Keep a failed heal's tape for debugging (encrypted, on the private repo, the newest 5)
        if: failure()
        continue-on-error: true   # a tape that was never recorded has nothing to keep
        env:
          GH_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_WRITE_TOKEN }}
        run: node tools/persona-search/tape-store.mjs publish-debug "$CANDIDATE" "$RUNNER_TEMP/new" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
