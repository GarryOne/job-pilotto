name: CI · UI verdicts

# THE VERDICT PASS, in parallel. After every filing of the UI loop (ui-findings.yml), up to five one-off findings (seen on one build, not yet judged) are
# read by Claude, one job each, read-only: it opens the code and the screenshot and answers real / false-positive / needs-human. A real one is labelled
# `confirmed` (the fixer takes it next), a false positive is closed `wontfix-auto`, the rest `needs-human`. Why: the fixer judged one finding per run, so a run
# that filed a dozen took days to sort (4 Oct 2026). Only with the repo variable JOB_PILOTTO_FIXER_VERDICTS = "on" (it spends AI credit).
on:
  workflow_run:
    workflows: ['CI · UI findings']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ui-verdict
  cancel-in-progress: false

jobs:
  pick:
    if: vars.JOB_PILOTTO_FIXER_VERDICTS == 'on'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The one-off findings to judge (none while the AI limit is reached)
        id: list
        run: |
          node desktop/e2e/ai-budget.mjs --check
          if grep -q '^skip=true' "$GITHUB_OUTPUT"; then echo "count=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          node desktop/e2e/pick.mjs --out .heal --verdict-list 5

  judge:
    needs: pick
    if: needs.pick.outputs.count != '0' && needs.pick.outputs.count != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.pick.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ matrix.issue }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The finding and its screenshot
        run: |
          node desktop/e2e/reversals.mjs --out .heal/lessons.md   # the owner's corrections, appended to the prompt
          node desktop/e2e/pick.mjs --out .heal --issue "$NUMBER"
          shot=$(jq -r '.screenshot // ""' .heal/candidate.json)
          if [ -n "$shot" ]; then curl -fsSL -o .heal/screenshot.png "$shot" || echo "screenshot not downloaded"; fi
      - name: Claude judges it (read-only)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 25
            --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(git show:*)"
          prompt: Read .heal/prompt.md and follow it exactly. Write only .heal/verdict.md.
      - name: AI budget and cost of this run
        if: always()
        run: node desktop/e2e/ai-budget.mjs --after /home/runner/work/_temp/claude-execution-output.json --job "verdict of issue $NUMBER"
      - name: Report the AI cost to /ai-cost
        if: always()
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: node desktop/e2e/ai-cost-report.mjs --job ui-verdict --execution /home/runner/work/_temp/claude-execution-output.json --suffix "${{ matrix.issue }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-cost-verdict-${{ matrix.issue }}
          path: ${{ runner.temp }}/ai-cost.json
          if-no-files-found: ignore
      - name: Apply the verdict
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          # The comment: banner, why, evidence, next step (desktop/e2e/lib/verdict-comment.mjs). Its first line is a hidden marker the loop reads back.
          node desktop/e2e/verdict-comment.mjs --file .heal/verdict.md --number "$NUMBER" --out .heal/comment.md
          # After the check: a `real` that cites code which does not exist has become `needs-human` in the file.
          verdict=$(head -1 .heal/verdict.md 2>/dev/null | tr -d '[:space:]' || true)
          # The judge's level replaces the detector's (desktop/e2e/lib/severity.mjs): a real or parked finding keeps the level a person would meet.
          case "$verdict" in real|needs-human) node desktop/e2e/severity.mjs --file .heal/verdict.md --number "$NUMBER" --repo "$REPO" >> "$GITHUB_STEP_SUMMARY" || true ;; esac
          case "$verdict" in
            real)
              gh label create confirmed --repo "$REPO" --force --color 0E8A16 --description 'A person or the verdict pass says this is real: ready to fix'
              gh issue edit "$NUMBER" --repo "$REPO" --add-label confirmed
              gh issue comment "$NUMBER" --repo "$REPO" --body-file .heal/comment.md ;;
            false-positive)
              gh label create wontfix-auto --repo "$REPO" --force --color CCCCCC --description 'A false positive of the UI loop: never retried'
              gh issue edit "$NUMBER" --repo "$REPO" --add-label wontfix-auto
              resolution=$(node desktop/e2e/resolution.mjs --file .heal/verdict.md || true)
              if [ -n "$resolution" ]; then gh label create "$resolution" --repo "$REPO" --force --color F9D0C4 --description 'Why this issue was closed (desktop/e2e/lib/resolution.mjs)'; gh issue edit "$NUMBER" --repo "$REPO" --add-label "$resolution"; fi
              gh issue close "$NUMBER" --repo "$REPO" --reason "not planned" --comment "$(cat .heal/comment.md)" ;;
            harness)
              gh label create harness --repo "$REPO" --force --color BFD4F2 --description 'The test was wrong, not the product: the Finder self-review fixes the test'
              gh issue edit "$NUMBER" --repo "$REPO" --add-label harness --add-label wontfix-auto
              resolution=$(node desktop/e2e/resolution.mjs --file .heal/verdict.md || true)
              if [ -n "$resolution" ]; then gh label create "$resolution" --repo "$REPO" --force --color F9D0C4 --description 'Why this issue was closed (desktop/e2e/lib/resolution.mjs)'; gh issue edit "$NUMBER" --repo "$REPO" --add-label "$resolution"; fi
              gh issue close "$NUMBER" --repo "$REPO" --reason "not planned" --comment "$(cat .heal/comment.md)" ;;
            *)
              gh label create needs-human --repo "$REPO" --force --color D93F0B --description 'The UI loop could not fix this by itself'
              gh issue edit "$NUMBER" --repo "$REPO" --add-label needs-human
              gh issue comment "$NUMBER" --repo "$REPO" --body-file .heal/comment.md ;;
          esac
          echo "#$NUMBER: ${verdict:-none}" >> "$GITHUB_STEP_SUMMARY"
