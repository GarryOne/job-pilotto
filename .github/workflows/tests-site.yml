name: CI · Tests · site
# On a pull request, GitHub's `paths:` below decides whether it runs (owner, 14 Oct 2026: "drop your shared pick logic, rely fully on gh workflow paths"). Not a required
# check: a workflow `paths:` skips never reports, and a required one would block the PR (tests/test_workflow_paths.py). On main, build.yml (CI · Tests) calls it on
# every push: the backstop for a break from outside these paths.
on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/check.sh'
      - 'tools/check.py'
      # Files outside site/ that its tests read (tests/test_workflow_paths.py fails when one is missing).
      - '.github/workflows/site.yml'
      - 'extension/alias-schema.js'
      - 'extension/ladder/**'
      - 'extension/tab-pages.js'
      - 'desktop/lib/ladder/**'
      - 'extension/recipe-schema.js'
      - 'extension/fill-meaning.js'
      - 'src/ai/providers/anthropic_api.py'
      - 'tools/applying-page-copy.mjs'
      - 'tools/e2e-intel.mjs'
      - 'tools/fixer-brief.mjs'
      - 'tools/needs-fix-causes.mjs'
      - 'tools/needs-fix-order.mjs'
      - '.github/workflows/tests-site.yml'

permissions:
  contents: read

concurrency:   # a PR's newer push replaces its older run and frees its runners; each commit of main keeps its own run (tests/test_main_runs_finish.py, tests/test_pr_runs_cancel.py)
  group: tests-site-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: site
      - run: bash tools/check.sh --area site
