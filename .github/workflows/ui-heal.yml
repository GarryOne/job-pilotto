name: CI · UI self-healing loop

# After each scheduled end-to-end run (e2e.yml, after the nightly build and on its three daytime runs): file what it found as issues (one per problem), and when a problem has been seen in two runs
# and a UI fix can address it, let Claude Code fix ONE of them and open a pull request for the owner to review. Never merges anything.
# Claude only edits files (no git, no gh, no network); the last step checks the paths (desktop/renderer and its tests only), requires a test,
# runs the whole desktop suite, and only then pushes a branch `auto-fix/<fingerprint>` and opens the PR. A false positive is closed with
# the label `wontfix-auto` so it never comes back. At most 3 automatic PRs may be open at once.
# Needs: ANTHROPIC_API_KEY (the same repository secret as the weekly self-review).
on:
  workflow_run:
    workflows: ['CI · End-to-end journey']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'An e2e run id whose artifacts to triage'
        required: false
      plant:
        description: 'DRY RUN, only on a branch other than main: a ui-findings.json array to triage instead of a real run (see desktop/e2e/README.md)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ui-heal
  cancel-in-progress: false

jobs:
  heal:
    # Scheduled or by hand only; a push-triggered e2e run (a change to the tests themselves) is not evidence about the product.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, inputs.run_id || github.run_id) }}
      PLANT: ${{ inputs.plant }}
      BASE: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the run's screenshots and findings (or plant one, for a dry run)
        run: |
          mkdir -p e2e-artifacts
          if [ -n "$PLANT" ]; then
            if [ "$GITHUB_REF" = refs/heads/main ]; then echo "A planted finding is only allowed off main." >&2; exit 1; fi
            printf '%s' "$PLANT" > e2e-artifacts/ui-findings.json
            echo "DRY RUN on $BASE: triaging a planted finding." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$REPO" --pattern 'e2e-artifacts-*' --dir e2e-artifacts || echo "No artifacts for run $RUN_ID"   # one folder per suite
          fi
      - name: File the findings, pick one that is ready
        id: triage
        run: |
          mkdir -p .heal
          node desktop/e2e/triage.mjs --artifacts e2e-artifacts --run-url "$RUN_URL" --out .heal
      - name: Not too many open automatic fixes
        id: capacity
        if: steps.triage.outputs.candidate != 'none'
        run: |
          open=$(gh pr list --repo "$REPO" --state open --label auto-ui-fix --json number --jq length)
          echo "Open automatic fixes: $open"
          if [ "$open" -ge 3 ]; then echo "full=true" >> "$GITHUB_OUTPUT"; echo "Three automatic fixes already wait for review; not starting another." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Put the screenshot next to the finding
        if: steps.triage.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        run: |
          view=$(jq -r '.title' .heal/candidate.json | sed -E 's/^\[auto-ui\] ([a-z0-9-]+):.*/\1/')
          shot=$(find e2e-artifacts -name "ui-$view.png" | head -1)
          if [ -n "$shot" ]; then cp "$shot" .heal/screenshot.png; else echo "no screenshot for $view"; fi
      - name: Install the app's dependencies (for its tests)
        if: steps.triage.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        working-directory: desktop
        run: npm ci
      - name: Claude Code fixes the problem (files only)
        if: steps.triage.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Least privilege: read and edit files, run the desktop tests, read-only git. No push, no gh, no network.
          claude_args: >-
            --model claude-sonnet-5 --max-turns 50
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(node --test:*),Bash(git diff:*),Bash(git status:*)"
          prompt: Read .heal/prompt.md and follow it exactly.
      - name: Keep Claude's transcript (to see where its turns went)
        if: always() && steps.triage.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: heal-transcript
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
      - name: Check the change, run the tests, open the pull request
        if: always() && steps.triage.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        run: |
          set -euo pipefail
          # The labels the branches below use (a first run finds none).
          gh label create needs-human --repo "$REPO" --force --color D93F0B --description 'The UI loop could not fix this by itself'
          gh label create wontfix-auto --repo "$REPO" --force --color CCCCCC --description 'A false positive of the UI loop: never retried'
          number=$(jq -r '.number' .heal/candidate.json)
          id=$(jq -r '.id' .heal/candidate.json)
          changed=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -v -E '^(\.heal/|e2e-artifacts/)' || true)
          if [ -z "$changed" ]; then
            verdict=$(head -1 .heal/verdict.md 2>/dev/null | tr -d '[:space:]' || true)
            reason=$(sed -n '2,$p' .heal/verdict.md 2>/dev/null | head -3 || true)
            case "$verdict" in
              false-positive)
                gh issue edit "$number" --repo "$REPO" --add-label wontfix-auto
                gh issue close "$number" --repo "$REPO" --comment "Closed by the UI loop as a false positive: $reason"
                echo "Issue #$number closed as a false positive." >> "$GITHUB_STEP_SUMMARY" ;;
              *)
                gh issue edit "$number" --repo "$REPO" --add-label needs-human
                gh issue comment "$number" --repo "$REPO" --body "The UI loop could not fix this by itself. ${reason:-Claude made no change.}"
                echo "Issue #$number needs a person." >> "$GITHUB_STEP_SUMMARY" ;;
            esac
            exit 0
          fi
          if ! echo "$changed" | node desktop/e2e/check-change.mjs; then
            gh issue edit "$number" --repo "$REPO" --add-label needs-human
            gh issue comment "$number" --repo "$REPO" --body "The proposed change was refused by the guard (it touched files a UI fix may not touch, or had no test), so nothing was opened. See the run: $RUN_URL"
            exit 1
          fi
          if ! (cd desktop && npm test); then
            gh issue comment "$number" --repo "$REPO" --body "A fix was tried, but the desktop tests failed, so no pull request was opened. See the run: $RUN_URL"
            exit 1
          fi
          title=$(head -1 .heal/pr-body.md 2>/dev/null || echo "UI fix for #$number")
          { sed -n '2,$p' .heal/pr-body.md 2>/dev/null || true; echo; echo "Fixes #$number"; echo
            echo "Opened by the UI loop (after each scheduled end-to-end run) after the problem was seen in two end-to-end runs. Review it like any change; it never merges itself."; } > .heal/body.md
          branch="auto-fix/$id"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          echo "$changed" | xargs git add --
          git commit -q -m "$title" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>"
          git push -q origin "$branch"
          gh label create auto-ui-fix --repo "$REPO" --force --color 0E8A16 --description 'A fix proposed by the UI loop'
          extra=""
          if [ "$BASE" != main ]; then gh label create dry-run --repo "$REPO" --force --color FBCA04 --description 'A dry run of the UI loop: close it'; extra="--label dry-run"; fi
          # shellcheck disable=SC2086
          url=$(gh pr create --repo "$REPO" --base "$BASE" --head "$branch" --title "$title" --body-file .heal/body.md --label auto-ui-fix $extra)
          echo "Pull request opened: $url" >> "$GITHUB_STEP_SUMMARY"
