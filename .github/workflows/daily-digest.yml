name: CI · Daily build digest
# "What we built today" (spec docs/superpowers/specs/2026-10-16-daily-digest.md): every hour tools/daily-digest.mjs asks the site what it holds for the Zurich day, and only when PRs were merged since
# (at most once an hour, 8 drafts a day) has Haiku regroup them; the draft shows on https://www.jobpilotto.top/admin/operations/build-log. From 23:00 Zurich (and just after midnight for the day before) the final one is stored.
# The hourly schedule is DST-proof: the script reads the Zurich hour itself. The AI key is the Self-heal workspace's (DIGEST_ANTHROPIC_KEY, no fallback); the spend is reported to /admin/ai-cost as job daily-digest.
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      rewrite_days:
        description: 'Days (YYYY-MM-DD, space separated) to write again in the current form; closed days are replaced, nothing is posted'
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: daily-digest-${{ github.run_id }}   # a run of its own (tests/test_workflow_contract.py); the site keeps one row a day, so a repeat is harmless
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DIGEST_ANTHROPIC_KEY: ${{ secrets.DIGEST_ANTHROPIC_KEY }}
      SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
      BUILDLOG_TELEGRAM_TOKEN: ${{ secrets.BUILDLOG_TELEGRAM_TOKEN }}   # the Build Log bot (its own bot and chat); missing: the digest is stored, the post is skipped with a line
      BUILDLOG_TELEGRAM_CHAT: ${{ secrets.BUILDLOG_TELEGRAM_CHAT }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tools
            site/src
            desktop/e2e/ai-cost-report.mjs
            desktop/e2e/ai-budget.mjs
            desktop/e2e/lib/vision.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Write the day's digest and store it
        run: node tools/daily-digest.mjs --out "$RUNNER_TEMP/digest.json" --cost "$RUNNER_TEMP/cost.json"
      - name: Write closed days again (by hand only)
        if: github.event_name == 'workflow_dispatch' && inputs.rewrite_days != ''
        env:
          REWRITE_DAYS: ${{ inputs.rewrite_days }}
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: |
          for day in $REWRITE_DAYS; do
            node tools/daily-digest.mjs --day "$day" --force --final --rewrite --cost "$RUNNER_TEMP/cost-$day.json"
            node desktop/e2e/ai-cost-report.mjs --job daily-digest --file "$RUNNER_TEMP/cost-$day.json"
          done
      - name: Report the AI cost
        if: always()
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: if [ -s "$RUNNER_TEMP/cost.json" ]; then node desktop/e2e/ai-cost-report.mjs --job daily-digest --file "$RUNNER_TEMP/cost.json"; else echo "no AI call this run"; fi
