name: CI · End-to-end journey

# Five suites run at the same time, each from its own state in its own Notion test page (desktop/e2e/README.md): wizard (the first-run path from nothing),
# jobs (Actions, Recent activity, jobs check, slow AI), interviews, settings, apply (the real Chrome extension on fixture forms). The last four start from a set-up install in seconds, not through the wizard.
# Before: one journey, ~4 minutes, all in one Notion page.
# Playwright drives the real Electron app on a macOS runner (desktop/e2e/README.md). Runs by hand, every 4 hours on main, and
# before a build is promoted to stable (tools/release-stable.sh asks for a green run of the same commit).
# Secrets (Settings → Secrets → Actions): E2E_ANTHROPIC_KEY (a key with a small spend cap), E2E_NOTION_TOKEN (a Notion
# connection that can only see the empty "Job Pilotto E2E" test page). Without them only the offline steps run.
on:
  workflow_dispatch:
  schedule:
    - cron: '47 */4 * * *'   # every 4 hours (the UI loop, ui-heal.yml, follows each run)
  push:
    branches: [main]
    paths:
      - 'desktop/e2e/**'
      - 'extension/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: The suites that exist (every file in desktop/e2e/suites)
        id: list
        working-directory: desktop/e2e
        run: echo "matrix=$(node suite.mjs --list)" >> "$GITHUB_OUTPUT"
  suite:
    name: ${{ matrix.suite }}
    needs: plan
    runs-on: macos-latest   # the Mac app is the product: real Keychain, no virtual display (on Linux Electron has no keyring to save the key in)
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false      # one suite failing must not hide what the others found
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    concurrency:
      group: e2e-${{ matrix.suite }}   # a suite never overlaps itself (it owns one Notion page); different suites run together
      cancel-in-progress: false
    env:
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
      E2E_NOTION_TOKEN: ${{ secrets.E2E_NOTION_TOKEN }}
      E2E_NOTION_TOKEN_JOBS: ${{ secrets.E2E_NOTION_TOKEN_JOBS }}
      E2E_NOTION_TOKEN_INTERVIEWS: ${{ secrets.E2E_NOTION_TOKEN_INTERVIEWS }}
      E2E_NOTION_TOKEN_SETTINGS: ${{ secrets.E2E_NOTION_TOKEN_SETTINGS }}
      E2E_NOTION_TOKEN_PERSONAS: ${{ secrets.E2E_NOTION_TOKEN_PERSONAS }}
      E2E_NOTION_TOKEN_EMPLOYERS: ${{ secrets.E2E_NOTION_TOKEN_EMPLOYERS }}
      E2E_NOTION_TOKEN_CALENDAR: ${{ secrets.E2E_NOTION_TOKEN_CALENDAR }}
      E2E_NOTION_TOKEN_FOCUS: ${{ secrets.E2E_NOTION_TOKEN_FOCUS }}
      E2E_NOTION_TOKEN_APPLY: ${{ secrets.E2E_NOTION_TOKEN_APPLY }}
      E2E_NOTION_TOKEN_ACTIVITY: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITY }}
      E2E_NOTION_TOKEN_STRATEGY: ${{ secrets.E2E_NOTION_TOKEN_STRATEGY }}
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts/${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Chromium for the extension (the apply suite loads the real Chrome extension in it)
        if: matrix.suite == 'apply'
        working-directory: desktop/e2e
        run: npx playwright-core install chromium
      - name: Python packages the engine needs
        run: pip install --quiet -r requirements.txt
      - name: Run the ${{ matrix.suite }} suite
        working-directory: desktop/e2e
        timeout-minutes: 25   # a hung suite stops here, not after the job's limit
        run: node suite.mjs ${{ matrix.suite }}
      - name: AI review of the screenshots
        if: always() && env.E2E_ANTHROPIC_KEY != ''
        working-directory: desktop/e2e
        timeout-minutes: 10
        run: node review-ui.mjs
      - name: The tests' own tests (layout check, review parser, triage rules)
        if: always() && matrix.suite == 'wizard'
        working-directory: desktop/e2e
        run: npm test
      - name: Screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.suite }}
          path: e2e-artifacts/${{ matrix.suite }}
          if-no-files-found: ignore
