name: CI · End-to-end on Mac + Linux

# The real Job Pilotto app, driven by Playwright on a macOS runner, one suite per Notion test page (desktop/e2e/README.md). It does two jobs, on two clocks:
#  1. RELEASE GATE. (With the repository variable JOB_PILOTTO_SOAK = on the gate only APPROVES the build for beta testers; canary-promote.yml then soaks it and promotes.) The nightly build (desktop.yml, 04:00 Zurich, only when the app changed) finishes -> this workflow runs EVERY suite on that build's own commit ->
#     when all pass (and build.yml is green on the commit) the `promote` job makes the build the stable release. Red or no build: nothing is promoted.
#  2. IMPROVEMENT LOOP. Three runs on main in the working day (09:47, 13:47, 17:47 UTC) feed ui-findings.yml (issues; ui-fix.yml turns the most critical into a pull request once a day). A scheduled run
#     goes ahead on a new commit; on an unchanged one it takes a second and a third look (each a different seeded path, lib/variation.mjs) and then stops until the next commit:
#     at most 3 runs per commit (lib/plan.mjs exploreDecision), so a busy day costs the schedule (3 runs) and an idle weekend 3 runs in all. A look at an unchanged commit runs ONLY the suites that
#     walk a different path each time (`export const varies`, today `interactions`, `apply` and `wander`): the others would repeat themselves.
#     The AI review of screenshots (the costly part) runs when the UI or its tests changed, a finding waits, or the run is exploring. A push to main runs NO e2e (decided: e2e never runs on commit); by hand: gh workflow run e2e.yml -f suite=jobs,activity.
# All of it is decided in desktop/e2e/plan-run.mjs (tested). The test key's AI credit is shared and small: see desktop/e2e/README.md.
# Secrets (Settings → Secrets → Actions): E2E_ANTHROPIC_KEY, and one E2E_NOTION_TOKEN_<SUITE> per suite (a connection that sees only that suite's test page).
run-name: ${{ inputs.mutant && format('Mutant {0}', inputs.mutant) || inputs.canary && format('Stable canary {0}', inputs.target_ref) || inputs.soak && format('RC soak {0}', inputs.target_ref) || inputs.gate_tag && format('Beta E2E tests {0}', inputs.gate_tag) || github.event_name == 'workflow_run' && format('Beta E2E tests {0}', github.event.workflow_run.head_sha) || '' }}   # empty = GitHub's default name. Both name the release they test: ui-findings.yml ignores 'Stable canary'; canary_promote.py counts 'RC soak <tag>' and 'Gate <sha>' (the release gate: GitHub gives a workflow_run its own commit as main's, so the tested one is in the name) for gate 4

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suites to run, comma-separated (empty = all)'
        required: false
      scheduled:
        description: 'Started on time by the Worker (worker/src/scheduler.js) in place of the three-a-day schedule: planned exactly as a schedule event, no paid AI judge'
        type: boolean
        default: false
      canary:
        description: 'The daily stable canary (stable-canary.yml): no paid AI judge, and ui-findings.yml files nothing from it'
        type: boolean
        default: false
      gate_tag:
        description: 'Run the full release gate for this pre-release tag by hand (a manual build is never gated by the nightly path): every suite on its commit, then approve it for beta (or promote it when the soak is off)'
        required: false
      target_ref:
        description: "Test this release tag's commit with THIS workflow file (the soak top-ups and the stable canary: an old tag's own workflow file does not know their inputs)"
        required: false
      soak:
        type: boolean
        default: false
        description: 'A top-up run on a release candidate (canary-promote.yml): no paid AI judge; its findings ARE filed, naming the build'
      promote_tag:
        description: 'DRY RUN of the promotion step for this release tag (runs no suite, promotes nothing)'
        required: false
      all_on_mac:
        description: 'Run every suite on macOS (as before 6 Oct 2026), to compare with the Linux runners'
        type: boolean
        default: false
      mutant:
        description: 'MUTATION TEST (mutation.yml): write this mutant of desktop/e2e/mutants.json into the app first, or "baseline". Fixed path, no AI review, nothing filed, no Windows run'
        required: false
  schedule:
    - cron: '47 9,13,17 * * *'   # 11:47, 15:47, 19:47 in Zurich in summer (the UI loop's producer, ui-findings.yml, follows each run)
  workflow_run:
    workflows: ['Release · Desktop app']   # the nightly build (or a manual one) finished: verify it, and promote it when it passes
    types: [completed]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
      ref: ${{ steps.list.outputs.ref }}
      tag: ${{ steps.list.outputs.tag }}
      review: ${{ steps.list.outputs.review }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: The tests' own tests (layout check, review parser, triage rules, which suites run)
        working-directory: desktop/e2e
        run: npm test
      - name: What to run (suites, commit, AI review, release to promote)
        id: list
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name == 'workflow_dispatch' && inputs.scheduled && 'schedule' || github.event_name }}   # the Worker's start is the schedule's own
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}   # its `build` job: skipped (nothing new) = nothing to gate
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}   # a build named Nightly build (the Worker, on time) or Beta build (a beta by hand) is gated; any other is for trying
          ONLY: ${{ inputs.suite }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
          TARGET_REF: ${{ inputs.target_ref || inputs.gate_tag }}
          GATE_TAG: ${{ inputs.gate_tag }}
        run: node plan-run.mjs 2>> "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
  suite:
    name: ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.count != '0'   # a push that changed no suite, a scheduled run with nothing new, or a night with no build: no suites
    runs-on: ${{ inputs.all_on_mac && 'macos-latest' || matrix.os || 'macos-latest' }}   # Linux unless the suite needs the Mac (lib/plan.mjs runnerOf); a virtual display there
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false      # one suite failing must not hide what the others found
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    concurrency:
      group: e2e-${{ matrix.suite }}   # a suite never overlaps itself (it owns one Notion page); different suites run together
      cancel-in-progress: false
    env:
      # A suite whose secrets are missing FAILS here instead of a green "skipped" (lib/skip.mjs). 6 Oct 2026: failuresnotion and failureschannels
      # had never run (no token) and showed ✓. Forks have no secrets: they still skip with a warning.
      E2E_REQUIRE_SECRETS: ${{ github.repository == 'GarryOne/job-pilotto' && '1' || '' }}
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
      E2E_NOTION_TOKEN: ${{ secrets.E2E_NOTION_TOKEN }}
      E2E_NOTION_TOKEN_FAILURESNOTION: ${{ secrets.E2E_NOTION_TOKEN_FAILURESNOTION }}
      E2E_NOTION_TOKEN_FAILURESCHANNELS: ${{ secrets.E2E_NOTION_TOKEN_FAILURESCHANNELS }}
      E2E_NOTION_TOKEN_JOBS: ${{ secrets.E2E_NOTION_TOKEN_JOBS }}
      E2E_NOTION_TOKEN_INTERVIEWS: ${{ secrets.E2E_NOTION_TOKEN_INTERVIEWS }}
      E2E_NOTION_TOKEN_SETTINGS: ${{ secrets.E2E_NOTION_TOKEN_SETTINGS }}
      E2E_NOTION_TOKEN_PERSONAS: ${{ secrets.E2E_NOTION_TOKEN_PERSONAS }}
      E2E_NOTION_TOKEN_EMPLOYERS: ${{ secrets.E2E_NOTION_TOKEN_EMPLOYERS }}
      E2E_NOTION_TOKEN_CALENDAR: ${{ secrets.E2E_NOTION_TOKEN_CALENDAR }}
      E2E_NOTION_TOKEN_FOCUS: ${{ secrets.E2E_NOTION_TOKEN_FOCUS }}
      E2E_NOTION_TOKEN_APPLY: ${{ secrets.E2E_NOTION_TOKEN_APPLY }}
      E2E_NOTION_TOKEN_APPLYCV: ${{ secrets.E2E_NOTION_TOKEN_APPLYCV }}
      E2E_NOTION_TOKEN_ACTIVITY: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITY }}
      E2E_NOTION_TOKEN_ACTIVITYFAILURES: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITYFAILURES }}
      E2E_NOTION_TOKEN_STRATEGY: ${{ secrets.E2E_NOTION_TOKEN_STRATEGY }}
      E2E_NOTION_TOKEN_QUALITY: ${{ secrets.E2E_NOTION_TOKEN_QUALITY }}
      E2E_NOTION_TOKEN_INTERACTIONS: ${{ secrets.E2E_NOTION_TOKEN_INTERACTIONS }}
      E2E_NOTION_TOKEN_WANDER: ${{ secrets.E2E_NOTION_TOKEN_WANDER }}
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts/${{ matrix.suite }}
      JOB_PILOTTO_E2E_EXPECTS_FAILURES: ${{ inputs.mutant && '1' || '' }}   # a mutant run breaks the app on purpose: its crash reports are tagged expected, so the Sentry loop ignores them
      E2E_SEED: ${{ (github.event_name == 'workflow_run' || inputs.canary || inputs.soak || inputs.gate_tag || inputs.mutant) && '0' || github.run_id }}   # a different path in every scheduled, top-up or manual run; the release gate, the soak top-ups (their three green runs must be comparable) and the stable canary walk the fixed one (lib/variation.mjs)
      E2E_FULL: ${{ (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && !inputs.canary && !inputs.soak && !inputs.mutant && !inputs.scheduled)) && '1' || '' }}   # the paid AI judge steps: the nightly gate and manual runs only
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}   # a push or a schedule: that commit; the run after a build: the build's own commit
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record which commit this run tested (ui-findings.yml names it in every issue)
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          printf '%s %s\n' "${{ inputs.target_ref || github.ref_name }}" "$(git rev-parse HEAD)" > "$E2E_ARTIFACTS/tested.txt"
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Chromium for the extension (the apply suite loads the real Chrome extension in it)
        if: matrix.suite == 'apply' || matrix.suite == 'applycv'
        working-directory: desktop/e2e
        run: npx playwright-core install chromium
      - name: Python packages the engine needs
        run: pip install --quiet -r requirements.txt
      - name: A virtual display and Electron's libraries (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libxss1 fonts-noto-color-emoji fonts-dejavu-core >/dev/null
      - name: Write the mutant into the app (mutation test only)
        if: inputs.mutant != '' && inputs.mutant != 'baseline'
        env:
          MUTANT: ${{ inputs.mutant }}
        run: node desktop/e2e/mutate.mjs "$MUTANT"
      - name: Run the ${{ matrix.suite }} suite
        id: suite_run
        working-directory: desktop/e2e
        timeout-minutes: 10   # the suite stops itself at its 7-minute budget (lib/runner.mjs) with its evidence; this catches only a suite that cannot
        run: |
          # A run on an older commit (target_ref: the stable canary, a release candidate) plans with main's suite list; a suite added since does not exist in that build.
          if [ ! -f "suites/${{ matrix.suite }}.mjs" ]; then echo "The ${{ matrix.suite }} suite does not exist in this build: skipped." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a --server-args='-screen 0 1440x900x24' node suite.mjs ${{ matrix.suite }}; else node suite.mjs ${{ matrix.suite }}; fi
      # Flaky or real? A red suite runs once more on the same commit (6 Oct 2026). The job stays red either way; a pass the second time writes flaky.json beside the
      # first run's artifacts, and triage labels those failed steps `flaky` (the test, not the product). Its own artifacts stay out of the upload: nothing is filed twice.
      - name: The ${{ matrix.suite }} suite once more, to tell flaky from real
        if: failure() && steps.suite_run.outcome == 'failure' && !inputs.mutant
        working-directory: desktop/e2e
        timeout-minutes: 10
        run: |
          first="$E2E_ARTIFACTS"
          export E2E_ARTIFACTS="${{ github.workspace }}/e2e-rerun/${{ matrix.suite }}"
          again() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a --server-args='-screen 0 1440x900x24' node suite.mjs "$1"; else node suite.mjs "$1"; fi; }
          if again ${{ matrix.suite }}; then
            echo '{"rerun": "passed"}' > "$first/flaky.json"
            echo "Passed on the second try: the failed steps are flaky (labelled by triage)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Failed again on the same commit: a real failure." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Earlier AI reviews (an unchanged screenshot is not asked again)
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.plan.outputs.review == '1' && inputs.mutant == ''
        uses: actions/cache/restore@v5
        with:
          path: desktop/e2e/.review-cache
          key: ai-review-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-review-${{ matrix.suite }}-
      - name: AI review of the screenshots
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.plan.outputs.review == '1' && inputs.mutant == ''   # the costly part: only when the UI or its tests changed, or a finding waits
        working-directory: desktop/e2e
        timeout-minutes: 15   # the batch waits up to 6 min, then asks what is left directly
        run: node review-ui.mjs
      # Its cost, as the other AI jobs leave theirs (ai-cost artifacts): /self-heal sums them (desktop/e2e/selfheal-stats.mjs). It was the one AI cost not summed.
      - name: The AI review's cost
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.plan.outputs.review == '1' && inputs.mutant == '' && hashFiles('e2e-artifacts/**/ai-review-usage.json') != ''
        run: |
          node -e 'const fs=require("fs"); const u=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); fs.writeFileSync(process.argv[2], JSON.stringify({job: "review", usd: Number(u.usd)||0, turns: Number(u.calls)||0, at: new Date().toISOString(), limit: false}))' "$E2E_ARTIFACTS/ai-review-usage.json" "$RUNNER_TEMP/ai-cost.json"
      - name: Reporting tools from main (a soak tests an older tag, whose code may predate them; the workflow's own tooling must match the workflow)
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.plan.outputs.review == '1' && inputs.mutant == ''
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tools-main
          sparse-checkout: desktop/e2e
      - name: Report the AI cost to /ai-cost
        continue-on-error: true   # a report never decides a run
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.plan.outputs.review == '1' && inputs.mutant == '' && hashFiles('e2e-artifacts/**/ai-review-usage.json') != ''
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: node tools-main/desktop/e2e/ai-cost-report.mjs --job e2e-screenshot-review --suffix "${{ matrix.suite }}" --file "$RUNNER_TEMP/ai-cost.json"
      - uses: actions/upload-artifact@v6
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.plan.outputs.review == '1' && inputs.mutant == '' && hashFiles('e2e-artifacts/**/ai-review-usage.json') != ''
        with:
          name: ai-cost-review-${{ matrix.suite }}
          path: ${{ runner.temp }}/ai-cost.json
          if-no-files-found: ignore
      - name: Keep the AI reviews for the next run
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.plan.outputs.review == '1' && inputs.mutant == '' && hashFiles('desktop/e2e/.review-cache/*.json') != ''
        uses: actions/cache/save@v5
        with:
          path: desktop/e2e/.review-cache
          key: ai-review-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Screenshots and timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-${{ matrix.suite }}
          path: e2e-artifacts/${{ matrix.suite }}
          if-no-files-found: ignore

  # The release gate. Only after the nightly build: every suite passed on the build's commit, and so did build.yml.
  promote:
    needs: [plan, suite]
    if: needs.plan.outputs.tag != '' && needs.suite.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # gh release edit (promote)
      actions: read
      issues: write     # block-check.mjs reads the UI-loop issues; tools/sync_release_labels.py rewrites the pinned Release channels issue (read-only failed it, 3 Oct 2026)
    concurrency:
      group: release-promote
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: No real high-severity finding in this run (layout check, or an AI finding already seen twice / confirmed)
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-artifacts-*' --dir ../../e2e-artifacts || echo "no artifacts to read"
          mkdir -p ../../e2e-artifacts
          status=0
          node block-check.mjs --artifacts ../../e2e-artifacts > block.txt || status=$?
          cat block.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then echo "$TAG stays a pre-release: a real high-severity finding in its end-to-end run." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - name: The Notion schema is additive over the current stable (so "Back to stable" cannot split anybody's data)
        if: vars.JOB_PILOTTO_SOAK == 'on'
        run: |
          stable=$(gh release list -R "$GITHUB_REPOSITORY" -L 20 --json tagName,isPrerelease,isDraft -q '[.[] | select(.isDraft | not) | select(.isPrerelease | not)][0].tagName')
          if [ -z "$stable" ] || [ "$stable" = "$TAG" ]; then echo "No older stable to compare with." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/contents/config/notion_schema.json?ref=$stable" -q .content | base64 -d > "$RUNNER_TEMP/stable-schema.json"
          gh api "repos/$GITHUB_REPOSITORY/contents/config/notion_schema.json?ref=$TAG" -q .content | base64 -d > "$RUNNER_TEMP/candidate-schema.json"
          status=0
          python3 tools/check_schema_additive.py "$RUNNER_TEMP/stable-schema.json" "$RUNNER_TEMP/candidate-schema.json" > "$RUNNER_TEMP/schema.txt" || status=$?
          echo "Schema $TAG vs stable $stable:" >> "$GITHUB_STEP_SUMMARY"; cat "$RUNNER_TEMP/schema.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then echo "$TAG is not offered to beta testers: it changes the Notion schema in a way the older app cannot undo." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - name: build.yml (the unit suites) is green on the commit
        run: |
          verdict=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --commit "$REF" --status completed --json conclusion | python3 tools/e2e_gate.py ci)
          echo "build.yml on ${REF:0:7}: $verdict"
          if [ "$verdict" != green ]; then echo "$TAG stays a pre-release: build.yml is not green on its commit." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - name: Approve the build for beta testers (soak on), or make it stable (soak off)
        env:
          E2E_ALREADY_GREEN: '1'   # every suite of this very run passed on this commit
          SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        run: |
          if [ "$SOAK" = on ]; then
            tools/beta-approve.sh "$TAG"
            echo "Beta-approved: $TAG (unit suites and every end-to-end suite passed on its commit). It becomes stable through canary-promote.yml: more end-to-end runs, no blocking finding, then healthy beta use." >> "$GITHUB_STEP_SUMMARY"
          else
            tools/release-stable.sh "$TAG"
            echo "Stable: $TAG (every suite passed on its commit)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # By hand: gh workflow run e2e.yml -f promote_tag=desktop-v0.5.3 : what the promotion step would do for a release, changing nothing.
  windows:
    # The same suites on Windows (e2e-windows.yml), started here only when this run tested something, so Windows never runs empty; it skips a commit it
    # has already tested. A canary, a soak or a promotion dry run is not repeated on Windows. Never a release gate.
    name: Windows follows
    needs: [plan, suite]
    if: always() && needs.plan.outputs.count != '0' && !inputs.canary && !inputs.soak && inputs.promote_tag == '' && inputs.mutant == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the Windows run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && !inputs.scheduled)) && '1' || '' }}
        run: |
          gh workflow run e2e-windows.yml --repo "${{ github.repository }}" --ref main \
            -f mac_run=${{ github.run_id }} -f sha=${{ needs.plan.outputs.ref }} -f review=${{ needs.plan.outputs.review }} -f full="$FULL"
          echo "Windows run started for commit ${{ needs.plan.outputs.ref }} (it skips a commit Windows already tested)." >> "$GITHUB_STEP_SUMMARY"

  promote-dry-run:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.promote_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: What the promotion would do
        env:
          E2E_ALREADY_GREEN: '1'
          DRY_RUN: '1'
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: tools/release-stable.sh "$PROMOTE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
