name: CI · End-to-end journey

# The real Job Pilotto app, driven by Playwright on a macOS runner, one suite per Notion test page (desktop/e2e/README.md). It does two jobs, on two clocks:
#  1. RELEASE GATE. (With the repository variable JOB_PILOTTO_SOAK = on the gate only APPROVES the build for beta testers; canary-promote.yml then soaks it and promotes.) The nightly build (desktop.yml, 04:00 Zurich, only when the app changed) finishes -> this workflow runs EVERY suite on that build's own commit ->
#     when all pass (and build.yml is green on the commit) the `promote` job makes the build the stable release. Red or no build: nothing is promoted.
#  2. IMPROVEMENT LOOP. Three runs on main in the working day (09:47, 13:47, 17:47 UTC) feed ui-findings.yml (issues; ui-fix.yml turns the most critical into a pull request once a day). A scheduled run is skipped when
#     main has not changed since the last run and no finding waits for its second sighting; the AI review of screenshots (the costly part) runs only when the UI or its tests
#     changed, or a finding waits. A push to main runs NO e2e (decided: e2e never runs on commit); by hand: gh workflow run e2e.yml -f suite=jobs,activity.
# All of it is decided in desktop/e2e/plan-run.mjs (tested). The test key's AI credit is shared and small: see desktop/e2e/README.md.
# Secrets (Settings → Secrets → Actions): E2E_ANTHROPIC_KEY, and one E2E_NOTION_TOKEN_<SUITE> per suite (a connection that sees only that suite's test page).
run-name: ${{ inputs.canary && format('Stable canary {0}', inputs.target_ref) || inputs.soak && format('RC soak {0}', inputs.target_ref) || github.event_name == 'workflow_run' && format('Gate {0}', github.event.workflow_run.head_sha) || '' }}   # empty = GitHub's default name. Both name the release they test: ui-findings.yml ignores 'Stable canary'; canary_promote.py counts 'RC soak <tag>' and 'Gate <sha>' (the release gate: GitHub gives a workflow_run its own commit as main's, so the tested one is in the name) for gate 4

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suites to run, comma-separated (empty = all)'
        required: false
      canary:
        description: 'The daily stable canary (stable-canary.yml): no paid AI judge, and ui-findings.yml files nothing from it'
        type: boolean
        default: false
      target_ref:
        description: "Test this release tag's commit with THIS workflow file (the soak top-ups and the stable canary: an old tag's own workflow file does not know their inputs)"
        required: false
      soak:
        type: boolean
        default: false
        description: 'A top-up run on a release candidate (canary-promote.yml): no paid AI judge; its findings ARE filed, naming the build'
      promote_tag:
        description: 'DRY RUN of the promotion step for this release tag (runs no suite, promotes nothing)'
        required: false
  schedule:
    - cron: '47 9,13,17 * * *'   # 11:47, 15:47, 19:47 in Zurich in summer (the UI loop's producer, ui-findings.yml, follows each run)
  workflow_run:
    workflows: ['Release · Desktop app']   # the nightly build (or a manual one) finished: verify it, and promote it when it passes
    types: [completed]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
      ref: ${{ steps.list.outputs.ref }}
      tag: ${{ steps.list.outputs.tag }}
      review: ${{ steps.list.outputs.review }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: The tests' own tests (layout check, review parser, triage rules, which suites run)
        working-directory: desktop/e2e
        run: npm test
      - name: What to run (suites, commit, AI review, release to promote)
        id: list
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          ONLY: ${{ inputs.suite }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: node plan-run.mjs 2>> "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
  suite:
    name: ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.count != '0'   # a push that changed no suite, a scheduled run with nothing new, or a night with no build: no suites
    runs-on: macos-latest   # the Mac app is the product: real Keychain, no virtual display (on Linux Electron has no keyring to save the key in)
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false      # one suite failing must not hide what the others found
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    concurrency:
      group: e2e-${{ matrix.suite }}   # a suite never overlaps itself (it owns one Notion page); different suites run together
      cancel-in-progress: false
    env:
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
      E2E_NOTION_TOKEN: ${{ secrets.E2E_NOTION_TOKEN }}
      E2E_NOTION_TOKEN_JOBS: ${{ secrets.E2E_NOTION_TOKEN_JOBS }}
      E2E_NOTION_TOKEN_INTERVIEWS: ${{ secrets.E2E_NOTION_TOKEN_INTERVIEWS }}
      E2E_NOTION_TOKEN_SETTINGS: ${{ secrets.E2E_NOTION_TOKEN_SETTINGS }}
      E2E_NOTION_TOKEN_PERSONAS: ${{ secrets.E2E_NOTION_TOKEN_PERSONAS }}
      E2E_NOTION_TOKEN_EMPLOYERS: ${{ secrets.E2E_NOTION_TOKEN_EMPLOYERS }}
      E2E_NOTION_TOKEN_CALENDAR: ${{ secrets.E2E_NOTION_TOKEN_CALENDAR }}
      E2E_NOTION_TOKEN_FOCUS: ${{ secrets.E2E_NOTION_TOKEN_FOCUS }}
      E2E_NOTION_TOKEN_APPLY: ${{ secrets.E2E_NOTION_TOKEN_APPLY }}
      E2E_NOTION_TOKEN_ACTIVITY: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITY }}
      E2E_NOTION_TOKEN_ACTIVITYFAILURES: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITYFAILURES }}
      E2E_NOTION_TOKEN_STRATEGY: ${{ secrets.E2E_NOTION_TOKEN_STRATEGY }}
      E2E_NOTION_TOKEN_QUALITY: ${{ secrets.E2E_NOTION_TOKEN_QUALITY }}
      E2E_NOTION_TOKEN_INTERACTIONS: ${{ secrets.E2E_NOTION_TOKEN_INTERACTIONS }}
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts/${{ matrix.suite }}
      E2E_SEED: ${{ (github.event_name == 'workflow_run' || inputs.canary) && '0' || github.run_id }}   # a different path in every scheduled, top-up or manual run; the release gate and the stable canary walk the fixed one (lib/variation.mjs)
      E2E_FULL: ${{ (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && !inputs.canary && !inputs.soak)) && '1' || '' }}   # the paid AI judge steps: the nightly gate and manual runs only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}   # a push or a schedule: that commit; the run after a build: the build's own commit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record which commit this run tested (ui-findings.yml names it in every issue)
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          printf '%s %s' "${{ inputs.target_ref || github.ref_name }}" "$(git rev-parse HEAD)" > "$E2E_ARTIFACTS/tested.txt"
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Chromium for the extension (the apply suite loads the real Chrome extension in it)
        if: matrix.suite == 'apply'
        working-directory: desktop/e2e
        run: npx playwright-core install chromium
      - name: Python packages the engine needs
        run: pip install --quiet -r requirements.txt
      - name: Run the ${{ matrix.suite }} suite
        working-directory: desktop/e2e
        timeout-minutes: 25   # a hung suite stops here, not after the job's limit
        run: node suite.mjs ${{ matrix.suite }}
      - name: AI review of the screenshots
        if: always() && env.E2E_ANTHROPIC_KEY != '' && needs.plan.outputs.review == '1'   # the costly part: only when the UI or its tests changed, or a finding waits
        working-directory: desktop/e2e
        timeout-minutes: 10
        run: node review-ui.mjs
      - name: Screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.suite }}
          path: e2e-artifacts/${{ matrix.suite }}
          if-no-files-found: ignore

  # The release gate. Only after the nightly build: every suite passed on the build's commit, and so did build.yml.
  promote:
    needs: [plan, suite]
    if: needs.plan.outputs.tag != '' && needs.suite.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # gh release edit (promote)
      actions: read
      issues: read      # block-check.mjs reads the open UI-loop issues
    concurrency:
      group: release-promote
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No real high-severity finding in this run (layout check, or an AI finding already seen twice / confirmed)
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-artifacts-*' --dir ../../e2e-artifacts || echo "no artifacts to read"
          mkdir -p ../../e2e-artifacts
          status=0
          node block-check.mjs --artifacts ../../e2e-artifacts > block.txt || status=$?
          cat block.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then echo "$TAG stays a pre-release: a real high-severity finding in its end-to-end run." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - name: The Notion schema is additive over the current stable (so "Back to stable" cannot split anybody's data)
        if: vars.JOB_PILOTTO_SOAK == 'on'
        run: |
          stable=$(gh release list -R "$GITHUB_REPOSITORY" -L 20 --json tagName,isPrerelease,isDraft -q '[.[] | select(.isDraft | not) | select(.isPrerelease | not)][0].tagName')
          if [ -z "$stable" ] || [ "$stable" = "$TAG" ]; then echo "No older stable to compare with." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/contents/config/notion_schema.json?ref=$stable" -q .content | base64 -d > "$RUNNER_TEMP/stable-schema.json"
          gh api "repos/$GITHUB_REPOSITORY/contents/config/notion_schema.json?ref=$TAG" -q .content | base64 -d > "$RUNNER_TEMP/candidate-schema.json"
          status=0
          python3 tools/check_schema_additive.py "$RUNNER_TEMP/stable-schema.json" "$RUNNER_TEMP/candidate-schema.json" > "$RUNNER_TEMP/schema.txt" || status=$?
          echo "Schema $TAG vs stable $stable:" >> "$GITHUB_STEP_SUMMARY"; cat "$RUNNER_TEMP/schema.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then echo "$TAG is not offered to beta testers: it changes the Notion schema in a way the older app cannot undo." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - name: build.yml (the unit suites) is green on the commit
        run: |
          verdict=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --commit "$REF" --status completed --json conclusion | python3 tools/e2e_gate.py ci)
          echo "build.yml on ${REF:0:7}: $verdict"
          if [ "$verdict" != green ]; then echo "$TAG stays a pre-release: build.yml is not green on its commit." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - name: Approve the build for beta testers (soak on), or make it stable (soak off)
        env:
          E2E_ALREADY_GREEN: '1'   # every suite of this very run passed on this commit
          SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        run: |
          if [ "$SOAK" = on ]; then
            tools/beta-approve.sh "$TAG"
            echo "Beta-approved: $TAG (unit suites and every end-to-end suite passed on its commit). It becomes stable through canary-promote.yml: more end-to-end runs, no blocking finding, then healthy beta use." >> "$GITHUB_STEP_SUMMARY"
          else
            tools/release-stable.sh "$TAG"
            echo "Stable: $TAG (every suite passed on its commit)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # By hand: gh workflow run e2e.yml -f promote_tag=desktop-v0.4.0-alpha.253 : what the promotion step would do for a release, changing nothing.
  promote-dry-run:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.promote_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: What the promotion would do
        env:
          E2E_ALREADY_GREEN: '1'
          DRY_RUN: '1'
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: tools/release-stable.sh "$PROMOTE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
