name: CI · Edge check (Windows, by hand)

# Spike, 5 Oct 2026: does the app's launcher find Edge on a Windows runner, and does branded Edge load the unpacked extension?
# By hand only; the answer decides whether the apply suite gets an Edge variant (see the Notion page "Platform support").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Edge
        working-directory: desktop/e2e
        run: node edge-spike.mjs
