name: CI · Lab Job Search · replay (offline)
# The Lab Job Search's detector (owner, 18 Oct 2026; PR 2 of the sketch https://claude.ai/artifact/FsAAKdxxXF2wXpD1nbHAuC): each fictional candidate's first search is replayed from its tape
# (src/search_tape.py: every web and AI answer recorded once; tools/persona-search/tape-store.mjs keeps them encrypted on the private repo's release `search-tapes`), and its numbers are posted to
# /admin/lab-job-search (PUT /search-lab/rows, main only). $0: no site is visited, no model is called (--no-live: an AI request the tape lacks makes the row FAILED "tape stale", never thin numbers).
# Once a day and by hand (owner, 19 Oct 2026: "Let it run once a day, by a schedule, on the CI"; no push, no PR: the per-PR replay and the heal are off). A branch's run is refused by the site: only main moves the page.
# A tape the search no longer matches shows "No valid replay" on the Lab's Replays tab, never numbers; the Lab's lead is Real installs and Random draws.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:   # a daily run and a by-hand run queue, none is cancelled (no push starts it any more)
  group: search-lab
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        candidate: [finance, music, driver, sre, cluj, chisinau]
    env:
      GH_TOKEN: ${{ github.token }}
      NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
      REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm ci && node scripts/stage.mjs
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old read token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: job-pilotto-internal
      - name: Candidates' CVs and the tape
        env:
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}
        run: |
          python3 tools/persona-search/personas.py "$RUNNER_TEMP/out"
          node tools/persona-search/tape-store.mjs fetch "${{ matrix.candidate }}" "$RUNNER_TEMP/tape"
      - name: Replay the first search from the tape (no AI, no site)
        id: replay
        continue-on-error: true   # a crashed search is posted as FAILED below, then this job ends red
        run: node tools/persona-search/run.mjs "${{ matrix.candidate }}" "$RUNNER_TEMP/out" --presses 1 --tag ci --fresh --draft "$RUNNER_TEMP/tape/draft.json" --tape "$RUNNER_TEMP/tape" --replay --no-live 2>&1 | tee "$RUNNER_TEMP/replay.log"
      - name: What the tape lacked (web addresses only, no query and no page text)
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, json, os, urllib.parse
          path = os.path.join(os.environ['RUNNER_TEMP'], 'tape', 'missing.jsonl')
          rows = [json.loads(line) for line in open(path)] if os.path.exists(path) else []
          web = [row for row in rows if row.get('web')]
          shapes = collections.Counter(f"{row['method']} {urllib.parse.urlsplit(row['url']).netloc}{urllib.parse.urlsplit(row['url']).path[:40]}" for row in web)
          print(f"### {os.environ['MATRIX_CANDIDATE']}: tape lacked {len(rows) - len(web)} AI and {len(web)} web requests")
          for shape, count in shapes.most_common(15): print(f"- {count} x {shape}")
          PY
        env:
          MATRIX_CANDIDATE: ${{ matrix.candidate }}
      - name: Post the numbers to /admin/lab-job-search
        run: |
          if [ -z "$REPLAYS_PUBLISH_KEY" ]; then echo "search-lab: REPLAYS_PUBLISH_KEY not set: nothing posted" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node tools/persona-search/lab-upload.mjs "$RUNNER_TEMP/out" --tape "$RUNNER_TEMP/tape" --build "$GITHUB_SHA" --branch "${{ github.ref_name }}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: End red when the search crashed
        if: steps.replay.outcome == 'failure'
        run: exit 1
