name: CI · AI code review

# Claude reads main's latest changes for bugs that would hurt a person (a wrong result, a crash, technical text shown, a leaked secret, a broken release) and files
# each one, with its file:line, a concrete scenario and the test that would fail, on the same board as the UI loop (label auto-ui, source:code-review).
# Why: reading code found 12 of the first 36 tracked bugs, 7 of them on paths no end-to-end run reached (3 Oct 2026). Twice a day over the last 13 hours,
# not per push (dozens a day). Read-only: it changes no file in the repo and pushes nothing; the verdict pass or a person confirms a finding before a fix.
on:
  schedule:
    - cron: '10 */6 * * *'   # every 6 hours over the last 7: a busy day had ~150 commits, too many for one review (3 Oct 2026)
  workflow_dispatch:
    inputs:
      range:
        description: 'A commit range to review instead of the last 13 hours (e.g. abc123..def456)'
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: code-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: What to review
        id: range
        env:
          ASKED: ${{ inputs.range }}
        run: |
          node desktop/e2e/ai-budget.mjs --check
          if grep -q '^skip=true' "$GITHUB_OUTPUT"; then echo "range=" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$ASKED" ]; then range="$ASKED"; else
            oldest=$(git log --since='7 hours ago' --format=%H HEAD | tail -1)
            if [ -z "$oldest" ]; then echo "range=" >> "$GITHUB_OUTPUT"; echo "No commits in the last 7 hours." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            range="$(git rev-parse "$oldest~1" 2>/dev/null || echo "$oldest")..HEAD"
          fi
          code=$(git diff --name-only "$range" | grep -vE '(\.md$|^docs/|^CODEMAP)' || true)
          if [ -z "$code" ]; then echo "range=" >> "$GITHUB_OUTPUT"; echo "Only docs changed in $range: nothing to review." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          mkdir -p .review
          # Only commits that touch product code (not tests, the e2e harness or docs), largest product change first, at most 20: what a person runs is where a bug hurts.
          PRODUCT=(src desktop/lib desktop/main.js desktop/preload.cjs desktop/renderer extension ':!**/test/**' ':!**/tests/**' ':!desktop/e2e/**')
          git log --format=%H --no-merges "$range" -- "${PRODUCT[@]}" > .review/candidates.txt
          while read -r sha; do echo "$(git show --numstat --format= "$sha" -- "${PRODUCT[@]}" | awk '{s+=$1+$2} END{print s+0}') $sha"; done < .review/candidates.txt | sort -rn | head -20 | awk '{print $2}' > .review/commits.txt
          total=$(wc -l < .review/candidates.txt | tr -d ' '); picked=$(wc -l < .review/commits.txt | tr -d ' ')
          if [ "$picked" = 0 ]; then echo "range=" >> "$GITHUB_OUTPUT"; echo "No product-code commits in $range." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          { cat desktop/e2e/code-review-prompt.md; echo; echo "RANGE: $range"; echo "COMMITS (review these, all of them):"; cat .review/commits.txt; } > .review/prompt.md
          echo "Reviewing $picked of $total product-code commit(s) in $range$([ "$picked" -lt "$total" ] && echo " (the $((total - picked)) smallest are NOT reviewed in this run)")." >> "$GITHUB_STEP_SUMMARY"
      - name: Claude reads the changes (read-only)
        if: steps.range.outputs.range != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 80
            --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
          prompt: Read .review/prompt.md and follow it exactly.
      - name: AI budget and cost of this run
        if: always() && steps.range.outputs.range != ''
        run: node desktop/e2e/ai-budget.mjs --after /home/runner/work/_temp/claude-execution-output.json --job code-review
      - name: Keep what it read and found (to audit a review)
        if: always() && steps.range.outputs.range != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-review
          path: |
            .review/
            ${{ runner.temp }}/ai-cost.json
            /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
          include-hidden-files: true   # .review/ is a dot folder: skipped by default, so the first audit artifact had no findings or list
      - uses: actions/setup-node@v4
        if: steps.range.outputs.range != ''
        with:
          node-version: '22'
      - name: File what it found
        if: steps.range.outputs.range != ''
        env:
          RANGE: ${{ steps.range.outputs.range }}
          SHA: ${{ github.sha }}
        run: node desktop/e2e/code-review-file.mjs --findings .review/findings.json --range "$RANGE" --run-url "$RUN_URL"
