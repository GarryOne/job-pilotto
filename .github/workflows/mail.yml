name: Gmail and Calendar
run-name: mail${{ inputs.delay && inputs.delay != '0' && format(' (after {0} min)', inputs.delay) || '' }}

# Read-only: Gmail and Calendar -> 📈 Application Events, Stage, Next interview, Telegram.
# How often: the cron in templates/github-actions/mail.yml (your private repo). 05, 10, 16 UTC = 07:00, 12:00, 18:00 in Zurich (summer time);
# the 16:00 UTC run sends the evening-before interview prep. Also started 5 minutes after an
# application is marked Applied (watcher, ✅ button, /add), and by /mail in Telegram.
on:
  # Called by the scheduled workflow in your private repo (templates/github-actions/mail.yml);
  # no schedule here, so this public repo never reads your mail.
  workflow_call:
    inputs:
      delay: {type: string, default: '0'}
      days: {type: string, default: '2'}
      code_repository: {type: string, default: ''}
  workflow_dispatch:
    inputs:
      delay:
        description: 'minutes to wait first (5 after an application, so its confirmation email has arrived)'
        required: false
        default: '0'
      days:
        description: 'how many days of Gmail to look at'
        required: false
        default: '2'

permissions:
  contents: read


# Optional features can be switched off without deleting their secrets (src/features.py),
# e.g. repository variable JOB_PILOTTO_DISABLE=google_jobs,mail.
env:
  JOB_PILOTTO_DISABLE: ${{ vars.JOB_PILOTTO_DISABLE }}
  # Your Notion workspace: database and page IDs, as repository variables (the Desktop App sets them).
  NOTION_APPLICATIONS_DB: ${{ vars.NOTION_APPLICATIONS_DB }}
  NOTION_MATCHES_DB: ${{ vars.NOTION_MATCHES_DB }}
  NOTION_EVENTS_DB: ${{ vars.NOTION_EVENTS_DB }}
  NOTION_INSIGHTS_DB: ${{ vars.NOTION_INSIGHTS_DB }}
  NOTION_INTERVIEWS_DB: ${{ vars.NOTION_INTERVIEWS_DB }}
  NOTION_EMPLOYERS_DB: ${{ vars.NOTION_EMPLOYERS_DB }}
  NOTION_AGENT_RUNS_DB: ${{ vars.NOTION_AGENT_RUNS_DB }}
  NOTION_CRON_RUNS_DB: ${{ vars.NOTION_CRON_RUNS_DB }}
  NOTION_PROFILE_PAGE_ID: ${{ vars.NOTION_PROFILE_PAGE_ID }}
  NOTION_ANSWERS_PAGE_ID: ${{ vars.NOTION_ANSWERS_PAGE_ID }}
  NOTION_PIPELINE_PAGE: ${{ vars.NOTION_PIPELINE_PAGE }}

jobs:
  mail:
    runs-on: ubuntu-latest
    concurrency:
      group: job-pilotto-mail
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      # A check someone started (Telegram, the app) gets an answer: here, what to do in the app.
      - name: Not connected yet
        if: env.GOOGLE_REFRESH_TOKEN == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STARTED_BY_SOMEONE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          text="📧 Gmail isn't connected for Always on yet. In the Job Pilotto app: Settings → Connections → Gmail & Calendar → Connect (it's sent to GitHub too)."
          echo "$text"
          if [ "$STARTED_BY_SOMEONE" = "true" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}"
          fi
      - uses: actions/checkout@v4
        if: env.GOOGLE_REFRESH_TOKEN != ''
        # Called from a private repo (templates/github-actions): run this repo's code there.
        with:
          repository: ${{ inputs.code_repository || github.repository }}
      - uses: actions/setup-python@v5
        if: env.GOOGLE_REFRESH_TOKEN != ''
        with:
          python-version: '3.12'
      # Which emails were already classified and which reminders were sent; losing it only
      # costs one re-classification (events are deduplicated in Notion by Source ID).
      - name: Restore mail state
        if: env.GOOGLE_REFRESH_TOKEN != ''
        uses: actions/cache/restore@v4
        with:
          path: data/mail-state.json
          key: job-pilotto-mail-${{ github.run_id }}
          restore-keys: job-pilotto-mail-
      - name: Wait
        if: env.GOOGLE_REFRESH_TOKEN != '' && inputs.delay && inputs.delay != '0'
        run: sleep $(( ${{ inputs.delay }} * 60 ))
      - name: Check Gmail and Calendar
        if: env.GOOGLE_REFRESH_TOKEN != ''
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_PILOTTO_MAIL_MODEL: ${{ vars.JOB_PILOTTO_MAIL_MODEL || 'claude-haiku-4-5' }}
        run: |
          pip install --quiet -r requirements.txt
          send=()
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then send=(--send); fi
          # Started by someone (Telegram button, the app, the Run button): always answer, even "nothing new".
          if [ ${#send[@]} -gt 0 ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then send+=(--always-report); fi
          # --log-run: its ⏱️ Search runs row (running, then result and log) is how the app and Notion see it.
          python -m src.ai.mail "${send[@]}" --log-run --days "${{ inputs.days || '2' }}"
      - name: Save mail state
        if: always() && env.GOOGLE_REFRESH_TOKEN != ''
        uses: actions/cache/save@v4
        with:
          path: data/mail-state.json
          key: job-pilotto-mail-${{ github.run_id }}
