name: CI · UI fixer

# THE FIXER of the UI loop, four times a day (after the nightly build's end-to-end run, and after each daytime one). It reads the open issues the producer (ui-findings.yml) has been
# filing all day, picks the MOST CRITICAL one that is ready (severity times how often it came back this week, doubled by a person's `confirmed` label; two sightings this
# week or `confirmed` are needed), and lets Claude Code fix it and open ONE pull request for the owner to review. Never merges anything.
# Claude only edits files (no git, no gh, no network); the last step checks the paths (desktop/renderer and its tests only), requires a test, runs the whole desktop suite,
# and only then pushes a branch `auto-fix/<fingerprint>` and opens the PR with the finding's screenshot as "Before". At most 3 automatic PRs may be open at once.
# A false positive is closed with the label `wontfix-auto`; a finding a person looked at and found real gets `confirmed`.
# Needs: ANTHROPIC_API_KEY (the same repository secret as the weekly self-review).
on:
  schedule:
    - cron: '30 5,11,15,19 * * *'   # four a day (owner, 3 Oct 2026: too many open issues): the early one after the nightly build, then ~1.5 h after each daytime e2e run is filed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ui-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
      BASE: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pick the most critical finding that is ready
        id: pick
        run: |
          mkdir -p .heal
          node desktop/e2e/pick.mjs --out .heal
      - name: Not too many open automatic fixes
        id: capacity
        if: steps.pick.outputs.candidate != 'none'
        run: |
          open=$(gh pr list --repo "$REPO" --state open --label auto-ui-fix --json number --jq length)
          echo "Open automatic fixes: $open"
          if [ "$open" -ge 4 ]; then echo "full=true" >> "$GITHUB_OUTPUT"; echo "Four automatic fixes already wait for review; not starting another." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Put the finding's screenshot next to it
        if: steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        run: |
          shot=$(jq -r '.screenshot // ""' .heal/candidate.json)
          if [ -n "$shot" ]; then curl -fsSL -o .heal/screenshot.png "$shot" || echo "screenshot not downloaded"; else echo "the issue has no screenshot"; fi
      - name: Install the app's dependencies (for its tests)
        if: steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        working-directory: desktop
        run: npm ci
      - name: Claude Code fixes the problem (files only)
        id: claude
        if: steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Least privilege: read and edit files, run the desktop tests, read-only git. No push, no gh, no network.
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 50
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(node --test:*),Bash(git diff:*),Bash(git status:*)"
          prompt: Read .heal/prompt.md and follow it exactly.
      - name: Keep Claude's transcript (to see where its turns went)
        if: always() && steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: heal-transcript
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
      - name: Check the change, run the tests, open the pull request
        if: always() && steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          # Claude did not run (the API refused: no credit, a bad key, an outage): that says nothing about the finding. Nothing is labelled or closed (2 Oct 2026: a first run that
          # failed on "Credit balance is too low" parked the issue as needs-human, "Claude made no change").
          if [ "$CLAUDE_OUTCOME" != success ]; then
            echo "The fixer could not run Claude (step outcome: $CLAUDE_OUTCOME): see this run's transcript artifact. Nothing was changed on the issue." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Claude Code did not run ($CLAUDE_OUTCOME); the issue is left as it is."
            exit 1
          fi
          # The labels the branches below use (a first run finds none).
          gh label create needs-human --repo "$REPO" --force --color D93F0B --description 'The UI loop could not fix this by itself'
          gh label create wontfix-auto --repo "$REPO" --force --color CCCCCC --description 'A false positive of the UI loop: never retried'
          number=$(jq -r '.number' .heal/candidate.json)
          id=$(jq -r '.id' .heal/candidate.json)
          changed=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -v -E '^(\.heal/|e2e-artifacts/)' || true)
          if [ -z "$changed" ]; then
            verdict=$(head -1 .heal/verdict.md 2>/dev/null | tr -d '[:space:]' || true)
            reason=$(sed -n '2,$p' .heal/verdict.md 2>/dev/null | head -3 || true)
            case "$verdict" in
              false-positive)
                gh issue edit "$number" --repo "$REPO" --add-label wontfix-auto
                gh issue close "$number" --repo "$REPO" --comment "Closed by the UI loop as a false positive: $reason"
                echo "Issue #$number closed as a false positive." >> "$GITHUB_STEP_SUMMARY" ;;
              *)
                gh issue edit "$number" --repo "$REPO" --add-label needs-human
                gh issue comment "$number" --repo "$REPO" --body "The UI loop could not fix this by itself. ${reason:-Claude made no change.}"
                echo "Issue #$number needs a person." >> "$GITHUB_STEP_SUMMARY" ;;
            esac
            exit 0
          fi
          if ! echo "$changed" | node desktop/e2e/check-change.mjs; then
            gh issue edit "$number" --repo "$REPO" --add-label needs-human
            gh issue comment "$number" --repo "$REPO" --body "The proposed change was refused by the guard (it touched files a UI fix may not touch, or had no test), so nothing was opened. See the run: $RUN_URL"
            exit 1
          fi
          if ! (cd desktop && npm test); then
            gh issue comment "$number" --repo "$REPO" --body "A fix was tried, but the desktop tests failed, so no pull request was opened. See the run: $RUN_URL"
            exit 1
          fi
          title=$(head -1 .heal/pr-body.md 2>/dev/null || echo "UI fix for #$number")
          shot=$(jq -r '.screenshot // ""' .heal/candidate.json)
          { sed -n '2,$p' .heal/pr-body.md 2>/dev/null || true; echo
            echo "## Before: the finding as the end-to-end run saw it"
            if [ -n "$shot" ]; then echo "![before]($shot)"; echo; fi
            echo "The issue #$number has the severity, the app's state, the logs and the run's artifacts."; echo
            echo "## After"
            echo "When a later end-to-end run photographs this page and the finding is gone, the loop comments here and on #$number with the new screenshot."; echo
            echo "Fixes #$number"; echo
            echo "Opened by the UI fixer (four times a day) for the most critical finding of the week: seen in two runs, or confirmed by a person. Review it like any change; it never merges itself."; } > .heal/body.md
          branch="auto-fix/$id"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          echo "$changed" | xargs git add --
          git commit -q -m "$title" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>"
          git push -q origin "$branch"
          gh label create auto-ui-fix --repo "$REPO" --force --color 0E8A16 --description 'A fix proposed by the UI loop'
          extra=""
          if [ "$BASE" != main ]; then gh label create dry-run --repo "$REPO" --force --color FBCA04 --description 'A dry run of the UI loop: close it'; extra="--label dry-run"; fi
          # shellcheck disable=SC2086
          url=$(gh pr create --repo "$REPO" --base "$BASE" --head "$branch" --title "$title" --body-file .heal/body.md --label auto-ui-fix $extra)
          echo "Pull request opened: $url" >> "$GITHUB_STEP_SUMMARY"
