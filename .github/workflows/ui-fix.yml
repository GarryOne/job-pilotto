name: CI · UI fixer

# THE FIXER of the UI loop, four times a day (after the nightly build's end-to-end run, and after each daytime one). It reads the open issues the producer (ui-findings.yml) has been
# filing all day, picks the MOST CRITICAL one that is ready (severity times how often it came back this week, doubled by a person's `confirmed` label; two sightings this
# week or `confirmed` are needed), and lets Claude Code fix it and open ONE pull request for the owner to review. Never merges anything.
# Claude only edits files (no git, no gh, no network); the last step checks the paths (desktop/renderer and its tests only), requires a test, runs the whole desktop suite,
# and only then pushes a branch `auto-fix/<fingerprint>` and opens the PR with the finding's screenshot as "Before". At most 3 automatic PRs may be open at once.
# A false positive is closed with the label `wontfix-auto`; a finding a person looked at and found real gets `confirmed`.
# Needs: ANTHROPIC_API_KEY (the same repository secret as the weekly self-review).
on:
  schedule:
    - cron: '30 5,11,15,19 * * *'   # four a day (owner, 3 Oct 2026: too many open issues): the early one after the nightly build, then ~1.5 h after each daytime e2e run is filed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ui-fix
  cancel-in-progress: false

jobs:
  # Up to four fixes at once (4 Oct 2026: one fix per run left confirmed bugs waiting for days): the ready findings, at most one per kind, minus the fixes that
  # already wait for review, and none while the AI limit is reached (desktop/e2e/ai-budget.mjs).
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The findings to fix now
        id: list
        run: |
          node desktop/e2e/ai-budget.mjs --check
          if grep -q '^skip=true' "$GITHUB_OUTPUT"; then echo "count=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          open=$(gh pr list --repo "$REPO" --state open --label auto-ui-fix --json number --jq length)
          room=$((4 - open))
          if [ "$room" -le 0 ]; then echo "count=0" >> "$GITHUB_OUTPUT"; echo "Four automatic fixes already wait for review; not starting another." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node desktop/e2e/pick.mjs --out .heal --fix-list "$room"

  fix:
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
      BASE: ${{ github.ref_name }}
      NUMBER: ${{ matrix.issue }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The finding to fix (chosen by the plan job)
        id: pick
        run: |
          mkdir -p .heal
          node desktop/e2e/pick.mjs --out .heal --issue "$NUMBER" --mode fix
      - name: Room checked by the plan job
        id: capacity
        run: echo "full=false" >> "$GITHUB_OUTPUT"
      - name: Put the finding's screenshot next to it
        id: shot
        if: steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        run: |
          shot=$(jq -r '.screenshot // ""' .heal/candidate.json)
          if [ -n "$shot" ]; then curl -fsSL -o .heal/screenshot.png "$shot" || echo "screenshot not downloaded"; else echo "the issue has no screenshot"; fi
      - name: Install the app's dependencies (for its tests)
        id: deps
        if: steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        working-directory: desktop
        run: npm ci
      # The engine's tests too: since 4 Oct 2026 a confirmed logic bug in src/ or desktop/lib/ is fixable, and its fix must pass the whole Python suite.
      - uses: actions/setup-python@v6
        if: steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the engine's dependencies (for its tests)
        if: steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        run: pip install -r requirements.txt
      - name: Claude Code fixes the problem (files only)
        id: claude
        if: steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Least privilege: read and edit files, run the desktop tests, read-only git. No push, no gh, no network.
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 50
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(node --test:*),Bash(python3 -m unittest:*),Bash(git diff:*),Bash(git status:*)"
          prompt: Read .heal/prompt.md and follow it exactly.
      - name: AI budget and cost of this run
        if: always() && steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        run: node desktop/e2e/ai-budget.mjs --after /home/runner/work/_temp/claude-execution-output.json --job fixer
      - uses: actions/upload-artifact@v6
        if: always() && steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        with:
          name: ai-cost-fix-${{ matrix.issue }}
          path: ${{ runner.temp }}/ai-cost.json
          if-no-files-found: ignore
      - name: Keep Claude's transcript (to see where its turns went)
        if: always() && steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: heal-transcript-${{ matrix.issue }}
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
      - name: Check the change, run the tests, open the pull request
        if: always() && steps.pick.outputs.candidate != 'none' && steps.capacity.outputs.full != 'true'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          SHOT_OUTCOME: ${{ steps.shot.outcome }}
          AUTOMERGE: ${{ vars.JOB_PILOTTO_FIXER_AUTOMERGE }}   # "on": a small UI-only fix that passed every suite merges itself (off by default)
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
        run: |
          set -euo pipefail
          # An earlier step failed: say WHICH. This step runs after any failure, and "Claude Code did not run (skipped)" hid a picker bug for two runs (3 Oct 2026).
          for pair in "Put the finding's screenshot next to it:$SHOT_OUTCOME" "Install the app's dependencies:$DEPS_OUTCOME"; do
            if [ "${pair##*:}" = failure ]; then
              echo "::error::The step \"${pair%:*}\" failed, so Claude was not run; the issue is left as it is."
              echo "The step \"${pair%:*}\" failed: see its log above. Nothing was changed on the issue." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          # Claude did not run (the API refused: no credit, a bad key, an outage): that says nothing about the finding. Nothing is labelled or closed (2 Oct 2026: a first run that
          # failed on "Credit balance is too low" parked the issue as needs-human, "Claude made no change").
          if [ "$CLAUDE_OUTCOME" != success ]; then
            echo "The fixer could not run Claude (step outcome: $CLAUDE_OUTCOME): see this run's transcript artifact. Nothing was changed on the issue." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Claude Code did not run ($CLAUDE_OUTCOME); the issue is left as it is."
            exit 1
          fi
          # The labels the branches below use (a first run finds none).
          gh label create needs-human --repo "$REPO" --force --color D93F0B --description 'The UI loop could not fix this by itself'
          gh label create wontfix-auto --repo "$REPO" --force --color CCCCCC --description 'A false positive of the UI loop: never retried'
          number=$(jq -r '.number' .heal/candidate.json)
          id=$(jq -r '.id' .heal/candidate.json)
          changed=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -v -E '^(\.heal/|e2e-artifacts/)' || true)
          mode=$(jq -r '.mode // "fix"' .heal/candidate.json)
          # A verdict-only pass never opens a pull request: whatever Claude edited is dropped, only its verdict counts.
          if [ "$mode" = verdict ]; then changed=""; git checkout -- . 2>/dev/null || true; fi
          if [ -z "$changed" ]; then
            verdict=$(head -1 .heal/verdict.md 2>/dev/null | tr -d '[:space:]' || true)
            reason=$(sed -n '2,$p' .heal/verdict.md 2>/dev/null | head -3 || true)
            case "$verdict" in
              real)
                if [ "$mode" = verdict ]; then
                  gh label create confirmed --repo "$REPO" --force --color 0E8A16 --description 'A person or the verdict pass says this is real: ready to fix'
                  gh issue edit "$number" --repo "$REPO" --add-label confirmed
                  gh issue comment "$number" --repo "$REPO" --body "Judged real by the UI loop's verdict pass (no edits made): $reason Marked \`confirmed\`: the next fixer run takes it."
                  echo "Issue #$number judged real and confirmed." >> "$GITHUB_STEP_SUMMARY"
                else
                  gh issue edit "$number" --repo "$REPO" --add-label needs-human
                  gh issue comment "$number" --repo "$REPO" --body "The UI loop could not fix this by itself. ${reason:-Claude made no change.}"
                fi ;;
              false-positive)
                gh issue edit "$number" --repo "$REPO" --add-label wontfix-auto
                gh issue close "$number" --repo "$REPO" --comment "Closed by the UI loop as a false positive: $reason"
                echo "Issue #$number closed as a false positive." >> "$GITHUB_STEP_SUMMARY" ;;
              *)
                gh issue edit "$number" --repo "$REPO" --add-label needs-human
                gh issue comment "$number" --repo "$REPO" --body "The UI loop could not fix this by itself. ${reason:-Claude made no change.}"
                echo "Issue #$number needs a person." >> "$GITHUB_STEP_SUMMARY" ;;
            esac
            exit 0
          fi
          if ! echo "$changed" | node desktop/e2e/check-change.mjs; then
            gh issue edit "$number" --repo "$REPO" --add-label needs-human
            gh issue comment "$number" --repo "$REPO" --body "The proposed change was refused by the guard (it touched files a UI fix may not touch, or had no test), so nothing was opened. See the run: $RUN_URL"
            exit 1
          fi
          # CODEMAP.md is generated from the source tree: a fix that adds or renames a file makes the "CODEMAP.md is up to date" test fail, and the fix was thrown away for want of
          # a regenerated file (#99, 3 Oct 2026: a good fix, lost). Claude may not run it, so the workflow does, after the guard has checked what Claude touched.
          (cd desktop && node scripts/codemap.mjs > /dev/null)
          changed=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -v -E '^(\.heal/|e2e-artifacts/)' || true)
          # Every suite and the lint, whatever the fix touched: a fix that breaks anything else never becomes a pull request.
          if ! (cd desktop && npm test && npm run lint) || ! python3 -m unittest discover -s tests; then
            gh issue comment "$number" --repo "$REPO" --body "A fix was tried, but the tests or the lint failed, so no pull request was opened. See the run: $RUN_URL"
            exit 1
          fi
          # At most 72 BYTES, cut at a word: the title becomes the commit subject, and the repo's push hook counts bytes (a "⋯" is 3), so PR #85's 72-character title was refused and re-committed by hand.
          title=$(node -e 'const t=((require("fs").readFileSync(".heal/pr-body.md","utf8").split("\n")[0])||"").trim(); const bytes=x=>Buffer.byteLength(x); if(bytes(t)<=72){console.log(t)}else{let c=[...t]; while(bytes(c.join(""))>68)c.pop(); console.log(c.join("").replace(/\s+\S*$/,"")+"…")}' 2>/dev/null || true)
          [ -n "$title" ] || title="UI fix for #$number"
          shot=$(jq -r '.screenshot // ""' .heal/candidate.json)
          { sed -n '2,$p' .heal/pr-body.md 2>/dev/null || true; echo
            echo "## Before: the finding as the end-to-end run saw it"
            if [ -n "$shot" ]; then echo "![before]($shot)"; echo; fi
            echo "The issue #$number has the severity, the app's state, the logs and the run's artifacts."; echo
            echo "## After"
            echo "When a later end-to-end run photographs this page and the finding is gone, the loop comments here and on #$number with the new screenshot."; echo
            echo "Fixes #$number"; echo
            echo "Opened by the UI fixer (four times a day) for the most critical finding of the week: seen in two runs, or confirmed by a person. Review it like any change; it never merges itself."; } > .heal/body.md
          branch="auto-fix/$id"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          echo "$changed" | xargs git add --
          git commit -q -m "$title" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>"
          git push -q origin "$branch"
          gh label create auto-ui-fix --repo "$REPO" --force --color 0E8A16 --description 'A fix proposed by the UI loop'
          extra=""
          if [ "$BASE" != main ]; then gh label create dry-run --repo "$REPO" --force --color FBCA04 --description 'A dry run of the UI loop: close it'; extra="--label dry-run"; fi
          # shellcheck disable=SC2086
          url=$(gh pr create --repo "$REPO" --base "$BASE" --head "$branch" --title "$title" --body-file .heal/body.md --label auto-ui-fix $extra)
          echo "Pull request opened: $url" >> "$GITHUB_STEP_SUMMARY"
          # Autonomy, opt-in (JOB_PILOTTO_FIXER_AUTOMERGE=on): a fix of the window only (desktop/renderer and its tests), at most 80 changed lines, that already
          # passed every suite and the lint, merges itself; "Fixes #N" closes its issue and the next end-to-end run checks it stays gone. An engine or app-logic
          # fix always waits for a person. Off by default: until 4 Oct 2026 the rule was that nothing merges itself.
          if [ "${AUTOMERGE:-}" = on ] && [ "$BASE" = main ]; then
            files=$(git show --name-only --format= HEAD | grep -v '^CODEMAP.md$' || true)
            lines=$(git show --numstat --format= HEAD -- . ':!CODEMAP.md' | awk '{s+=$1+$2} END{print s+0}')
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '^desktop/(renderer|test)/' && [ "$lines" -le 80 ]; then
              # Fixes merge in parallel: one that now conflicts with a fix merged meanwhile stays open for a person.
              if ! gh pr merge "$url" --repo "$REPO" --squash --delete-branch; then
                echo "Could not merge automatically (probably a conflict with a fix merged meanwhile): a person merges it." >> "$GITHUB_STEP_SUMMARY"; exit 0
              fi
              # A merge by the workflow's own token does not apply "Fixes #N" (4 Oct 2026: #122, #123, #135 stayed open after their fixes landed): close it here.
              gh issue close "$number" --repo "$REPO" --comment "Fixed by $url (merged by the UI loop). The next end-to-end run checks it stays gone." || true
              gh pr comment "$url" --repo "$REPO" --body "Merged by the UI loop (JOB_PILOTTO_FIXER_AUTOMERGE=on): a window-only fix of $lines line(s) that passed every suite and the lint. The next end-to-end run checks the finding stays gone; revert this commit if it was wrong."
              echo "Merged automatically ($lines lines, window only)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Not merged automatically: $( [ "$lines" -gt 80 ] && echo "$lines lines (over 80)" || echo 'it touches more than the window') . A person merges it." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
