name: CI · Widget zoo (measure, not required)
# The fill ladder's widget zoo (spec docs/superpowers/specs/2026-10-12-fill-ladder.md, PR 1): one hand-made page per control shape (desktop/e2e/widget-zoo), replayed with the real
# extension, offline. It MEASURES how many pages the fill reads and keeps committed; a miss never fails it (pages that fail today are the fill ladder's found bugs). It fails only when the
# replay broke or a page pressed a submit. NOT a required check: a page moves to desktop/e2e/recorded/ (the required replay shards) only once it passes.
on:
  # A REQUIRED check (owner, 12 Oct 2026): it reports on every PR. A required check whose workflow an `on: paths:` filter skips never reports, and the PR waits for ever; so
  # there is no paths filter here: the `changes` job looks at the PR's files and the zoo job is SKIPPED (counted as passed) when none of them is the zoo's.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: widget-zoo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: zoo files changed?
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The zoo's paths: the extension, the app code the replay loads, the zoo pages and its runner/replay libraries, this workflow. A push to main and a manual run always replay.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE...$HEAD")
          if printf '%s\n' "$files" | grep -qE '^(extension/|desktop/lib/|desktop/e2e/widget-zoo/|desktop/e2e/lib/(widget-zoo|page-replay|replay-browser|real-extension)\.mjs$|desktop/e2e/widget-zoo\.mjs$|\.github/workflows/widget-zoo\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"; echo "no zoo file changed: the zoo job is skipped"
          fi
  zoo:
    name: widget zoo
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Install the app's own packages
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
      # desktop/shared is generated (gitignored): the replay's app imports it (lib/ladder/rung2-sketch.js -> shared/alias-schema.js); without it the job died before any page (12 Oct 2026).
      - name: Stage the app's shared files
        working-directory: desktop
        run: node scripts/stage.mjs --files-only
      - name: Chromium (the real extension needs the full browser, not the headless shell)
        working-directory: desktop/e2e
        run: npx playwright install --with-deps chromium
      - name: Replay the zoo
        working-directory: desktop/e2e
        env:
          JP_REPLAY: 1
          JOB_PILOTTO_HEAVY: 0
          REPLAY_LOG: 1   # the extension's decision lines per page: why a miss happened
        run: node widget-zoo.mjs --json widget-zoo.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: widget-zoo
          path: desktop/e2e/widget-zoo.json
          if-no-files-found: ignore
