name: CI · PR description laid out
# A PR description must keep the layout tools/pr-body-format.py gives it (owner, 16 Oct 2026: "didn't add separators, didn't use headings"): a "## " verdict, "---"
# separators, "### " section headings. Runs on every opened, edited or pushed PR (an edit by `gh pr edit` re-checks it); seconds, no checkout of the code under test.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # an edit and a push are kept apart (an opened + edited pair arriving together cancelled one and showed red, #1050, 16 Oct)
  group: pr-description-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && 'edit' || 'push' }}
  cancel-in-progress: true

jobs:
  laid-out:
    name: PR description laid out
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/pr-body-check.py
          sparse-checkout-cone-mode: false
      - name: Headings and separators
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" | python3 tools/pr-body-check.py
