name: CI · AI cost billed

# What Anthropic itself billed per day (Admin API cost report), published to the owner's page https://www.jobpilotto.workers.dev/ai-cost next to what the
# scheduled jobs report: a growing gap means a job that spends but does not report. Needs ANTHROPIC_ADMIN_KEY (an Admin key, not the API key) and
# AI_COST_PUBLISH_KEY; without the first it only prints a line.
on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-cost-billed
  cancel-in-progress: true

jobs:
  billed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fetch and publish the billed days
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          AI_COST_KEYS: job-pilotto-e2e-testing,job-pilotto-in-house-credit,job-pilotto-self-heal,job-pilotto-internal   # the product's own keys, shown per key on /ai-cost (names only; owner, 7 Oct 2026)
        run: node desktop/e2e/ai-cost-report.mjs --billed --days 31
