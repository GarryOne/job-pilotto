# RANDOM DRAW EVERY 2ND DAY (owner, 18 Oct 2026, "daily CI job", cut to every 2nd day after the first two draws cost $1.69; Lab Job Search sketch https://claude.ai/artifact/7CCeNanG2kxhGqqRTCAQ3P): one random role family in one random European city,
# a fictional CV (tools/persona-search/draw.py, lists in draws.json), a fresh throwaway install through the first "Find jobs" (tools/persona-search/run.mjs --engine api: its own
# temp folder, no Keychain/Notion/Telegram, telemetry and sharing off), and the counts go to /admin/lab-job-search "Random draws" (tools/persona-search/draw-upload.mjs, main only).
# - Synthetic only: nothing is read from or written to a real user's data; its rows are tagged CI and are never mixed with the Real installs tab.
# - AI: the Anthropic API on its OWN key (secret RANDOM_DRAWS_ANTHROPIC_KEY, Keychain job-pilotto.anthropic.random_draws_key, the Job Pilotto Tests org), one draw every 2nd day. The
#   monthly cap is that key's workspace spend limit; the job also stops at 25 minutes. OFF until the repository variable RANDOM_DRAWS_ON is "true" (the owner turns it on after
#   the first measured draw's cost is reported).
# - Sites: data-centre IPs are refused by many boards; a refusal shows as "not reached" and is never retried or worked around (never past a login wall, captcha or 401/403/429).
# - A re-run of a bad day: Run workflow with that day's seed (YYYY-MM-DD).
# - The kept artifact is counts only (counts.json, draw.json): the search's top-10 job titles stay out of it.
# Guard: tests/test_draw.py, site/test/search-lab-draws.test.js.
name: CI · Random draw (every 2nd day)

on:
  schedule:
    - cron: '30 4 1-31/2 * *'   # every 2nd day (odd days of the month): about 15 draws a month, about $0.85 each (owner, 18 Oct 2026, $15 cap)
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed, YYYY-MM-DD (empty: today, UTC)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: random-draw
  cancel-in-progress: false

jobs:
  draw:
    if: github.event_name == 'workflow_dispatch' || vars.RANDOM_DRAWS_ON == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Stage the shared files the app imports (the worker's AI client)
        working-directory: desktop
        run: node scripts/stage.mjs --files-only
      - name: Python packages the engine needs
        run: pip install --quiet -r requirements.txt
      - name: Draw the candidate
        id: draw
        env:
          SEED_INPUT: ${{ inputs.seed }}
        run: |
          seed="${SEED_INPUT:-$(date -u +%F)}"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          python3 tools/persona-search/draw.py "$seed" "$RUNNER_TEMP/draw-out" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Search as that candidate (first Find jobs, live)
        env:
          RANDOM_DRAWS_ANTHROPIC_KEY: ${{ secrets.RANDOM_DRAWS_ANTHROPIC_KEY }}
        run: |
          set -o pipefail   # a crash in the harness must fail this step, not just the tee's exit
          node tools/persona-search/run.mjs draw "$RUNNER_TEMP/draw-out" --presses 1 --engine api --fresh 2>&1 | tee "$RUNNER_TEMP/draw.log"
      - name: Send the counts to /admin
        if: github.ref == 'refs/heads/main'
        env:
          REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
        run: node tools/persona-search/draw-upload.mjs "$RUNNER_TEMP/draw-out" --build "$GITHUB_SHA" --branch main
      - name: Keep the numbers (counts only, no job titles, companies or log)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/keep"
          cp "$RUNNER_TEMP/draw-out/draw/draw.json" "$RUNNER_TEMP/keep/" || true
          node -e "const fs=require('fs');const f=process.argv[1];if(!fs.existsSync(f))process.exit(0);const row=JSON.parse(fs.readFileSync(f,'utf8').split('\\n').filter(Boolean)[0]);delete row.top10;fs.writeFileSync(process.argv[2],JSON.stringify(row))" "$RUNNER_TEMP/draw-out/draw/presses.jsonl" "$RUNNER_TEMP/keep/counts.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: random-draw-${{ steps.draw.outputs.seed }}
          path: ${{ runner.temp }}/keep
          retention-days: 30
