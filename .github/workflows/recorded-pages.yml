name: CI · Recorded pages (all cases, real extension, Linux)
# The net under the local push gate (owner, 11 Oct 2026, "CI heavy, local light"): every push to main replays ALL recorded cases (desktop/e2e/recorded) with the real extension,
# offline, sharded across the matrix, 4 tabs at a time in one browser per job (desktop/e2e/lib/replay-browser.mjs). The local pre-push replays only the cases a change can affect.
# A failing case fails the run; the push hook then treats main as red (tools/pre-push-check.sh, AGENTS.md "Red main"). No AI, no network: the pages and answers come from the cases.
on:
  push:
    branches: [main]
  pull_request:   # a required check of every PR (owner, 12 Oct 2026: landing through pull requests; the replays left the Mac's heavy lock)
    branches: [main]
  workflow_dispatch:

concurrency:
  group: recorded-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # a PR's newer push replaces its older run; every push to main is checked: this run is the net under the local gate, so a newer push queues behind it instead of cancelling it

env:
  JP_REPLAY_SHARD_COUNT: 4

jobs:
  replay:
    name: replay shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      ran: ${{ steps.needed.outputs.run }}   # every shard decides the same: the report below sends nothing when no shard replayed
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # the merge commit and the main it merges into: what this pull request changes
      # A pull request runs this job's steps only when it can break them (tools/ci-needed.sh: the push hook's pick, per job); the job always reports. A push to main runs everything.
      - id: needed
        name: Can this change break a recorded replay?
        run: bash tools/ci-needed.sh replays
      - if: steps.needed.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - if: steps.needed.outputs.run == 'true'
        name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      # A row case starts the offline app, which imports desktop/lib/server.js and its packages (@anthropic-ai/sdk).
      - if: steps.needed.outputs.run == 'true'
        name: Install the app's own packages
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
      - if: steps.needed.outputs.run == 'true'
        name: Chromium (the real extension needs the full browser, not the headless shell)
        working-directory: desktop/e2e
        run: npx playwright install --with-deps chromium
      - if: steps.needed.outputs.run == 'true'
        name: Replay this shard's recorded cases
        working-directory: desktop/e2e
        env:
          JP_REPLAY: 1
          JP_REPLAY_TABS: 4
          JP_REPLAY_SHARD: ${{ matrix.shard }}/${{ env.JP_REPLAY_SHARD_COUNT }}
          JP_REPLAY_RESULTS: replay-results-${{ matrix.shard }}.json
        run: node --test --test-concurrency=1 test/recorded-pages.test.mjs
      - name: Keep this shard's results for the report
        if: always() && steps.needed.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: replay-results-${{ matrix.shard }}
          path: desktop/e2e/replay-results-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 3

  # /admin/applying's Fixed-site replays show CI on main only (12 Oct 2026: local runs of work-in-progress branches showed main as broken): every shard's results, ONE PUT
  # with the build's sha (desktop/e2e/replays-report.mjs). Also when a case failed (that is the point). On a PR it is a dry run: it proves the step, sends nothing.
  report:
    name: replays to /admin/applying
    needs: replay
    if: always() && needs.replay.result != 'cancelled' && needs.replay.outputs.ran != 'false'   # no shard replayed (this PR cannot change a replay): nothing to send, skipped = passed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          pattern: replay-results-*
          path: desktop/e2e/results
          merge-multiple: true
      - name: Send the replays of this build
        working-directory: desktop/e2e
        env:
          REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
          JP_REPLAYS_DRY: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        run: node replays-report.mjs "$JP_REPLAY_SHARD_COUNT" $(seq -f 'results/replay-results-%g.json' 1 "$JP_REPLAY_SHARD_COUNT")
