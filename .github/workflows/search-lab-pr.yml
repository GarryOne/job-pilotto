name: CI · Lab Job Search · PR replay (offline)
# What a pull request does to the six Lab candidates (owner, 19 Oct 2026: "Keep, replay on each PR"): each candidate's tape is replayed twice, offline and for $0 (no AI key, no site: --no-live), once on the PR's code and once on main's,
# and the two are compared with the Lab page's own rules (tools/persona-search/pr-compare.mjs, site/src/search-lab-judge.js). Read-only: nothing is posted to /admin/lab-job-search (only main moves the page) and no site key is given to it.
# Red only for a real "Worse" (a count lower, a time >25% slower, a step that crashes where main's does not). A tape the PR makes stale says "needs a live re-record after the merge" and stays green.
# Only for a PR from this repository: the tape is decrypted with a secret a fork's PR never gets.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'desktop/lib/**'
      - 'tools/persona-search/**'
      - 'site/src/search-lab-judge.js'
      - '.github/workflows/search-lab-pr.yml'

permissions:
  contents: read

concurrency:
  group: search-lab-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        candidate: [finance, music, driver, sre, cluj, chisinau]
    env:
      GH_TOKEN: ${{ github.token }}
      NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main-code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Stage the desktop code of the PR and of main
        run: |
          for dir in . main-code; do (cd "$dir/desktop" && npm ci && node scripts/stage.mjs); done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: job-pilotto-internal
      - name: Candidates' CVs and the tape (one copy for each replay, because a replay writes its report into the tape's folder)
        env:
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}
        run: |
          python3 tools/persona-search/personas.py "$RUNNER_TEMP/out-pr"
          python3 tools/persona-search/personas.py "$RUNNER_TEMP/out-main"
          node tools/persona-search/tape-store.mjs fetch "${{ matrix.candidate }}" "$RUNNER_TEMP/tape-pr"
          cp -R "$RUNNER_TEMP/tape-pr" "$RUNNER_TEMP/tape-main"
      - name: Replay the first search from the tape on the PR's code and on main's (no AI, no site)
        run: |
          set -o pipefail
          run() { (cd "$1" && node tools/persona-search/run.mjs "${{ matrix.candidate }}" "$RUNNER_TEMP/out-$2" --presses 1 --tag "pr-$2" --fresh --draft "$RUNNER_TEMP/tape-$2/draft.json" --tape "$RUNNER_TEMP/tape-$2" --replay --no-live) > "$RUNNER_TEMP/replay-$2.log" 2>&1; }
          run . pr & pr=$!
          run main-code main & main=$!
          wait $pr || echo "the PR's replay ended with an error (its numbers say how)"
          wait $main || echo "main's replay ended with an error"
          tail -n 4 "$RUNNER_TEMP/replay-pr.log" "$RUNNER_TEMP/replay-main.log"
      - name: Compare (red only for a real Worse)
        run: |
          set -o pipefail
          {
            echo "### ${{ matrix.candidate }}"
            echo "| Candidate | Verdict | Jobs in places | Jobs 70+ | Time to first job | Time to first 70+ job | Why |"
            echo "|---|---|---|---|---|---|---|"
            node tools/persona-search/pr-compare.mjs "${{ matrix.candidate }}" "$RUNNER_TEMP/out-pr" "$RUNNER_TEMP/tape-pr" "$RUNNER_TEMP/out-main" "$RUNNER_TEMP/tape-main"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
