name: CI · Python tests on Windows (by hand)

# The desktop app's Python unit tests (tools/check.sh --area python --app-only, what the Build box runs) on a Windows runner, in about two minutes and without a build or any e2e: for
# making the Windows Build run them like the Mac does (10 Oct 2026: 196 of the 1,943 failed there on the first run, mostly environment). Not part of any release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests · Windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'   # as the app runs its own engine (lib/pipeline-env.js)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install · time-zone data (Windows has none; requirements.txt lists tzdata for it)
        run: python -m pip install tzdata
      - name: Python unit tests (the desktop app's)
        run: bash tools/check.sh --area python --app-only
