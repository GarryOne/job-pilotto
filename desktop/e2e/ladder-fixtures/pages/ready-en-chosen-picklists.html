<!doctype html>
<!-- A hosted-board application form, every required field given: the picklists are react-select controls whose choice is drawn beside an empty search input
     (a chip for one choice, chips for several). Reconstructed from the pool run of 11 Oct 2026 (a chosen Country read "empty", the form judge said "needs Country*"). -->
<html lang="en"><head><meta charset="utf-8"><title>Job Application for Site Reliability Engineer</title>
<style>body{font-family:sans-serif;max-width:640px;margin:24px auto}label{display:block;margin-top:14px}input[type=text],input[type=email]{width:100%;padding:6px}
.select__control{border:1px solid #999;padding:4px;display:flex}.select__value-container{display:flex;gap:6px;flex:1}.select__input{opacity:0;width:2px;border:0}
.select__multi-value{background:#eee;padding:0 4px}.select__placeholder{color:#888}</style></head>
<body><h1>Site Reliability Engineer</h1><h2>Apply for this job</h2>
<form>
<label for="first_name">First Name*</label><input id="first_name" type="text" aria-required="true" value="Alex">
<label for="last_name">Last Name*</label><input id="last_name" type="text" aria-required="true" value="Sample">
<label for="email">Email*</label><input id="email" type="email" aria-required="true" value="alex.sample@example.com">
<fieldset class="phone-input"><legend>Phone</legend>
<div class="select__container"><label id="country-label" for="country">Country*</label><div class="select-shell"><div class="select__control"><div class="select__value-container select__value-container--has-value">
<div class="select__single-value"><span>+41</span></div><div class="select__input-container"><input class="select__input" id="country" role="combobox" type="text" aria-required="true" aria-labelledby="country-label" value=""></div></div></div></div></div>
<label for="phone">Phone*</label><input id="phone" type="text" aria-required="true" value="79 000 00 00"></fieldset>
<div class="select__container"><label id="languages-label" for="languages">Please select all the languages you speak fluently.*</label><div class="select-shell"><div class="select__control"><div class="select__value-container select__value-container--is-multi select__value-container--has-value">
<div class="select__multi-value"><div class="select__multi-value__label">English</div></div><div class="select__multi-value"><div class="select__multi-value__label">German</div></div>
<div class="select__input-container"><input class="select__input" id="languages" role="combobox" type="text" aria-required="true" aria-labelledby="languages-label" value=""></div></div></div></div></div>
<div class="select__container"><label id="source-label" for="source">How did you hear about this opportunity?*</label><div class="select-shell"><div class="select__control"><div class="select__value-container select__value-container--has-value">
<div class="select__single-value">Company website</div><div class="select__input-container"><input class="select__input" id="source" role="combobox" type="text" aria-required="true" aria-labelledby="source-label" value=""></div></div></div></div></div>
<div class="select__container"><label id="gender-label" for="gender">Gender</label><div class="select-shell"><div class="select__control"><div class="select__value-container">
<div class="select__placeholder">Select...</div><div class="select__input-container"><input class="select__input" id="gender" role="combobox" type="text" aria-labelledby="gender-label" value=""></div></div></div></div></div>
<p>Voluntary self-identification is optional.</p>
<button type="submit">Submit application</button>
</form></body></html>
