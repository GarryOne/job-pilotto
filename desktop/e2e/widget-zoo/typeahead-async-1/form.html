<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Example role</title></head>
<body>
<!-- Widget zoo (desktop/e2e/widget-zoo): A search box whose suggestions come 800 ms after two letters; only a picked suggestion counts, free text is cleared on blur. Hand-made, no real site, no personal data. -->
<h1>Apply for Example role</h1>
<form id="apply" onsubmit="return false">
<label for="first">First name</label> <input id="first" name="first_name" type="text" required>
<label for="last">Last name</label> <input id="last" name="last_name" type="text" required>
<label for="mail">Email</label> <input id="mail" name="email" type="email" required>
<label for="office">Office location</label>
<input id="office" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" autocomplete="off" required>
<ul class="suggest" role="listbox" hidden></ul>
<input type="hidden" id="office-id" name="office_id">
</form>
<script>
const box = document.getElementById('office'), list = document.querySelector('.suggest'), id = document.getElementById('office-id'); let timer;
box.addEventListener('input', () => { id.value = ''; clearTimeout(timer); if (box.value.length < 2) { list.hidden = true; return; } timer = setTimeout(() => { const all = ['Zug', 'Zurich', 'Geneva']; list.innerHTML = all.filter(t => t.toLowerCase().startsWith(box.value.toLowerCase().slice(0, 2))).map(t => `<li role="option">${t}</li>`).join(''); list.hidden = false; box.setAttribute('aria-expanded', 'true'); }, 800); });
list.addEventListener('mousedown', e => { const li = e.target.closest('[role=option]'); if (!li) return; e.preventDefault(); box.value = li.textContent; id.value = li.textContent.toLowerCase(); list.hidden = true; box.setAttribute('aria-expanded', 'false'); });
box.addEventListener('blur', () => setTimeout(() => { if (!id.value) box.value = ''; }, 150));
</script>
</body></html>
