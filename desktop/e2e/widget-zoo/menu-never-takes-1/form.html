<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Example role</title></head>
<body>
<!-- Widget zoo (desktop/e2e/widget-zoo): a react-select-shaped picklist whose options close the menu and take nothing (it never takes a value); it counts each time it is opened (data-opens). Hand-made, no real site, no personal data. -->
<h1>Apply for Example role</h1>
<form id="apply" onsubmit="return false">
<label for="first">First name</label> <input id="first" name="first_name" type="text" required>
<label for="last">Last name</label> <input id="last" name="last_name" type="text" required>
<label for="mail">Email</label> <input id="mail" name="email" type="email" required>
<label for="lang">Preferred language</label>
<div class="select__container" id="lang-box" data-opens="0"><div class="select__control"><div class="select__value-container"><div class="select__placeholder">Select...</div><input id="lang" role="combobox" aria-expanded="false" aria-autocomplete="list" required></div></div><div class="select__menu" role="listbox" hidden></div></div>
</form>
<script>
const box = document.getElementById('lang-box'), control = box.querySelector('.select__control'), menu = box.querySelector('.select__menu'), input = document.getElementById('lang'), values = box.querySelector('.select__value-container');
control.addEventListener('mousedown', () => {
  box.dataset.opens = String(Number(box.dataset.opens) + 1);
  menu.innerHTML = ['English', 'German', 'French'].map(t => `<div class="select__option" role="option" aria-selected="false">${t}</div>`).join('');
  menu.hidden = false; input.setAttribute('aria-expanded', 'true');
});
menu.addEventListener('mousedown', event => { if (event.target.closest('[role=option]')) { menu.hidden = true; input.setAttribute('aria-expanded', 'false'); } });   // the pick is ignored: it never takes
</script>
</body></html>
