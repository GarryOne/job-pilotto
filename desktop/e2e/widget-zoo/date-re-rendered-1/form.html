<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Example role</title></head>
<body>
<!-- Widget zoo (desktop/e2e/widget-zoo): a date box that re-renders the typed ISO date in the local writing on change (2026-11-02 shown as 02.11.2026). Hand-made, no real site, no personal data. -->
<h1>Apply for Example role</h1>
<form id="apply" onsubmit="return false">
<label for="first">First name</label> <input id="first" name="first_name" type="text" required>
<label for="last">Last name</label> <input id="last" name="last_name" type="text" required>
<label for="mail">Email</label> <input id="mail" name="email" type="email" required>
<label for="start">Earliest start date</label> <input id="start" name="start" type="text" required>
</form>
<script>
const box = document.getElementById("start"); box.addEventListener("change", () => { const [y, m, d] = box.value.split("-"); if (d) box.value = d + "." + m + "." + y; });
</script>
</body></html>
