<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Example role</title></head>
<body>
<!-- Widget zoo (desktop/e2e/widget-zoo): A read-only date box: typing is refused, a date is set only by a day button in the calendar it opens. Hand-made, no real site, no personal data. -->
<h1>Apply for Example role</h1>
<form id="apply" onsubmit="return false">
<label for="first">First name</label> <input id="first" name="first_name" type="text" required>
<label for="last">Last name</label> <input id="last" name="last_name" type="text" required>
<label for="mail">Email</label> <input id="mail" name="email" type="email" required>
<label for="start">Earliest start date</label>
<input id="start" name="start" type="text" readonly required placeholder="dd.mm.yyyy">
<div class="calendar" hidden></div>
</form>
<script>
const box = document.getElementById('start'), cal = document.querySelector('.calendar');
box.addEventListener('click', () => { cal.innerHTML = '<div>November 2026</div>' + Array.from({length: 30}, (_, i) => `<button type="button" data-day="${i + 1}">${i + 1}</button>`).join(''); cal.hidden = false; });
cal.addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (!b) return; box.value = `${String(b.dataset.day).padStart(2, '0')}.11.2026`; cal.hidden = true; });
</script>
</body></html>
