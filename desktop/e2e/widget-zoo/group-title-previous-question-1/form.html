<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Example role</title></head>
<body>
<!-- Widget zoo (desktop/e2e/widget-zoo): two Yes/No groups; the second's question is a plain <p> right before it, the first's a styled title before the first group. Hand-made, no real site, no personal data. -->
<h1>Apply for Example role</h1><form id="apply" onsubmit="return false">
<label for="first">First name</label> <input id="first" name="first_name" type="text" required>
<label for="last">Last name</label> <input id="last" name="last_name" type="text" required>
<label for="mail">Email</label> <input id="mail" name="email" type="email" required>
<div class="field-title">Are you fluent in English?</div>
<div role="group" id="g1"><button type="button" aria-pressed="false" data-v="yes">Yes</button><button type="button" aria-pressed="false" data-v="no">No</button></div>
<p>Do you need a visa to work here?</p>
<div role="group" id="g2"><button type="button" aria-pressed="false" data-v="yes">Yes</button><button type="button" aria-pressed="false" data-v="no">No</button></div>
</form>
<script>
for (const b of document.querySelectorAll("[aria-pressed]")) b.addEventListener("click", () => { for (const o of b.parentElement.children) o.setAttribute("aria-pressed", "false"); b.setAttribute("aria-pressed", "true"); });
</script>
</body></html>
