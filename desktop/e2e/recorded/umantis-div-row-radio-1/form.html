<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Bewerbung | Stellenmarkt</title>
<style>.form_content_left_boundary{float:left;width:200px}.form_content_right_boundary{float:left}.form_content_row{clear:both;padding:6px}.form_content_label_mustsign{color:#d4560a}</style></head>
<body>
<h1>Persönliche Daten bitte hier erfassen.</h1>
<form id="app" method="post" action="#" onsubmit="return false">
  <div class="form_content_row"><div class="form_content_left_boundary"><div class="form_content_left">Anrede<span class="form_content_label_mustsign">*</span><span class="form_content_label_colon">:</span></div></div>
    <div class="form_content_right_boundary"><div class="form_content_right">
      <span><label for="s1"><input id="s1" name="sal" type="radio"><span>Frau</span></label></span>
      <span><label for="s2"><input id="s2" name="sal" type="radio"><span>Herr</span></label></span>
      <span><label for="s3"><input id="s3" name="sal" type="radio"><span>Divers</span></label></span></div></div></div>
  <div class="form_content_row"><div class="form_content_left_boundary"><div class="form_content_left"><label for="vorname">Vorname<span class="form_content_label_mustsign">*</span>:</label></div></div>
    <div class="form_content_right_boundary"><input type="text" id="vorname" name="vorname"></div></div>
  <div class="form_content_row"><div class="form_content_left_boundary"><div class="form_content_left"><label for="nachname">Nachname<span class="form_content_label_mustsign">*</span>:</label></div></div>
    <div class="form_content_right_boundary"><input type="text" id="nachname" name="nachname"></div></div>
  <div class="form_content_row"><div class="form_content_left_boundary"><div class="form_content_left"><label for="email">E-Mail-Adresse<span class="form_content_label_mustsign">*</span>:</label></div></div>
    <div class="form_content_right_boundary"><input type="email" id="email" name="email"></div></div>
  <button type="button">Weiter</button>
</form>
</body></html>
