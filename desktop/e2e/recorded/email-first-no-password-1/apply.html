<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Apply: Sales Associate | Example Careers</title>
<style>body{font-family:sans-serif;margin:0}form{padding:24px;max-width:520px}label{display:block;margin-top:12px}input,textarea{width:100%;padding:6px}</style></head>
<body><form id="application" onsubmit="return false"><h1>Apply: Sales Associate</h1>
<label for="first_name">First name *</label><input id="first_name" name="first_name" required>
<label for="last_name">Last name *</label><input id="last_name" name="last_name" required>
<label for="phone">Phone *</label><input id="phone" name="phone" type="tel" required>
<label for="motivation">Anything else?</label><textarea id="motivation" name="motivation"></textarea>
<button type="submit">Submit application</button></form></body></html>
