<!doctype html><html lang="en"><head><meta charset="utf-8"><title></title>
<style>body{font-family:sans-serif;margin:0}header{padding:12px;border-bottom:1px solid #ccc}#cover{position:fixed;inset:48px 0 0 0;background:#fff;z-index:10;padding:40px}form{padding:24px;max-width:520px}label{display:block;margin-top:12px}input,textarea{width:100%;padding:6px}</style></head>
<body>
<!-- Hand-cut (15 Oct 2026): a page that shows only its site header (one search box) under a cover while its form is still on the way; 3 s after the load the cover goes and the form is drawn at the same address. -->
<header><input id="site_search" type="text" aria-label="Search jobs" placeholder="Search jobs"></header>
<div id="cover"><p>Loading...</p></div>
<script>
setTimeout(function () {
  document.getElementById('cover').remove();
  document.title = 'Apply: Sales Associate | Example Careers';
  var form = document.createElement('form');
  form.innerHTML = '<h1>Apply: Sales Associate</h1>'
    + '<label for="first_name">First name *</label><input id="first_name" name="first_name" required>'
    + '<label for="last_name">Last name *</label><input id="last_name" name="last_name" required>'
    + '<label for="email">Email *</label><input id="email" name="email" type="email" required>'
    + '<label for="motivation">Anything else?</label><textarea id="motivation" name="motivation"></textarea>'
    + '<button type="submit">Submit application</button>';
  document.body.appendChild(form);
}, 3000);
</script>
</body></html>
