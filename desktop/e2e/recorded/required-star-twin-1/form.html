<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Apply</title>
<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.sheet{position:fixed;inset:0;background:#f5337f;color:#fff;overflow:auto}</style></head>
<body><main><h1>Customer Success Manager</h1></main>
<section class="sheet" role="dialog" aria-modal="true"><form id="apply" action="/send" method="post">
<fieldset><legend><span class="block">Are you based in the city?<sup aria-hidden="true" class="ml-4">*</sup><span class="sr-only">Required</span></span></legend>
<div><input type="radio" name="based" id="b-y"><label for="b-y">Yes</label></div><div><input type="radio" name="based" id="b-n"><label for="b-n">No</label></div></fieldset>
<div><label for="fn">First name<sup aria-hidden="true">*</sup><span class="sr-only">Required</span></label><input id="fn" name="fn" type="text"></div>
<div><label for="ln">Last name<sup aria-hidden="true">*</sup><span class="sr-only">Required</span></label><input id="ln" name="ln" type="text"></div>
<div><label for="em">Email<sup aria-hidden="true">*</sup><span class="sr-only">Required</span></label><input id="em" name="em" type="email"></div>
<div><label for="nt">Notes</label><textarea id="nt" name="nt"></textarea></div>
</form></section></body></html>
