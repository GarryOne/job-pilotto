<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Apply | Example Careers</title></head>
<!-- Hand-cut (13 Oct 2026): a styled "Send application" div whose own script clicks a hidden submit button (the site's code, not the person's click and not the extension's press). Here a timer stands in
     for the person pressing the div: 6 s after the load the page's script clicks the hidden button. That click is untrusted too, and it IS the application being sent: "submit pressed" must be noted. -->
<body><h1>Your application</h1>
<form id="app" action="/send" method="post" novalidate onsubmit="return false">
<div><label for="first">First name *</label><input id="first" name="first" type="text" required></div>
<div><label for="last">Last name *</label><input id="last" name="last" type="text" required></div>
<div><label for="mail">Email *</label><input id="mail" name="mail" type="email" required></div>
<div id="styled-send" role="button" tabindex="0">Send</div>
<button id="hidden-submit" type="submit" style="display:none">Go</button></form>
<script>setTimeout(function () { document.getElementById('hidden-submit').click(); }, 6000);</script></body></html>
