<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Site Reliability Engineer</title></head>
<body>
<main>
  <h1>Site Reliability Engineer</h1>
  <h2>Your application</h2>
  <form action="/submit" method="post">
    <p><label for="first">First name</label> <input id="first" name="first" required></p>
    <p><label for="last">Last name</label> <input id="last" name="last" required></p>
    <p><label for="email">Email</label> <input id="email" name="email" type="email" required></p>
    <p><label for="phone">Phone</label> <input id="phone" name="phone" type="tel"></p>
    <p><label for="city">City</label> <input id="city" name="city"></p>
    <p><label for="cv">CV</label> <input id="cv" name="cv" type="file" required></p>
    <p><label for="start">Earliest start date</label> <input id="start" name="start" required></p>
    <p><button type="submit">Submit application</button></p>
  </form>
</main>
</body></html>
