<!doctype html><html><head><meta charset="utf-8"><title>Apply</title></head><body>
<form onsubmit="return false" style="font:14px system-ui;padding:20px">
<h1>Apply for this job</h1>
<p><label for="first_name">First Name: *</label> <input id="first_name" name="first_name" type="text" required aria-required="true"></p>
<p><label for="last_name">Last Name: *</label> <input id="last_name" name="last_name" type="text" required aria-required="true"></p>
<p><label for="email">Email Address: *</label> <input id="email" name="email" type="email" required aria-required="true"></p>
<p><label for="location">Location *</label> <input id="location" name="location" type="text" role="combobox" aria-required="true" aria-expanded="false" autocomplete="off" style="width:240px">
<input id="location_code" name="location_code" type="hidden"></p>
<p><button type="button">Apply</button></p>
</form>
<ul id="layer" role="listbox" hidden style="position:absolute;top:210px;left:90px;width:240px;background:#fff;border:1px solid #888;list-style:none;margin:0;padding:0"></ul>
<script>
var cities = ["Genève, Suisse","Genoa, Italia","Genk, Belgique"], box = document.getElementById('location'), layer = document.getElementById('layer'), hidden = document.getElementById('location_code');
// Options come from a "server" after REAL keystrokes only (a scripted input event is ignored), start of the name as spelt, no accent folding.
box.addEventListener('input', function (event) {
  if (!event.isTrusted) return;
  var query = box.value.toLowerCase(); hidden.value = ''; layer.hidden = false; layer.innerHTML = '';
  setTimeout(function () { if (box.value.toLowerCase() !== query) return;
    var hits = cities.filter(function (city) { return city.toLowerCase().indexOf(query) === 0; });
    layer.innerHTML = hits.map(function (city) { return '<li role="option" style="padding:4px 8px">' + city + '</li>'; }).join('');
    Array.prototype.forEach.call(layer.querySelectorAll('li'), function (li) { li.addEventListener('click', function () { box.value = li.textContent; hidden.value = li.textContent.slice(0, 3).toUpperCase(); layer.hidden = true; box.setAttribute('aria-expanded', 'false'); }); });
  }, 600);
});
box.addEventListener('mousedown', function () { layer.hidden = false; box.setAttribute('aria-expanded', 'true'); });
</script></body></html>
