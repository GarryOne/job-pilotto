<!doctype html><html lang="en"><head><title>Sales Associate - Geneva</title><style>
a[role=button]{display:block;box-sizing:border-box;height:40px;line-height:40px;text-align:center;background:#222;color:#fff;border-radius:20px;text-decoration:none}
#apply{width:96px}

</style></head><body>
<main id="posting"><h1>Sales Associate - 60%</h1><p>Geneva · Part time</p><p>Join our boutique team.</p>
