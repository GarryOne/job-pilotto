<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Postuler</title></head>
<body>
<!-- Hand-made variant: required marked by aria-required, labels wrapping their boxes, another order and language; one question waits for the AI's late answer. -->
<main class="dossier"><h2>Votre dossier</h2>
<div class="grp"><label class="l">Lieu de domicile actuel <input id="lieu" name="lieu" type="text"></label></div>
<div class="grp"><label class="l">Adresse e-mail <input id="m" name="courriel" type="email" aria-required="true"></label></div>
<div class="grp"><label class="l">Prénom <input id="p" name="prenom" type="text" aria-required="true"></label></div>
<div class="grp"><label class="l">Nom de famille <input id="n" name="nom" type="text" aria-required="true"></label></div>
</main>
</body></html>
