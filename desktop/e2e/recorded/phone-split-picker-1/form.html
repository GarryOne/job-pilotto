<script>
// The site's rule (hand-written here, the capture has no scripts): the number box takes the national part only, a number written with its calling code is refused with the
// site's own message and emptied.
var box = document.getElementById('phoneNumber--phoneNumber'), err = document.getElementById('err');
box.addEventListener('change', function () { if (/^\s*\+/.test(box.value)) { err.textContent = 'Enter a valid format for Phone Number'; box.setAttribute('aria-invalid', 'true'); box.value = ''; } });
box.addEventListener('blur', function () { box.dispatchEvent(new Event('change')); });
