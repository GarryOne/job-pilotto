<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Log in or create account</title></head>
<body>
<header><a href="/">Example Careers</a></header>
<main>
  <form id="identify" action="/identify" method="post" onsubmit="return false">
    <h1>Log in or create account</h1>
    <label for="email-input">Email <span aria-hidden="true">*</span></label>
    <p>If you use a social login, give the email of that account.</p>
    <input id="email-input" name="identifier" type="text" required>
    <button type="submit">Continue</button>
  </form>
</main>
</body></html>
