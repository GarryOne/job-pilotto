<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Example role</title></head>
<body>
<!-- Recorded case toggle-group-named-by-its-label-1: a Yes/No toggle group named by aria-labelledby, after three boxes with their own labels. Hand-made, no real site, no personal data. -->
<h1>Apply for Example role</h1>
<form id="apply" onsubmit="return false">
<label for="first">First name</label> <input id="first" name="first_name" type="text" required>
<label for="last">Last name</label> <input id="last" name="last_name" type="text" required>
<label for="mail">Email</label> <input id="mail" name="email" type="email" required>
<label id="travel-label">Are you open to occasional business travel?</label>
<div class="toggle" role="group" aria-labelledby="travel-label"><button type="button" aria-pressed="false" data-v="yes">Yes</button><button type="button" aria-pressed="false" data-v="no">No</button></div>
</form>
<script>
for (const b of document.querySelectorAll('[aria-pressed]')) b.addEventListener('click', () => { for (const o of b.parentElement.children) o.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-pressed', 'true'); });
</script>
</body></html>
