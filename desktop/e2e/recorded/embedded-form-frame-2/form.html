<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Job Application for Strategic Account Executive at Example</title></head>
<body>
<!-- The embedded application form of a hosted job board (ids and labels as the real page has them), scrubbed. -->
<div class="application--container">
 <form id="application-form" novalidate>
  <h2>Apply for this job</h2>
  <div class="text-input-wrapper"><label for="first_name" class="label">First Name*</label><input type="text" id="first_name" class="input input__single-line" aria-required="true" required></div>
  <div class="text-input-wrapper"><label for="last_name" class="label">Last Name*</label><input type="text" id="last_name" class="input input__single-line" aria-required="true" required></div>
  <div class="text-input-wrapper"><label for="preferred_name" class="label">Preferred First Name*</label><input type="text" id="preferred_name" class="input input__single-line" aria-required="true" required></div>
  <div class="text-input-wrapper"><label for="email" class="label">Email*</label><input type="text" id="email" class="input input__single-line" aria-required="true" required></div>
  <div class="text-input-wrapper"><label for="phone" class="label">Phone*</label><input type="tel" id="phone" class="input input__single-line" aria-required="true" required></div>
  <div class="file-upload"><label for="resume" class="label">Resume/CV*</label><button type="button" class="btn btn--rounded">Attach</button><input type="file" id="resume" class="visually-hidden" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"></div>
  <button type="submit" class="btn btn--pill">Submit application</button>
 </form>
</div>
</body></html>
