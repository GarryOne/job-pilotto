<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Apply</title>
<style>body{font:15px system-ui;margin:24px;max-width:640px} .field{margin:14px 0} label{display:block;font-weight:600;margin-bottom:4px} .req::after{content:" *";color:#c00}</style></head><body>
<form id="application">
<div class="field"><label class="req" for="first">First name</label><input id="first" name="first" required></div>
<div class="field"><label class="req" for="email">Email</label><input id="email" name="email" type="email" required></div>
<div class="field"><label class="req" for="country">Country</label><select id="country" name="country" required><option value="">Please select</option><option>Germany</option><option>Israel</option><option>Switzerland</option><option>United Kingdom</option></select></div>
<div class="field"><label for="city">City</label><input id="city" name="city"></div>
<button type="submit">Submit application</button>
</form></body></html>
