<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Example Co - Engineer - Application</title></head>
<body>
<h1>Engineer</h1>
<form>
  <label for="name">Full name *</label><input id="name" name="name" type="text" required>
  <label for="email">Email address *</label><input id="email" name="email" type="email" required>
  <label for="mobile_q">Have you automated mobile (iOS/Android) or desktop build and publication workflows? *</label><input id="mobile_q" name="mobile_q" type="text" required>
  <label for="mail_q">Do you check your e-mail for failing builds every morning? *</label><input id="mail_q" name="mail_q" type="text" required>
  <label for="phone">Phone *</label><input id="phone" name="phone" type="tel" required>
  <button type="submit">Send</button>
</form>
</body></html>
