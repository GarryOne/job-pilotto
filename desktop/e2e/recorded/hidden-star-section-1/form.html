<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Application form</title><style>.ng-hide{display:none !important}</style></head><body>
<form class="application-form">
<div class="section"><div class="section-header"><h3><span>Contact</span></h3></div>
<label for="n">Full Name<span class="required">*</span></label><input id="n" name="cName" type="text" required>
<label for="e">Email<span class="required">*</span></label><input id="e" name="cEmail" type="email" required></div>
<div class="section"><div class="section-header"><h3><span>Work History</span><span title="Required" class="ng-hide required">*</span></h3></div>
<ul></ul><div class="section-footer"><a href="">Add Position</a></div>
<div class="form-divider"></div>
<div class="section-header"><h3><span>Experience Summary</span></h3></div>
<textarea name="cSummary" class="description"></textarea></div>
</form></body></html>
