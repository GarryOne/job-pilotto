<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Application: Support Engineer</title>
<link rel="stylesheet" href="vendor:intlTelInput.min.css">
<style>body{font:15px system-ui;margin:24px;max-width:640px} .field{margin:14px 0} label.q{display:block;font-weight:600;margin-bottom:4px} .required::after{content:" *";color:#c00}</style></head><body>
<h1>Your application</h1>
<!-- The REAL intl-tel-input 19.5.6 (vendored, desktop/e2e/vendor/): a country picker beside the number box that starts on its own country's dial code. -->
<form id="application" onsubmit="return false">
<div class="field"><label class="q required" for="first">First name</label><input id="first" name="first_name" required></div>
<div class="field"><label class="q required" for="mail">Email</label><input id="mail" name="email" type="email" required></div>
<div class="field"><label class="q required" for="contact_no">Number to reach you</label><input id="contact_no" name="contact_no" type="tel" required></div>
<div class="field"><label class="q required" for="resume">CV</label><input id="resume" name="resume" type="file" required></div>
<button type="submit">Send application</button>
</form>
<script src="vendor:intlTelInput.min.js"></script>
<script src="vendor:intlTelInput-utils.js"></script>
<script>
window.iti = window.intlTelInput(document.getElementById('contact_no'), {initialCountry: 'il', nationalMode: false, autoInsertDialCode: true, utilsScript: ''});
</script>
</body></html>
