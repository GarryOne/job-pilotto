<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Application: Support Specialist</title></head><body>
<h1>Your application</h1>
<p>Autofill from resume: upload a file and we read it for you.</p>
<form id="application" action="/apply/send" method="post">
  <div><label for="first_name">First name *</label><input id="first_name" name="first_name" type="text" required></div>
  <div><label for="last_name">Last name *</label><input id="last_name" name="last_name" type="text" required></div>
  <div><label for="profile_link">Linkedin *</label><input id="profile_link" name="profile_link" type="url" required></div>
  <div><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div><label for="resume">Resume *</label><input id="resume" name="resume" type="file" required></div>
  <button type="submit">Submit Application</button>
</form>
<script>
// The page's own "autofill from resume": once a file is chosen it empties the name and link boxes after 2.5 s and keeps them read-only while it works, until 10 s after the upload
// (a slow reader): the fill's record is read while they are empty. They are typable again after that (the retype watcher then types them, page/browser-form-fastpath.js).
const boxes = () => ['first_name', 'last_name', 'profile_link'].map(id => document.getElementById(id));
document.getElementById('resume').addEventListener('change', () => {
  setTimeout(() => { for (const box of boxes()) { box.value = ''; box.readOnly = true; } }, 2500);
  setTimeout(() => { for (const box of boxes()) box.readOnly = false; }, 10000);
});
</script></body></html>
