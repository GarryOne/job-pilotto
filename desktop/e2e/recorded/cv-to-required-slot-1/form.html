<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Apply</title>
<style>body{font:15px system-ui;margin:24px;max-width:640px} .field{margin:14px 0} label,h3{display:block;font-weight:600;margin-bottom:4px}
.hidden-input{border:0;clip:rect(0,0,0,0);clip-path:inset(50%);height:1px;margin:0 -1px -1px 0;overflow:hidden;padding:0;position:absolute;width:1px;white-space:nowrap}
.drop{border:1px dashed #999;padding:14px;border-radius:6px} .required::after{content:" *";color:#c00}</style></head><body>
<div class="autofill-pane"><div class="autofill-root"><input class="hidden-input" type="file" tabindex="-1" accept=".pdf,.doc,.docx">
<div class="drop"><h3>Autofill from resume</h3><p>Upload your resume here to autofill key application fields.</p><button type="button">Upload file</button></div></div></div>
<form id="application">
<div class="field"><label class="required" for="first">First name</label><input id="first" name="first" required></div>
<div class="field"><label class="required" for="email">Email</label><input id="email" name="email" type="email" required></div>
<div class="field"><label class="required" for="resume">CV</label><div class="drop"><input class="hidden-input" type="file" tabindex="-1" id="resume" required accept=".pdf,.doc,.docx"><div>Upload File or drag and drop here</div></div></div>
<button type="submit">Submit application</button>
</form></body></html>
