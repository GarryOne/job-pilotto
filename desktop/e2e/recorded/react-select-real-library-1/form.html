<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Application: Data Analyst</title>
<style>body{font:15px system-ui;margin:24px;max-width:640px} .field{margin:14px 0} label.q{display:block;font-weight:600;margin-bottom:4px} .required::after{content:" *";color:#c00}</style></head><body>
<h1>Your application</h1>
<!-- The REAL react-select 5.8.0 (vendored, desktop/e2e/vendor/): a required Country menu drawn as a chip beside an empty search input; the options draw on the click. -->
<form id="application" onsubmit="return false">
<div class="field"><label class="q required" for="first">First name</label><input id="first" name="first_name" required></div>
<div class="field"><label class="q required" for="mail">Email</label><input id="mail" name="email" type="email" required></div>
<div class="field"><label class="q required" id="country-label" for="country">Country</label><div id="country-root"></div></div>
<div class="field"><label class="q required" for="resume">CV</label><input id="resume" name="resume" type="file" required></div>
<button type="submit">Send application</button>
</form>
<script src="vendor:react.production.min.js"></script>
<script src="vendor:react-dom.production.min.js"></script>
<script src="vendor:react-select.min.js"></script>
<script>
const options = ['Germany', 'Switzerland', 'France', 'Italy'].map(label => ({value: label.toLowerCase(), label}));
ReactDOM.createRoot(document.getElementById('country-root')).render(React.createElement(ReactSelect, {inputId: 'country', name: 'country', options, classNamePrefix: 'select', placeholder: 'Select...', required: true}));
</script>
</body></html>
