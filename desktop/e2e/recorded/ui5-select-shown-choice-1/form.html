<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Apply</title><style>.sapUiPseudoInvisibleText{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style></head><body>
<form onsubmit="return false" style="font:14px system-ui;padding:20px">
<p><label for="first_name">First Name *</label> <input id="first_name" name="first_name" type="text" required aria-required="true" value="Ada"></p>
<!-- The markup of OpenUI5's sap.m.SelectRenderer (written from the renderer's code, not captured from a live page): a pseudo-invisible role=combobox div holding the shown choice, a hidden input holding its key, the visible label span. -->
<div><label id="country-l">Country *</label>
<div id="country" class="sapMSlt sapMSltDefault sapMSltWithArrow"><div id="country-hiddenSelect" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-required="true" aria-labelledby="country-l" class="sapUiPseudoInvisibleText sapMSltHiddenSelect" tabindex="0">Switzerland</div><input id="country-hiddenInput" name="country" value="CH" aria-readonly="true" tabindex="-1" aria-hidden="true" class="sapUiPseudoInvisibleText"><span id="country-label" aria-hidden="true" class="sapMSltLabel"><span class="sapMSelectListItemText">Switzerland</span></span><span class="sapMSltArrow" aria-hidden="true">&#9662;</span></div></div>
<div><label id="news-l">I would like to receive the newsletter *</label>
<div id="news" class="sapMSlt sapMSltDefault sapMSltWithArrow"><div id="news-hiddenSelect" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-required="true" aria-labelledby="news-l" class="sapUiPseudoInvisibleText sapMSltHiddenSelect" tabindex="0">No</div><input id="news-hiddenInput" name="news" value="false" aria-readonly="true" tabindex="-1" aria-hidden="true" class="sapUiPseudoInvisibleText"><span id="news-label" aria-hidden="true" class="sapMSltLabel"><span class="sapMSelectListItemText">No</span></span><span class="sapMSltArrow" aria-hidden="true">&#9662;</span></div></div>
<p><button type="button">Apply</button></p>
</form></body></html>
