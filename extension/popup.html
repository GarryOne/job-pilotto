<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Pilotto</title>
<style>
  [hidden] { display: none !important; }   /* a rule below with its own display (.visit: grid) would beat the hidden attribute */
  :root { --ink: #182537; --muted: #5b6b80; --line: #e2e8f0; --signal: #d9540b; --good: #1f9d55; }
  * { box-sizing: border-box; }
  body { width: 300px; margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: #fff; }
  header { display: flex; align-items: center; gap: 8px; padding: 11px 14px; background: #132439; color: #fff; }
  header img { border-radius: 5px; }
  header a { margin-left: auto; color: #b9c8dc; font-size: 12px; text-decoration: none; }
  header a:hover { color: #fff; }
  main { padding: 14px; display: grid; gap: 10px; }
  p { margin: 0; color: var(--muted); }
  button { font: inherit; font-weight: 600; padding: 9px 12px; border: 0; border-radius: 8px; background: var(--signal); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.on::before { background: var(--good); }
  .visit { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  .visit small { color: var(--muted); font-size: 11px; }
  button.quiet { background: #fff; color: var(--ink); border: 1px solid var(--line); }
</style>
</head>
<body>
<header><img src="icons/icon-48.png" alt="" width="22" height="22"><b>Job Pilotto</b><a href="#" id="settings">Settings</a></header>
<main>
  <p id="intro">The application panel appears only on a tab the Job Pilotto app opens: press <b>Apply</b> in the app.</p>
  <section class="visit" id="visit" hidden>
    <p id="visit-text">A job list the app cannot read by itself? Read it from here: this page and its next pages, then the app filters and scores the jobs.</p>
    <button id="visit-filter">Filter for my search, then read</button>
    <button id="visit-read" class="quiet">Read the jobs as they are</button>
    <button id="visit-allow" class="quiet" hidden>Allow on the sites the app opens</button>
    <small id="visit-note"></small>
    <small id="visit-progress"></small>
  </section>
  <div class="status" id="status">Checking the connection…</div>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
