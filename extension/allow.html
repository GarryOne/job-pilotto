<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Pilotto: allow reading</title>
<style>
  [hidden] { display: none !important; }   /* a rule below with its own display (.visit: grid) would beat the hidden attribute */
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #182537; background: #f4f6fa; display: grid; place-items: center; min-height: 100vh; }
  main { max-width: 440px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 28px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 19px; }
  p { margin: 0; color: #5b6b80; }
  button { font: inherit; font-weight: 600; padding: 11px 16px; border: 0; border-radius: 8px; background: #d9540b; color: #fff; cursor: pointer; }
  .done { color: #1f9d55; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Job Pilotto is waiting for you</h1>
  <p>The Job Pilotto app opened job sites for the extension to read. Chrome needs your OK, once, before the extension may read the sites the app opens. You can withdraw it any time in Chrome's extension settings.</p>
  <button id="allow">Allow on the sites the app opens</button>
  <p id="said"></p>
</main>
<script type="module" src="allow.js"></script>
</body>
</html>
